  const nz = (t, dur, peak, type, f, q = 1, f2 = null, a = 0.002) => {
    const s = ctx.createBufferSource(), b = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; s.loop = true; b.type = type; b.frequency.setValueAtTime(f, t); b.Q.value = q;
    if (f2) b.frequency.exponentialRampToValueAtTime(f2, t + dur);
    env(g, t, a, peak, dur); s.connect(b); b.connect(g); g.connect(master); s.start(t); s.stop(t + a + dur + 0.05);
  };
  // 音效
  for (const [t, kind, gn, k] of cueList()) {
    if (t < 0 || t > DURATION) continue;
    if (kind === "tick") nz(t, 0.035, 0.5 * gn, "bandpass", 3600, 1.2);
    else if (kind === "tap") osc("sine", 880, t, 0.09, 0.35 * gn, 0.002, master, 640);
    else if (kind === "clink") { osc("sine", 1568, t, 0.7, 0.25 * gn); osc("sine", 2349, t, 0.5, 0.15 * gn); }
    else if (kind === "whoosh") nz(t, 0.5, 0.35 * gn, "bandpass", 400, 0.8, 3200, 0.18);
    else if (kind === "thump") { osc("sine", 95, t, 0.32, 0.55 * gn, 0.003, master, 48); nz(t, 0.08, 0.12 * gn, "lowpass", 900); }
    else if (kind === "pulse") { osc("sine", 74, t, 0.7, 0.4 * gn, 0.012, master, 50); nz(t, 0.05, 0.12 * gn, "bandpass", 2200, 1.1); }
    else if (kind === "tapN") osc("sine", mhz(76 + [0, 2, 4, 7, 9, 11, 12][k || 0]), t, 0.11, 0.32 * gn, 0.002, master, mhz(71 + [0, 2, 4, 7, 9, 11, 12][k || 0]));
    else if (kind === "pop") osc("sine", 520, t, 0.12, 0.34 * gn, 0.003, master, 1040);
    else if (kind === "soft") for (const [m, a] of [[76, 0.22], [83, 0.14]]) osc("sine", mhz(m), t, 1.6, a * gn, 0.06);
    else if (kind === "chime") for (const [m, a] of [[84, 0.3], [88, 0.2], [91, 0.16], [96, 0.08]]) osc("sine", mhz(m), t, 3.2, a * gn, 0.004);
  }

  master.gain.setValueAtTime(0.8, DURATION - 3); master.gain.linearRampToValueAtTime(0, DURATION);
};
let AC = null, ABUF = null, ASRC = null, muted = false, ARENDER = null;
function ensureAudio() {
  if (!ARENDER) ARENDER = (async () => {
    const sr = 44100, off = new OfflineAudioContext(2, Math.ceil(sr * DURATION), sr);
    await window.buildAudio(off); ABUF = await off.startRendering(); return ABUF;
  })();
  return ARENDER;
}
function stopAudio() { if (ASRC) { try { ASRC.stop(); } catch (e) { /* 已停止 */ } ASRC.disconnect(); ASRC = null; } }
function startAudio() {
  stopAudio();
  if (muted || !ABUF || !AC || !playing) return;
  ASRC = AC.createBufferSource(); ASRC.buffer = ABUF; ASRC.connect(AC.destination); ASRC.start(0, Math.min(now, DURATION - 0.01));
}

let sceneEls = [], subG, subTx, backdrop, intro, subCue = null;
function build() {
  SVG.textContent = ""; FID = 0; subCue = null;
  DEFS = el("defs", {}, SVG);
  defsDark();
  backdrop = buildBackdrop(el("g", {}, SVG));
  // 无外框（v9）：场景内容整体放大 STAGE_S 倍铺满画面；顶部从 y=STAGE_TOP 开始
  const centered = typeof CENTER_SHOTS !== "undefined" && CENTER_SHOTS;
  const ty = centered ? STAGE_CY * (1 - STAGE_S) : STAGE_TOP - 130 * STAGE_S;
  const root = el("g", { transform: `translate(${(960 * (1 - STAGE_S)).toFixed(2)} ${ty.toFixed(2)}) scale(${STAGE_S})` }, SVG);
  sceneEls = SCENES.map(s => { const sg = el("g", {}, root), cg = el("g", {}, sg), api = s.build(cg); if (centered) centerShots(cg); return { sg, cg, api }; });
  intro = buildIntro(SVG, INTRO);
  // 暗房版（v10）：不挂章节眉标、不画进度线；字幕不画底框，只用文字暗影，核心词可跳色
  subG = el("g", {}, SVG);
  subTx = T(subG, W / 2, 1000, "", { size: SUB, anchor: "middle", fill: PAL.ink, weight: 600 });
  subTx.setAttribute("filter", "url(#subShadow)");
}
/** 把场景里的每个镜头组整体平移到画面垂直中心（夹在安全带内）；镜头内部的相对位置不变 */
function centerShots(cg) {
  [...cg.children].forEach(shot => {
    if (shot.tagName !== "g") return;
    const b = shot.getBBox();
    if (!b.height) return;
    let dy = STAGE_CY - (b.y + b.height / 2);
    if (b.y + dy < BAND[0]) dy = BAND[0] - b.y;
    if (b.y + b.height + dy > BAND[1]) dy = Math.max(BAND[0] - b.y, BAND[1] - b.y - b.height);
    const wrap = el("g", { transform: `translate(0 ${dy.toFixed(1)})` });
    cg.insertBefore(wrap, shot); wrap.appendChild(shot);
  });
}
/** 字幕：整句一个 <text>，核心词放进单独的 <tspan> 换色（SUB_HL 与 SUBS 一一对应） */
function setSub(i) {
  subTx.textContent = "";
  const [, , s] = SUBS[i], hl = (typeof SUB_HL !== "undefined" && SUB_HL[i]) || null;
  const k = hl ? s.indexOf(hl[0]) : -1;
  if (k < 0) { subTx.textContent = s; return; }
  const add = (str, fill) => { if (!str) return; const ts = el("tspan", fill ? { fill } : {}, subTx); ts.textContent = str; };
  add(s.slice(0, k)); add(hl[0], hl[1] === "green" ? PAL.subGreen : PAL.subWarm); add(s.slice(k + hl[0].length));
}
function render(T_) {
  const t = clamp(T_, 0, DURATION);
  let camNow = { s: 1, fx: 960, fy: 540 };
  SCENES.forEach((s, i) => {
    const se = sceneEls[i], last = i === SCENES.length - 1;
    const on = t >= s.start - 0.001 && (t < s.end || (last && t <= s.end));
    se.sg.setAttribute("display", on ? "inline" : "none");
    if (!on) return;
    const lt = t - s.start, c = se.api.cam ? se.api.cam(lt) : camNow;
    se.cg.setAttribute("transform", `translate(960 540) scale(${c.s.toFixed(5)}) translate(${(-c.fx).toFixed(2)} ${(-c.fy).toFixed(2)})`);
    se.api.update(lt);
    camNow = c;
  });
  backdrop(t);
  intro.update(t);
  const ci = SUBS.findIndex(c => t >= c[0] && t <= c[1]);
  if (ci >= 0) {
    const cue = SUBS[ci];
    if (subCue !== ci) { setSub(ci); subCue = ci; }
    op(subG, Math.min(eo(seg(t, cue[0], cue[0] + 0.22)), 1 - seg(t, cue[1] - 0.18, cue[1])));
  } else op(subG, 0);
}

// ---------------------------------------------------------------------------
// 播放控制、章节、?t= 定格
// ---------------------------------------------------------------------------
const qs = new URLSearchParams(location.search);
const frozen = qs.has("t") || qs.has("render");
let now = qs.has("t") ? Number(qs.get("t")) / 1000 : 0, playing = false, lastTs = 0;
const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function seek(sec) {
  now = clamp(sec, 0, DURATION); render(now);
  $("scrub").value = Math.round(now / DURATION * 1000);
  $("time").textContent = `${fmt(now)} / ${fmt(DURATION)}`;
  document.querySelectorAll("#chapters button").forEach((b, j) => {   // 第 0 个按钮是冷开场
    const i = j - 1;
    b.classList.toggle("on", i < 0 ? now < INTRO_T : now >= SCENES[i].start && (now < SCENES[i].end || (i === SCENES.length - 1 && now >= SCENES[i].start)));
  });
}
function setPlaying(p) {
  playing = p; $("play").textContent = p ? "❚❚" : "▶";
  if (p && now >= DURATION) seek(0);
  lastTs = performance.now();
  if (p && !muted) {
    try { AC = AC || new AudioContext(); AC.resume(); } catch (e) { AC = null; }
    if (!ABUF) $("mute").textContent = "声音 加载中";
    ensureAudio().then(() => { $("mute").textContent = muted ? "声音 关" : "声音 开"; startAudio(); });
  } else stopAudio();
}
/** 用户主动跳转（拖进度条、点章节、方向键）：画面跳过去，正在播放时声音也从新位置接上 */
function userSeek(sec) { seek(sec); if (playing) startAudio(); }
let lastFrame = 0;
function tick() {
  const ts = performance.now();
  if (playing) { seek(now + (ts - lastTs) / 1000); if (now >= DURATION) setPlaying(false); }
  lastTs = ts;
}
function loop() { lastFrame = performance.now(); tick(); requestAnimationFrame(loop); }
setInterval(() => { if (!frozen && performance.now() - lastFrame > 200) tick(); }, 50);   // 后台或不出帧时兜底推进
function initControls() {
  const marks = $("marks"), chaps = $("chapters");
  const b0 = document.createElement("button"); b0.textContent = INTRO.button; b0.onclick = () => userSeek(0); chaps.appendChild(b0);
  SCENES.forEach((s, i) => {
    const m = document.createElement("i"); m.style.left = `${s.start / DURATION * 100}%`; marks.appendChild(m);
    const b = document.createElement("button"); b.textContent = s.title;
    b.onclick = () => userSeek(s.start); chaps.appendChild(b);
  });
  $("play").onclick = () => setPlaying(!playing);
  $("scrub").oninput = e => userSeek(e.target.value / 1000 * DURATION);
  $("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "声音 关" : "声音 开"; if (muted) stopAudio(); else if (playing) setPlaying(true); };
  addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === "ArrowRight") userSeek(now + 5);
    else if (e.key === "ArrowLeft") userSeek(now - 5);
    else if (e.key === "m" || e.key === "M") $("mute").click();
    else if (/^[1-6]$/.test(e.key)) userSeek(SCENES[Number(e.key) - 1].start);
    else if (e.key === "0") userSeek(0);
  });
}

/** 排版自检：可见文字不重叠、不出外框（拉杆两侧按裁剪框计算，飞入途中的卡片不计出框） */
window.__audit = function (stepMs = 200) {
  const issues = [];
  const sr = SVG.getBoundingClientRect(), k = W / sr.width;
  const box = r => ({ x0: (r.left - sr.left) * k, y0: (r.top - sr.top) * k, x1: (r.right - sr.left) * k, y1: (r.bottom - sr.top) * k });
  const meta = e => {
    let a = 1, clip = null, transit = false;
    for (let n = e; n && n !== SVG; n = n.parentNode) {
      if (n.getAttribute("display") === "none" || n.getAttribute("visibility") === "hidden") return { a: 0 };
      if (n.getAttribute("data-transit") === "1") transit = true;
      const o = n.getAttribute("opacity"); if (o !== null) a *= Number(o);
      const cr = n.getAttribute("data-clipref");
      if (cr && !clip) clip = box(SVG.querySelector(`[data-clipbox="${cr}"]`).getBoundingClientRect());
    }
    return { a, clip, transit };
  };
  for (let ms = 0; ms <= DURATION * 1000; ms += stepMs) {
    render(ms / 1000);
    const boxes = [];
    SVG.querySelectorAll("text").forEach(e => {
      if (!e.textContent.trim()) return;
      const m = meta(e); if (m.a < 0.05) return;
      let b = box(e.getBoundingClientRect());
      if (m.clip) { b = { x0: Math.max(b.x0, m.clip.x0), x1: Math.min(b.x1, m.clip.x1), y0: b.y0, y1: b.y1 }; if (b.x1 - b.x0 < 3) return; }
      b.s = e.textContent.slice(0, 16);
      if (!m.transit && (b.x0 < SAFE - 1 || b.y0 < SAFE - 1 || b.x1 > W - SAFE + 1 || b.y1 > H - SAFE + 1)) issues.push({ ms, kind: "出框", a: b.s });
      boxes.push(b);
    });
    for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
      const p = boxes[i], q = boxes[j];
      const ox = Math.min(p.x1, q.x1) - Math.max(p.x0, q.x0), oy = Math.min(p.y1, q.y1) - Math.max(p.y0, q.y0);
      if (ox > 3 && oy > 6) issues.push({ ms, kind: "重叠", a: p.s, b: q.s, ox: Math.round(ox), oy: Math.round(oy) });
    }
  }
  render(now);
  return issues;
};
window.__fontAudit = function () {
  const small = new Set();
  SVG.querySelectorAll("text").forEach(e => { const s = Number(e.getAttribute("font-size")); if (s < AUX && e.textContent.trim()) small.add(`${s}px ${e.textContent.slice(0, 12)}`); });
  if (Number(subTx.getAttribute("font-size")) < SUB) small.add("字幕");
  return [...small];
};
window.seekMs = ms => seek(ms / 1000);
window.VIDEO = { w: W, h: H, duration: DURATION };

async function start() {
  build();
  const all = Array.from(SVG.querySelectorAll("text")).map(e => e.textContent).join("") + SUBS.map(s => s[2]).join("")
    + JSON.stringify(D) + "0123456789%→" + SCENES.map(s => s.title).join("");
  if (document.fonts && document.fonts.load) {
    const fam = [["Noto Sans SC", ["400", "500", "700"]], ["Noto Serif SC", ["600", "700", "900"]], ["Inter", ["400", "500", "600", "700"]],
      ["Newsreader", ["500", "700", "800"]], ["JetBrains Mono", ["400", "500", "700"]]];
    const loads = fam.flatMap(([f, ws]) => ws.map(w => document.fonts.load(`${w} 32px "${f}"`, all)))
      .concat([document.fonts.load('italic 500 32px "Newsreader"', all), document.fonts.load('italic 600 32px "Noto Serif SC"', all)]);
    await Promise.race([Promise.allSettled(loads), new Promise(r => setTimeout(r, 5000))]);
    build();
  }
  if (frozen) { document.body.classList.add("capture"); render(now); }
  else {
    if (qs.has("clean")) document.body.classList.add("capture");
    initControls(); seek(now);
    if (qs.has("autoplay")) setPlaying(true);
    requestAnimationFrame(loop);
    setTimeout(() => ensureAudio(), 300);   // 后台预渲染配乐，点播放时不用等
  }
  window.__promoReady = true;
}
start();
</script>
