}
function renderTabs() {
  const it = item(); const v = vote(); const seen = state.seen[it.sid] || [];
  $("tabs").querySelectorAll(".tab").forEach(t => t.remove());
  const frag = document.createDocumentFragment();
  it.cands.forEach((c, k) => {
    const b = document.createElement("button");
    b.className = "tab" + (v.best === c.code ? " best" : ""); b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(k === state.tab && !state.split || state.split && k === state.tab));
    b.innerHTML = `${LETTERS[k]}<span class="seen ${seen.includes(k) ? "on" : ""}" title="${seen.includes(k) ? "已读过" : "未读"}"></span>`;
    b.onclick = () => showTab(k); frag.appendChild(b);
  });
  $("tabs").insertBefore(frag, $("tabs").querySelector(".modes"));
}
function markSeen(k) { const s = (state.seen[item().sid] ||= []); if (!s.includes(k)) { s.push(k); save(); } }
function showTab(k, keepRatio = true) {
  const r = keepRatio ? ratio($("paneL")) : 0;
  state.tab = k; $("docL").innerHTML = md(item().cands[k].text); $("selL").value = k;
  requestAnimationFrame(() => setRatio($("paneL"), r));
  markSeen(k); renderTabs(); renderVote();
}
function showRight(k, keepRatio = true) { const r = keepRatio ? ratio($("paneR")) : 0; state.right = k; $("docR").innerHTML = md(item().cands[k].text); $("selR").value = k; requestAnimationFrame(() => setRatio($("paneR"), r)); markSeen(k); renderTabs(); }
function renderVote() {
  const it = item(); const v = vote(); const seen = state.seen[it.sid] || [];
  const mk = (kind) => it.cands.map((c, k) => `<button class="pick ${kind}" data-kind="${kind}" data-code="${c.code}" aria-pressed="${v[kind] === c.code}" aria-label="${kind === "best" ? "最好读" : "最难读"}：${LETTERS[k]}">${LETTERS[k]}</button>`).join("");
  $("bestPicks").innerHTML = mk("best"); $("worstPicks").innerHTML = mk("worst");
  $("tie").checked = !!v.tie; $("note").value = v.note || "";
  const unread = it.cands.length - seen.length;
  const st = $("status");
  if (unread > 0) { st.textContent = `还有 ${unread} 个版本没打开过。建议每版至少读完一遍再选。`; st.className = "status warn"; }
  else if (!v.best) { st.textContent = "4 个版本都读过了，选出最好读的一版就可以去下一篇。"; st.className = "status"; }
  else { st.textContent = "已记录。可以去下一篇，也可以随时回来改。"; st.className = "status"; }
  $("prevBtn").disabled = state.i === 0;
  $("nextBtn").textContent = state.i === DATA.items.length - 1 ? "完成" : "下一篇";
}
function renderItem() {
  const it = item();
  $("brief").innerHTML = `第 ${state.i + 1} / ${DATA.items.length} 篇：<b>${esc(it.title)}</b>。下面是同一篇内容的 ${it.cands.length} 个版本，来源已隐去，顺序是随机的。` +
    (it.prompt ? `<br>当时的提问：${esc(it.prompt)}` : "");
  const opts = it.cands.map((_, k) => `<option value="${k}">${LETTERS[k]}</option>`).join("");
  $("selL").innerHTML = opts; $("selR").innerHTML = opts;
  state.tab = 0; state.right = Math.min(1, it.cands.length - 1);
  $("paneL").scrollTop = 0; $("paneR").scrollTop = 0;
  showTab(0, false); if (state.split) showRight(state.right, false);
  state.started[it.sid] = Date.now();
  renderProgress();
}
function go(k) {
  tick(); if (k < 0) return;
  if (k >= DATA.items.length) { $("main").classList.add("hidden"); $("finish").classList.remove("hidden"); return; }
  state.i = k; save(); $("main").classList.remove("hidden"); $("finish").classList.add("hidden"); renderItem();
}
function tick() { const it = item(); const t0 = state.started[it.sid]; if (t0) { vote().seconds = (vote().seconds || 0) + Math.round((Date.now() - t0) / 1000); state.started[it.sid] = Date.now(); save(); } }
function setSplit(on) {
  state.split = on; $("panes").classList.toggle("split", on); $("paneR").classList.toggle("hidden", !on);
  $("modeSingle").setAttribute("aria-pressed", String(!on)); $("modeSplit").setAttribute("aria-pressed", String(on));
  if (on) { const k = state.tab === state.right ? (state.tab + 1) % item().cands.length : state.right; showRight(k); }
}

// ---- 事件 ----
document.addEventListener("click", e => {
  const p = e.target.closest(".pick"); if (p) { const v = vote(); const kind = p.dataset.kind, code = p.dataset.code;
    v[kind] = v[kind] === code ? null : code;
    if (v.best && v.best === v.worst) v[kind === "best" ? "worst" : "best"] = null;
    save(); renderVote(); renderTabs(); renderProgress(); return; }
  const d = e.target.closest(".dot"); if (d) go(+d.dataset.k);
});
$("tie").onchange = e => { vote().tie = e.target.checked; save(); };
$("note").oninput = e => { vote().note = e.target.value; save(); };
$("prevBtn").onclick = () => go(state.i - 1);
$("nextBtn").onclick = () => go(state.i + 1);
$("backBtn").onclick = () => go(DATA.items.length - 1);
$("modeSingle").onclick = () => setSplit(false);
$("modeSplit").onclick = () => setSplit(true);
$("selL").onchange = e => showTab(+e.target.value);
$("selR").onchange = e => showRight(+e.target.value);
let syncing = false;
["paneL", "paneR"].forEach((id, k) => $(id).addEventListener("scroll", () => {
  if (!state.split || syncing) return; syncing = true;
  setRatio($(k ? "paneL" : "paneR"), ratio($(id))); requestAnimationFrame(() => syncing = false);
}));
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea,input,select")) return;
  if (/^[1-6]$/.test(e.key) && +e.key <= item().cands.length) showTab(+e.key - 1);
  else if (e.key === "ArrowRight") go(state.i + 1);
  else if (e.key === "ArrowLeft") go(state.i - 1);
});
$("exportBtn").onclick = () => {
  tick();
  const done = DATA.items.filter(it => state.votes[it.sid] && state.votes[it.sid].best).length;
  const blob = new Blob([JSON.stringify({ run: DATA.run, exported_at: new Date().toISOString(), completed: done, total: DATA.items.length, votes: state.votes }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "blind_votes.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  $("status").textContent = `已导出 ${done} / ${DATA.items.length} 篇的投票。`; $("status").className = "status";
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (j.run !== DATA.run) throw new Error("这份进度属于另一轮盲测（" + j.run + "）");
    state.votes = j.votes || {}; save(); renderItem(); $("status").textContent = "进度已载入。"; }
  catch (err) { $("status").textContent = "载入失败：" + err.message; $("status").className = "status warn"; }
  e.target.value = "";
};
window.addEventListener("beforeunload", tick);

load(); renderItem();
</script>
</body>
</html>
