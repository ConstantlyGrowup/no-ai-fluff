<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盲测：哪一版更好读</title>
<style>
:root{
  --paper:#F5F7F4; --sheet:#FCFDFB; --ink:#1E2422; --ink-soft:#4A5450; --muted:#87918C;
  --rule:#6E9A80; --rule-faint:#D6E2DA; --red:#B3392F; --red-wash:#F6E3E0;
  --serif:"Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rule);outline-offset:2px}

/* 顶栏 */
.top{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--rule-faint);background:var(--sheet)}
.top h1{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;letter-spacing:.02em}
.progress{display:flex;gap:5px;align-items:center;flex:1;min-width:0}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule-faint);background:none;font-size:11px;color:var(--muted);display:grid;place-items:center;flex:none}
.dot.done{border-color:var(--rule);color:var(--ink)}
.dot.cur{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.top .tools{display:flex;gap:8px}
.btn{border:1px solid var(--rule-faint);background:var(--sheet);border-radius:6px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--rule)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* 主体 */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.reader{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule-faint)}
.brief{padding:16px 32px 0;color:var(--ink-soft);font-size:14px;line-height:1.7;max-width:46em}
.brief b{color:var(--ink);font-weight:600}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:14px 32px 0;border-bottom:1.5px solid var(--rule)}
.tab{position:relative;border:1.5px solid transparent;border-bottom:none;background:none;padding:6px 18px 8px;font-family:var(--serif);font-size:18px;color:var(--muted);border-radius:6px 6px 0 0;margin-bottom:-1.5px}
.tab[aria-selected="true"]{border-color:var(--rule);background:var(--sheet);color:var(--ink)}
.tab .seen{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--rule-faint)}
.tab .seen.on{background:var(--rule)}
.tab.best{color:var(--red)}
.tab.best::after{content:"";position:absolute;inset:3px 8px 5px;border:1.5px solid var(--red);border-radius:50%;transform:rotate(-6deg);pointer-events:none}
.modes{margin-left:auto;display:flex;gap:4px;padding-bottom:6px}
.modes .btn{padding:4px 10px;font-size:13px}
.modes .btn[aria-pressed="true"]{border-color:var(--rule);background:var(--rule-faint)}

.panes{flex:1;display:grid;grid-template-columns:1fr;min-height:0;background:var(--sheet)}
.panes.split{grid-template-columns:1fr 1fr}
.pane{overflow-y:auto;min-height:0;padding:28px 32px 80px}
.panes.split .pane:first-child{border-right:1px solid var(--rule-faint)}
.pane-head{display:none;align-items:center;gap:8px;margin:-12px 0 16px;color:var(--muted);font-size:13px}
.panes.split .pane-head{display:flex}
.pane-head select{font:inherit;border:1px solid var(--rule-faint);border-radius:4px;background:var(--sheet);padding:2px 6px}

/* 正文排版：宋体、约 36 字一行 */
.doc{font-family:var(--serif);font-size:17px;line-height:1.9;max-width:36em;margin:0 auto;color:var(--ink)}
.panes.split .doc{font-size:16px}
.doc h1,.doc h2,.doc h3,.doc h4{font-weight:600;line-height:1.5;margin:1.4em 0 .5em}
.doc h1{font-size:1.35em}.doc h2{font-size:1.2em}.doc h3{font-size:1.08em}.doc h4{font-size:1em}
.doc p{margin:0 0 .9em}
.doc ul,.doc ol{margin:0 0 .9em;padding-left:1.6em}
.doc li{margin:.2em 0}
.doc blockquote{margin:0 0 .9em;padding:.1em 0 .1em 1em;border-left:3px solid var(--rule-faint);color:var(--ink-soft)}
.doc code{font-family:var(--mono);font-size:.86em;background:#EEF2EF;padding:.05em .3em;border-radius:3px}
.doc pre{background:#EEF2EF;padding:12px 14px;border-radius:6px;overflow-x:auto;line-height:1.55;font-size:13.5px}
.doc pre code{background:none;padding:0;font-size:inherit}
.doc table{border-collapse:collapse;margin:0 0 1em;font-size:.92em;line-height:1.6}
.doc th,.doc td{border:1px solid var(--rule-faint);padding:4px 10px;text-align:left;vertical-align:top}
.doc th{background:#EEF2EF;font-weight:600}
.doc hr{border:none;border-top:1px dashed var(--rule-faint);margin:1.4em 0}
.doc a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule)}

/* 投票栏 */
.vote{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;background:var(--paper)}
.vote h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 8px}
.vote p.hint{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.6}
.picks{display:flex;gap:8px}
.pick{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule-faint);background:var(--sheet);font-family:var(--serif);font-size:18px;display:grid;place-items:center}
.pick:hover{border-color:var(--ink-soft)}
.pick[aria-pressed="true"].best{border-color:var(--red);color:var(--red);background:var(--red-wash)}
.pick[aria-pressed="true"].worst{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.pick:disabled{opacity:.3;cursor:default}
label.tie{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft)}
textarea{width:100%;min-height:90px;resize:vertical;font:inherit;font-size:14px;line-height:1.6;border:1px solid var(--rule-faint);border-radius:6px;padding:8px 10px;background:var(--sheet)}
.nav{display:flex;gap:8px;margin-top:auto}
.nav .btn{flex:1;padding:9px}
.status{font-size:13px;color:var(--muted);line-height:1.6}
.status.warn{color:var(--red)}
.keys{font-size:12px;color:var(--muted);line-height:1.8}
.keys kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-faint);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--sheet)}

/* 完成页 */
.finish{max-width:34em;margin:60px auto;padding:0 24px;font-family:var(--serif);line-height:1.9}
.finish h2{font-size:22px;font-weight:600}
.hidden{display:none!important}

@media (max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .reader{border-right:none;border-bottom:1px solid var(--rule-faint)}
  .modes{display:none}
  .panes.split{grid-template-columns:1fr}.panes.split .pane:last-child{display:none}
  .pane{padding:20px 18px 40px}.brief,.tabs{padding-left:18px;padding-right:18px}
  .vote{max-height:46vh}
  .progress{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .pick,.tab,.btn{transition:border-color .15s,background-color .15s,color .15s}
}
</style>
</head>
<body>
<header class="top">
  <h1>哪一版更好读</h1>
  <nav class="progress" id="progress" aria-label="篇目进度"></nav>
  <div class="tools">
    <button class="btn" id="importBtn" title="载入之前导出的进度">载入进度</button>
    <button class="btn primary" id="exportBtn">导出结果</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </div>
</header>

<main class="main" id="main">
  <section class="reader" aria-label="阅读区">
    <div class="brief" id="brief"></div>
    <div class="tabs" role="tablist" id="tabs">
      <div class="modes">
        <button class="btn" id="modeSingle" aria-pressed="true">逐个读</button>
        <button class="btn" id="modeSplit" aria-pressed="false">并排对照</button>
      </div>
    </div>
    <div class="panes" id="panes">
      <article class="pane" id="paneL"><div class="pane-head">左侧：<select id="selL"></select></div><div class="doc" id="docL"></div></article>
      <article class="pane hidden" id="paneR"><div class="pane-head">右侧：<select id="selR"></select></div><div class="doc" id="docR"></div></article>
    </div>
  </section>

  <aside class="vote" aria-label="投票">
    <div>
      <h2>最好读的一版</h2>
      <p class="hint">凭读起来的感觉选：哪一版最像人话、读着最不累。不用逐字找错。</p>
      <div class="picks" id="bestPicks"></div>
    </div>
    <div>
      <h2>最难读的一版（可选）</h2>
      <div class="picks" id="worstPicks"></div>
    </div>
    <label class="tie"><input type="checkbox" id="tie"> 几版差不多，很难分出高下</label>
    <div>
      <h2>想说的话（可选）</h2>
      <textarea id="note" placeholder="比如：B 的第二段很别扭；A 和 C 几乎一样"></textarea>
    </div>
    <div class="status" id="status"></div>
    <div class="nav">
      <button class="btn" id="prevBtn">上一篇</button>
      <button class="btn primary" id="nextBtn">下一篇</button>
    </div>
    <div class="keys"><kbd>1</kbd>–<kbd>4</kbd> 切换版本　<kbd>←</kbd><kbd>→</kbd> 换篇</div>
  </aside>
</main>

<section class="finish hidden" id="finish">
  <h2>全部投完了</h2>
  <p>点右上角的“导出结果”，保存 <b>blind_votes.json</b>，然后在项目根目录运行：</p>
  <p><code>python benchmarks/blind_workbench.py analyze blind_votes.json</code></p>
  <p>脚本会解码每个代号对应的版本，并给出统计。想改某一篇的投票，可以点上方进度圆点回去修改。</p>
  <p><button class="btn" id="backBtn">回到最后一篇</button></p>
</section>

<script>
const DATA = {"run": "m4", "items": [{"sid": "daily-001", "title": "北京首次租房", "scenario": "daily", "prompt": "下个月要从杭州搬到北京工作，第一次在北京租房，预算 5000 左右，有什么要注意的？", "cands": [{"code": "f0155b", "text": "第一次在北京租房，5000 元预算，先看位置和通勤，别只盯着房租本身。北京面积大，不同区域之间的通勤差别很大：5000 元在核心区大概率只能合租，或者租很老的房子；在五环外、近郊，才可能租到一居或开间。\n\n### 1. 先定“通勤圈”，再找房\n- 先确认公司地址，把单程通勤控制在 45—60 分钟内，最好能地铁直达，或少换乘。\n- 北京通勤不能只看直线距离。早高峰换乘、进站排队都很耗时。看房时用地图模拟工作日 8:00 的通勤。\n- 5000 元左右大致可以这样权衡：\n  - 二环、三环核心区：多为合租主卧、次卧，或老小区小单间；\n  - 四环到五环：合租条件会好一些，部分老一居或开间也有机会；\n  - 五环外、近郊：更可能租到一居或大开间，但通勤会更长。\n- 6 月是毕业季和换租季，热门区域房源流转快。遇到合适的可以尽快决定，但没看房、没核验证件前，不要付大额定金。\n\n### 2. 首笔预算要留够\n5000 元房租，常见“押一付三”：\n- 押金 5000 元 + 3 个月租金 15000 元 = 20000 元；\n- 中介费常见 1 个月，约 5000 元；\n- 再加上搬家、日用品、网络、水电，建议准备 2.5 万—3 万元流动资金。\n\n问清楚中介费、服务费、物业费、供暖费、网费、保洁费、维修费分别由谁承担。北京的供暖费一定要写进合同。住宅通常由房东承担较多，但合同里必须明确；自采暖的燃气费可能很高。\n\n### 3. 看房重点检查\n- 冬天供暖、夏天制冷：暖气片是否正常，窗户是否漏风；空调制冷效果和噪音如何。顶楼和西晒的房子夏天会很热。\n- 水压、下水、马桶、淋浴、燃气热水器、燃气灶、电路、插座，都要现场试。\n- 看墙面和卫生间有没有发霉、漏水，尤其顶层和卫生间周边。\n- 老小区要注意有没有电梯、隔音怎么样、楼道卫生、停车，以及快递、外卖是否方便。\n- 合租要问室友的作息、卫生习惯、卫生间数量、是否男女混住，房东或二房东是否常来。\n- 尽量选民水民电，避开商水商电的公寓。商水商电长期成本高，还可能不能明火做饭。\n\n### 4. 核验证件，防二房东和骗局\n- 要求查看房东身份证、房产证或购房合同；签约人必须是产权人或有权代理人。\n- 如果是二房东或转租，要看原租赁合同、房东同意转租的证明，并确认租期能覆盖你的租期。\n- 不租明显的隔断房、群租房和违建，这类房子有被清退的风险。\n- 不接受看房费、信息费；没看房就先交大额定金，要谨慎。\n- 不签租金贷，不办分期贷款，不把身份证交给中介去办不明贷款。\n- 付款转给合同上的房东或公司账户，备注“房租+租期”，保留转账记录和收据。\n\n### 5. 合同必须写清楚\n- 租期、租金、支付方式，以及押金退还的时间和条件；\n- 水电燃气、物业、供暖、网络、维修分别由谁承担；\n- 家电自然损坏谁修，漏水、暖气不热、下水堵塞怎么处理；\n- 提前退租、房东提前收房、续租时涨租、转租分别怎么处理；\n- 是否配合办理居住证、租赁备案、开发票（如公司报销或提取公积金需要）；\n- 入住时做家具家电清单，拍视频记录水电底数、墙面和家电状态。\n\n### 6. 落地建议\n先住 1—2 周酒店、短租或青旅，线下集中看 8—10 套再定，不要远程只看图片就签。从杭州过来，大件家具尽量别带，用德邦、顺丰或京东物流寄；先带必需品，安顿后再补。\n\n如果你告诉我工作地点大概在哪个商圈或地铁站、是否接受合租、通勤能接受多久，我可以帮你把 5000 元预算对应的具体租房板块再缩小范围。"}, {"code": "b33f11", "text": "第一次在北京租房，5000 元预算的关键是：**位置和通勤优先，别只看房租绝对值**。北京面积大、通勤差异极大，5000 在核心区大概率只能合租或很老的房子，在五环外/近郊才可能租到一居或开间。给你一份实操版注意事项：\n\n### 1. 先定“通勤圈”，再找房\n- 先明确公司地址，把**单程通勤控制在 45—60 分钟内**，最好地铁直达/少换乘。\n- 北京通勤不能只看直线距离，早高峰地铁换乘、进站排队很耗时。看房时用地图模拟工作日 8:00 的通勤。\n- 5000 左右大致权衡：\n  - 二环/三环核心区：多为合租主卧、次卧，或老小区小单间；\n  - 四环到五环：合租条件会好一些，部分老一居/开间可碰；\n  - 五环外/近郊：更可能租到一居或大开间，但通勤变长。\n- 6 月是毕业季和换租季，热门区域房源流转快，遇到合适可以快决策，但**没看房、没核验证件前不要付大额定金**。\n\n### 2. 首笔预算要准备足\n5000 元房租，常见“押一付三”：\n- 押金 5000 + 3 个月租金 15000 = 20000；\n- 中介费常见 1 个月约 5000；\n- 加上搬家、日用品、网络、水电，建议准备 **2.5—3 万流动资金**。\n问清楚：中介费、服务费、物业费、供暖费、网费、保洁费、维修费分别谁出。北京供暖费一定要写进合同，通常住宅由房东承担较多，但必须明确；自采暖燃气费可能很高。\n\n### 3. 看房重点检查\n- **冬天供暖/夏天制冷**：暖气片是否正常、窗户是否漏风；空调制冷和噪音，顶楼/西晒夏天会很热。\n- **水压、下水、马桶、淋浴、燃气热水器、燃气灶、电路插座**都现场试。\n- 看墙面、卫生间是否发霉漏水，尤其顶层和卫生间周边。\n- 老小区注意：无电梯、隔音、楼道卫生、停车、快递外卖是否方便。\n- 合租要问室友作息、卫生习惯、卫生间数量、是否男女混住、房东/二房东是否常来。\n- 尽量选**民水民电**，避开商水商电的公寓；商水商电长期成本高，还可能不能明火做饭。\n\n### 4. 核验证件，防二房东和骗局\n- 要求看：房东身份证、房产证/购房合同；签约人必须是产权人或有权代理人。\n- 如果是二房东/转租：看原租赁合同、房东同意转租证明，确认租期覆盖你的租期。\n- 不租明显隔断房、群租房、违建，存在被清退风险。\n- 不接受“看房费/信息费”；未看房先交大额定金要谨慎。\n- 不签租金贷、不办分期贷款，不把身份证交给中介做不明贷款。\n- 付款转给合同上的房东/公司账户，备注“房租+租期”，保留转账记录和收据。\n\n### 5. 合同必须写清楚\n- 租期、租金、支付方式、押金退还时间和条件；\n- 水电燃气、物业、供暖、网络、维修谁承担；\n- 家电自然损坏谁修，漏水/暖气不热/下水堵塞怎么处理；\n- 提前退租、房东提前收房、续租涨租、转租规则；\n- 是否配合办理居住证、租赁备案、开发票（如公司报销或提取公积金需要）；\n- 入住时做家具家电清单，拍视频记录水电底数、墙面和家电状态。\n\n### 6. 落地建议\n先住 1—2 周酒店/短租/青旅，线下集中看 8—10 套再定，不要远程只看图片就签。杭州过来的大件家具尽量别带，用德邦/顺丰/京东物流寄；先带 essentials，安顿后再补。\n\n如果你告诉我**工作地点大概在哪个商圈/地铁站、是否接受合租、通勤能接受多久**，我可以帮你把 5000 预算对应的具体租房板块再缩小范围。"}, {"code": "d7a7a7", "text": "我第一次在北京租房。在5000元人民币的预算下，关键点是：**优先考虑地理位置和通勤时间，而不仅仅是租金的绝对金额**。北京是一座巨大的城市，不同区域的交通状况差异很大；用5000元在中央城区，很可能只能找到合租或非常老旧的房屋。一居室或开间通常只能在五环外或郊区找到。以下是实用建议：\n\n### 1. 首先确定“通勤区域”，然后再找房。\n- 确认公司地址，尽量确保**单程通勤时间控制在45–60分钟以内**，最好有直达地铁线路或换乘次数最少。\n- 在北京选房时不能仅看直线距离：高峰时段地铁换乘和进站排队会耗费大量时间。看房时请使用地图模拟工作日早上8:00的出行情况。\n- 在约5000元人民币的预算下，可以参考以下标准：\n  - 二三环内的中央城区：通常是主卧或次卧的合租，或是老小区里的小单间。\n  - 第四环到第五环之间：合租条件更好，可以找到一些老旧的一居室或开间；\n  - 第五环以外/郊区：租到一居室或大开间的可能性更高，但通勤时间会增加。\n- 六月是毕业生和换房季；热门地区的房源很快被租走，因此找到合适的房源后要迅速决定，但**在未看房和核实证件前，切勿支付大额定金**。\n\n### 2. 需提前准备好充足的初始预算。\n租金为5000元人民币，常见的付款方式是“一个月押金，三个月房租”：\n- 押金5000 + 三个月租金15000 = 20000。\n- 中介费通常是一个月房租，约5000元；\n- 考虑到搬家费、生活用品、网络和水电燃气等费用，建议准备**2.5万至3万元可动用资金**。\n请确认：谁负责支付佣金、服务费、物业费、水电费、暖气费、网络费、清洁费和维修费。在北京，合同中必须注明暖气费；通常住宅由房东承担较多，但这一点需明确写明；独立供暖的燃气费用可能很高。\n\n### 3. 看房时的要点\n- **冬季供暖/夏季空调**：检查暖气片是否正常，窗户是否有漏风现象；测试空调的运行情况及噪音水平；顶楼或西晒的房间夏季可能会非常炎热。\n- 现场请检查**水压、下水道、马桶、淋浴器、燃气热水器、燃气灶、插座及电路**。\n- 检查墙壁和浴室是否有霉菌或渗漏现象，尤其是顶层和卫生间周边。\n- 在老旧住宅区中，请注意：是否没有电梯、隔音效果、楼梯间的清洁状况、停车便利性以及快递和送餐的便捷程度。\n- 合租时，请确认室友的日常作息、卫生习惯、卫生间数量、是否存在男女混住情况，以及房东或转租方来访的频率。\n- 尽可能选择配备**民用水和电**的住房，避免选择使用商用水和电的公寓；从长远来看，商用水和电的费用较高，而且可能禁止明火烹饪。\n\n### 4. 检查相关文件，以防遇到二房东或遭遇诈骗。\n- 要求出示：房东的身份证、产权证明/购房合同；签约人必须是业主或授权代表。\n- 如果是转租：请检查原始租赁合同以及证明房东同意转租的文件，以确保租赁期限涵盖您的居住时间。\n- 不要租用明显被隔断的房间、群租房或非法搭建的房间——存在被驱逐的风险。\n- 不要接受“看房费/信息费”等条件；如果要求在看房前支付大额定金，请务必小心。\n- 不要通过信贷产品签署租赁合同，不要办理分期贷款，也不要将身份证交给中介以办理不明来源的贷款。\n- 请将租金支付到合同中指定的房东/公司账户，并注明“租金+租赁期限”，同时保留转账记录和收据。\n\n### 5. 合同中必须明确写明所有条款。\n- 租赁期限、租金数额、支付方式以及押金的退还时间和条件；\n- 谁负责支付水电燃气费、物业费、供暖费、网络费和维修费；\n- 家用电器自然损坏由谁负责维修；如何处理漏水、供暖不良或下水道堵塞等问题；\n- 提前终止合同的规则、房东提前收房的规定、续约时租金上涨的规则以及转租事宜；\n- 是否愿意协助办理居住证、租赁登记及开具发票（如需用于公司报销或提取公积金）；\n- 入住时会列出家具和家电清单，并录制视频记录水表、电表读数以及墙壁和家电的状况。\n\n### 6. 落地建议\n先住在酒店/出租公寓/旅舍1–2周，在做出决定前亲自考察8–10个房源。切勿仅凭照片就签署合同。尽可能不要从杭州携带大型家具——可以通过德邦/顺丰/京东物流寄送；只带上必需品，其余的等安顿好后再购买。\n\n如果您能告诉我**您的工作地点大致在哪个区域/哪座地铁站附近、是否愿意合租以及您愿意花多少时间通勤**，我就能帮您在5000元人民币的预算范围内缩小具体租房板块的范围。"}]}, {"sid": "writing-005", "title": "开放平台 API v2 发布说明", "scenario": "writing", "prompt": "写一份开放平台 API v2 的对外发布说明。主要变化：鉴权从 API Key 改为 OAuth 2.0；新增 webhook 事件订阅；限流策略调整为按应用维度；v1 将在 6 个月后下线。", "cands": [{"code": "181b15", "text": "# 开放平台 API v2 — 面向外部用户的信息\n\n我们正式发布开放平台 **API v2**。此次更新包含了关于安全性、事件通知功能以及调用管理的重要变更。建议所有开发者尽快评估这些变更并开始迁移。\n\n## 一、主要变化\n\n### 1. 身份验证方式已升级为 OAuth 2.0\n\nAPI v2 已将身份验证方式从原有的 **API Key** 升级为 **OAuth 2.0**。\n\n借助 OAuth 2.0，开发者能够实现更安全且标准化的授权流程，同时还能更细致地控制访问权限。\n\n主要变化包括：\n\n- API Key 不再作为主要的身份验证方式使用。\n- 调用API时，需使用OAuth 2.0来获取`access_token`。\n- 请求接口时，通过 `Authorization` 请求头传递令牌。\n- 支持按授权范围控制接口访问权限。\n\n示例：\n\n```http\nAuthorization: Bearer <access_token>\n```\n\n建议开发者按照新的认证文档完成授权流程。\n\n---\n\n### 2. 新增 Webhook 事件订阅功能。\n\n在APIv2中新增了**订阅Webhook事件**的功能。\n\n开发者可以订阅平台事件，从而在事件发生时接收平台自动发送的通知，无需通过轮询来获取状态变更信息。\n\n支持能力包括：\n\n- 创建和管理事件订阅\n- 配置事件回调地址\n- 接收来自平台的事件通知\n- 支持验证事件签名，以确保回调的安全性\n\n典型使用场景：\n\n- 订单状态变更通知\n- 用户授权状态变更通知\n- 资源的创建、更新或删除通知\n- 异步任务完成通知\n\n请在开发者面板中或通过API配置对Webhook的订阅。\n\n---\n\n### 3. 流量限制策略已按应用级别进行调整\n\nAPI v2调整了流量限制策略。\n\n现有策略将更新为**按应用限制流量**，即同一应用内的所有请求将共享其流量限制配额。\n\n这样能提高平台调用管理的一致性，也方便开发者按应用做容量规划。\n\n请开发者注意：\n\n- 限流配额按应用统计。\n- 同一应用内不同用户或不同凭证的请求将共享同一个流量限制配额。\n- 超过限流阈值时，接口会返回限流错误。\n- 建议合理控制并发请求数量，必要时实现重试和退避机制。\n\n---\n\n### 4. API v1 将在 6 个月后下线。\n\n随着API v2 的发布，API v1将进入停用过渡期。\n\n**API v1 将在本公告发布之日起 6 个月后正式停止运行。**\n\n下线后：\n\n- API v1 接口将不再提供服务。\n- 使用 API Key 的旧版认证方式将不再受支持。\n- 依赖v1的应用程序可能无法继续正常使用开放平台的功能。\n\n我们恳请所有仍在使用 API v1 的开发者尽快完成迁移。\n\n---\n\n## 二、迁移建议\n\n为确保平稳过渡，建议开发者按以下步骤进行迁移：\n\n1. **确认当前使用的 v1 接口清单**\n   - 分析现有系统中调用的API v1 接口\n   - 确定依赖 API Key 认证的调用链\n\n2. **完成与OAuth 2.0的集成**\n   - 创建或更新应用程序配置\n   - 获取客户端凭证\n   - 实现授权流程及令牌刷新机制\n\n3. **替换接口调用地址和请求方式**\n   - 将 v1 接口替换为对应的 v2 接口\n   - 按 v2 文档调整请求参数和响应处理逻辑\n\n4. **评估限流影响**\n   - 按应用维度重新评估调用量\n   - 优化频繁调用的场景\n   - 添加重试机制以及限流时的降级处理\n\n5. **启用 Webhook 能力**\n   - 对于适合事件驱动的场景，建议用Webhook替换轮询方式\n   - 设置回调地址并完成签名验证\n   - 确保事件处理的幂等性\n\n6. **完成测试并上线**\n   - 在测试环境中完成联调验证\n   - 灰度切换到 API v2\n   - 监控成功呼叫百分比、延迟以及流量限制情况\n\n---\n\n## 三、时间安排\n\n| 阶段 | 时间 | 说明 |\n|---|---|---|\n| API v2 发布 | 即日起 | 开发者可以开始接入 API v2 |\n| 迁移过渡期 | 发布后的6个月内 | API v1和API v2可同时使用 |\n| API v1 下线 | 发布后的6个月 | API v1 停止服务 |\n\n---\n\n## 四、开发者应采取的行动\n\n请开发者尽快完成以下事项：\n\n- 阅读 API v2 接入文档\n- 在开发者后台创建或升级应用\n- 切换至OAuth 2.0认证方式\n- 根据按应用限制流量的策略调整调用逻辑\n- 按业务需要配置 Webhook 事件订阅\n- 在关闭API v1之前，请完成所有迁移工作。\n\n---\n\n## 五、支持与反馈\n\n如果在迁移过程中遇到问题，可以通过以下方式联系我们：\n\n- 在开发者后台提交工单。\n- 联系客户成功或技术支持团队。\n- 查阅开放平台 API v2 文档和迁移指南。\n\n感谢所有开发者对开放平台的长期支持。我们将持续完善平台的功能、安全性和稳定性，以帮助开发者更高效地开发集成应用。"}, {"code": "3cf3d7", "text": "# 开放平台 API v2 对外发布说明\n\n我们正式发布开放平台 **API v2**。本次版本升级围绕安全性、事件通知能力和调用治理进行了重要调整，建议所有开发者尽快评估并启动迁移。\n\n## 一、主要变化\n\n### 1. 鉴权方式升级为 OAuth 2.0\n\nAPI v2 将鉴权方式从原有的 **API Key** 升级为 **OAuth 2.0**。\n\n通过 OAuth 2.0，开发者可以实现更安全、标准化的授权流程，并支持更细粒度的权限控制。\n\n主要变化包括：\n\n- 不再使用 API Key 作为主要鉴权方式\n- 调用 API 需使用 OAuth 2.0 获取 `access_token`\n- 请求接口时通过 `Authorization` 请求头传递令牌\n- 支持按授权范围控制接口访问权限\n\n示例：\n\n```http\nAuthorization: Bearer <access_token>\n```\n\n请开发者根据新的鉴权文档完成授权流程接入。\n\n---\n\n### 2. 新增 Webhook 事件订阅能力\n\nAPI v2 新增 **Webhook 事件订阅** 功能。\n\n开发者可以订阅平台事件，并在事件发生时接收平台主动推送的通知，无需再通过轮询方式获取状态变化。\n\n支持能力包括：\n\n- 创建和管理事件订阅\n- 配置事件回调地址\n- 接收平台事件推送\n- 支持事件签名校验，保障回调安全\n\n典型使用场景：\n\n- 订单状态变更通知\n- 用户授权状态变化通知\n- 资源创建、更新或删除通知\n- 异步任务完成通知\n\n请在开发者后台或通过 API 配置 Webhook 订阅。\n\n---\n\n### 3. 限流策略调整为按应用维度\n\nAPI v2 对限流策略进行了调整。\n\n原有策略将升级为 **按应用维度进行限流**，即同一个应用下的所有调用共享该应用的限流额度。\n\n调整后的策略有助于提升平台调用管理的一致性，并便于开发者基于应用进行容量规划。\n\n请开发者注意：\n\n- 限流额度以应用为单位统计\n- 同一应用下不同用户或不同凭证的请求将共享限流配额\n- 当超过限流阈值时，接口将返回限流错误\n- 建议合理控制并发请求，必要时实现重试和退避机制\n\n---\n\n### 4. API v1 将于 6 个月后下线\n\n随着 API v2 发布，API v1 将进入下线过渡期。\n\n**API v1 将在本公告发布之日起 6 个月后正式下线。**\n\n下线后：\n\n- API v1 接口将不再提供服务\n- 使用 API Key 的旧版鉴权方式将不再支持\n- 依赖 v1 的应用可能无法继续正常调用开放平台能力\n\n请所有仍在使用 API v1 的开发者尽快完成迁移。\n\n---\n\n## 二、迁移建议\n\n为确保业务平稳过渡，建议开发者按以下步骤进行迁移：\n\n1. **确认当前使用的 v1 接口清单**\n   - 梳理现有系统中调用的 API v1 接口\n   - 识别依赖 API Key 鉴权的调用链路\n\n2. **完成 OAuth 2.0 接入**\n   - 创建或升级应用配置\n   - 获取客户端凭证\n   - 实现授权流程和令牌刷新机制\n\n3. **替换接口调用地址和请求方式**\n   - 将 v1 接口替换为对应的 v2 接口\n   - 按 v2 文档调整请求参数和响应处理逻辑\n\n4. **评估限流影响**\n   - 根据应用维度重新评估调用量\n   - 优化高频调用场景\n   - 增加限流重试和降级处理\n\n5. **启用 Webhook 能力**\n   - 对适合事件驱动的场景，建议由轮询改为 Webhook\n   - 配置回调地址并完成签名验证\n   - 做好事件幂等处理\n\n6. **完成测试并上线**\n   - 在测试环境完成联调验证\n   - 灰度切换到 API v2\n   - 监控调用成功率、延迟和限流情况\n\n---\n\n## 三、时间安排\n\n| 阶段 | 时间 | 说明 |\n|---|---|---|\n| API v2 发布 | 即日起 | 开发者可开始接入 API v2 |\n| 迁移过渡期 | 发布后 6 个月内 | API v1 与 API v2 并行可用 |\n| API v1 下线 | 发布 6 个月后 | API v1 停止服务 |\n\n---\n\n## 四、开发者需采取的行动\n\n请开发者尽快完成以下事项：\n\n- 阅读 API v2 接入文档\n- 在开发者后台创建或升级应用\n- 将鉴权方式迁移至 OAuth 2.0\n- 根据应用维度限流策略调整调用逻辑\n- 根据业务需要配置 Webhook 事件订阅\n- 在 API v1 下线前完成全部迁移\n\n---\n\n## 五、支持与反馈\n\n如在迁移过程中遇到问题，请通过以下方式联系我们：\n\n- 开发者后台提交工单\n- 联系客户成功或技术支持团队\n- 查阅开放平台 API v2 文档和迁移指南\n\n感谢各位开发者长期以来对开放平台的支持。我们将持续提升平台能力、安全性和稳定性，帮助开发者更高效地构建集成应用。"}, {"code": "a84b97", "text": "# 开放平台 API v2 对外发布说明\n\n开放平台 API v2 已发布。本次升级涉及安全性、事件通知能力和调用治理，建议所有开发者评估影响并启动迁移。\n\n## 一、主要变化\n\n### 1. 鉴权方式升级为 OAuth 2.0\n\nAPI v2 的鉴权方式由 API Key 改为 OAuth 2.0。OAuth 2.0 可提供更安全、标准化的授权流程，支持更细粒度的权限控制。\n\n主要变化：\n\n- 不再使用 API Key 作为主要鉴权方式\n- 调用 API 需使用 OAuth 2.0 获取 `access_token`\n- 调用接口时通过 `Authorization` 请求头传递令牌\n- 支持按授权范围控制接口访问权限\n\n示例：\n\n```http\nAuthorization: Bearer <access_token>\n```\n\n请开发者按新的鉴权文档接入授权流程。\n\n### 2. 新增 Webhook 事件订阅能力\n\nAPI v2 新增 Webhook 事件订阅能力。开发者可以订阅平台事件，并在事件发生时接收平台主动推送的通知，无需再通过轮询获取状态变化。\n\n支持以下能力：\n\n- 创建和管理事件订阅\n- 配置事件回调地址\n- 接收平台事件推送\n- 校验事件签名，保障回调安全\n\n典型场景：\n\n- 订单状态变更通知\n- 用户授权状态变化通知\n- 资源创建、更新或删除通知\n- 异步任务完成通知\n\n请在开发者后台或通过 API 配置 Webhook 订阅。\n\n### 3. 限流策略调整为按应用维度\n\nAPI v2 改为按应用维度限流：同一个应用下的所有调用共享该应用的限流额度。\n\n按应用维度限流有助于提升调用管理的一致性，也便于开发者基于应用规划容量。\n\n请注意：\n\n- 限流额度以应用为单位统计\n- 同一应用下不同用户或不同凭证的请求共享限流配额\n- 超过限流阈值时，接口将返回限流错误\n- 建议合理控制并发请求，必要时实现重试和退避机制\n\n### 4. API v1 将于 6 个月后下线\n\nAPI v1 进入下线过渡期。**API v1 将在本公告发布之日起 6 个月后正式下线。**\n\n下线后：\n\n- API v1 接口不再提供服务\n- 使用 API Key 的旧版鉴权方式不再支持\n- 依赖 v1 的应用可能无法继续正常调用开放平台能力\n\n请仍在使用 API v1 的开发者尽快完成迁移。\n\n## 二、迁移建议\n\n为确保业务平稳过渡，建议开发者按以下步骤迁移：\n\n1. 确认当前使用的 v1 接口清单\n   - 梳理现有系统中调用的 API v1 接口\n   - 识别依赖 API Key 鉴权的调用链路\n\n2. 完成 OAuth 2.0 接入\n   - 创建或升级应用配置\n   - 获取客户端凭证\n   - 实现授权流程和令牌刷新机制\n\n3. 替换接口调用地址和请求方式\n   - 将 v1 接口替换为对应的 v2 接口\n   - 按 v2 文档调整请求参数和响应处理逻辑\n\n4. 评估限流影响\n   - 根据应用维度重新评估调用量\n   - 优化高频调用场景\n   - 增加限流重试和降级处理\n\n5. 启用 Webhook 能力\n   - 适合事件驱动的场景，建议由轮询改为 Webhook\n   - 配置回调地址并完成签名验证\n   - 做好事件幂等处理\n\n6. 完成测试并上线\n   - 在测试环境完成联调验证\n   - 灰度切换到 API v2\n   - 监控调用成功率、延迟和限流情况\n\n## 三、时间安排\n\n| 阶段 | 时间 | 说明 |\n|---|---|---|\n| API v2 发布 | 即日起 | 开发者可开始接入 API v2 |\n| 迁移过渡期 | 发布后 6 个月内 | API v1 与 API v2 并行可用 |\n| API v1 下线 | 发布 6 个月后 | API v1 停止服务 |\n\n## 四、开发者需采取的行动\n\n请开发者尽快完成以下事项：\n\n- 阅读 API v2 接入文档\n- 在开发者后台创建或升级应用\n- 将鉴权方式迁移至 OAuth 2.0\n- 根据应用维度限流策略调整调用逻辑\n- 根据业务需要配置 Webhook 事件订阅\n- 在 API v1 下线前完成全部迁移\n\n## 五、支持与反馈\n\n迁移过程中如遇到问题，请通过以下方式联系我们：\n\n- 开发者后台提交工单\n- 联系客户成功或技术支持团队\n- 查阅开放平台 API v2 文档和迁移指南\n\n感谢各位开发者长期以来对开放平台的支持。"}]}, {"sid": "discussion-002", "title": "RAG vs 长上下文", "scenario": "discussion", "prompt": "做知识库问答的话，自己搭向量数据库 + 检索 pipeline（RAG），和直接用长上下文模型把文档全塞进去，哪条路线更有前途？", "cands": [{"code": "4738ae", "text": "这是一个非常好的问题，触及了当前LLM应用架构的核心矛盾。简单直接的答案是：**向量数据库+RAG的路线，在绝大多数现实场景中，比单纯依赖长上下文模型“暴力”塞文档，更具可行性和前途。**\n\n下面我从几个维度进行详细对比分析：\n\n### 核心概念对比\n\n1.  **RAG路线**：将知识库文档**切成片段并向量化存储**，查询时先**检索**最相关的几个片段，然后将“问题+相关片段”一起交给LLM生成答案。\n2.  **长上下文路线**：将整个或大部分文档**直接作为上下文**，连同问题一起输入给LLM（如GPT-4 128K, Claude 200K， 或国内的一些长文本模型），让它自己“在脑海中”查找答案。\n\n### 优劣对比分析\n\n| 维度 | RAG + 向量数据库 | 长上下文模型（全文档塞入） | 说明 |\n| :--- | :--- | :--- | :--- |\n| **成本与效率** | **优**。只需对文档预处理一次（向量化）。查询时只需检索和注入少量相关文本，**Token消耗低，响应快**。 | **差**。每次查询都需要输入海量上下文，**Token消耗极高**（输入Token通常更贵），**计算开销大，延迟高**。对于频繁查询，成本可能无法承受。 |\n| **准确性** | **可控的优**。检索阶段可以精确匹配、过滤、排序。答案严格基于检索出的片段，**可追溯、可验证**（可展示引用来源）。可通过优化检索策略（如多路检索、重排）来提升。 | **不稳定的差**。模型需要在超长文本中“大海捞针”，极易发生**注意力稀释**或**中间位置信息丢失**问题。答案可能基于文档中不相关或错误的部分，**事实幻觉风险更高**，且难以追溯。 |\n| **可扩展性** | **优**。知识库增长时，只需添加新的向量片段，检索系统可以高效处理百万甚至亿级文档。查询速度基本不受知识库大小影响。 | **极差**。模型上下文窗口有硬性上限（如200K）。知识库稍大就必须进行**极度压缩或摘要**，导致信息丢失。无法处理超过窗口容量的知识。 |\n| **更新与维护** | **优**。更新知识时，只需增量更新或替换相关片段及其向量。可以轻松实现知识的热更新。 | **差**。每次知识更新，都需要重新处理整个长上下文，或者与模型进行复杂的交互来“告知”更新，**不可靠且低效**。 |\n| **技术复杂度** | **中**。需要搭建和维护向量数据库、检索pipeline、可能还需要文本分块、重排等组件。技术栈相对复杂，但生态成熟（LangChain, LlamaIndex等）。 | **低**。模型调用极其简单，只需拼接文本。但需要自己处理长文本的分段、摘要、压缩等预处理，以保证不超限。 |\n| **适用场景** | **绝大多数企业级知识库问答**。文档多、更新频、查询量大、要求答案准确且可溯源。如客服系统、内部Wiki问答、产品手册查询等。 | **小而精的特定场景**。文档总量很小（不超过模型窗口1/3），且内容高度相关、结构清晰；或用于**一次性分析**固定长文档（如一篇长论文、一份长报告）。 |\n\n### 为什么RAG路线更有前途？\n\n1.  **成本效益是商业应用的命脉**：长上下文模型每次调用都消耗巨额Token，这对于每天有成千上万次查询的生产系统来说，成本是指数级上升的。RAG将成本从每次查询的`O(全部文档)`降低到`O(少量相关片段)`。\n2.  **“大海捞针”问题的本质**：即使模型拥有200K的上下文窗口，让它从20万字中精准找到并依据某个具体事实回答问题，其性能也远不如先用一个专门的检索系统（比如BM25+向量搜索）把最相关的3-5个段落（共2000字）找出来。后者更专精、更可靠。\n3.  **可控性与可解释性**：RAG可以返回答案对应的**原文出处**，这是企业级应用的关键需求。长上下文模型是一个黑盒，你无法知道答案是来自文档的哪一部分，可信度大打折扣。\n4.  **长上下文模型的局限性未根本解决**：尽管模型上下文窗口在增长，但**注意力机制在处理超长文本时的性能衰减**、**“中间丢失”现象**、以及对**细节事实的记忆能力**依然是学术和工程上的挑战。单纯加长窗口并未解决这些根本问题。\n5.  **混合架构的兴起**：未来的主流架构很可能是 **“RAG为主，长上下文为辅”** 。例如：\n    *   用RAG检索出核心相关文档。\n    *   对于检索到的关键长文档（如一份合同），再利用长上下文模型进行深度阅读理解、总结或对比。\n    *   这种混合模式结合了二者的优点。\n\n### 结论与建议\n\n*   **对于严肃的、生产级别的知识库问答系统，RAG + 向量数据库是当前更成熟、更具性价比和可扩展性的选择。** 它已经是行业的事实标准。\n*   **长上下文模型更适合作为特定场景下的补充工具**，例如：\n    *   对RAG检索出的**单个长文档**进行深度分析。\n    *   处理**规模很小、无需频繁更新**的知识库。\n    *   进行需要**全局把握**的文档分析（如总结一本书的基调），而非查找具体事实。\n\n**最终建议**：从RAG路线入手。它代表了更稳健的工程实践。随着长上下文模型能力的进一步演进（例如能真正解决注意力稀释问题），可以再将其作为增强组件融入你的RAG pipeline中，而不是替代它。"}, {"code": "ec8563", "text": "在绝大多数现实场景中，向量数据库加 RAG 比单纯依赖长上下文模型、把文档直接塞进上下文更可行，也更有前途。\n\n### 核心概念\n\n1. RAG 路线：把知识库文档切成片段并向量化存储。查询时先检索最相关的几个片段，再把问题和片段一起交给 LLM 生成答案。\n2. 长上下文路线：把整个或大部分文档直接作为上下文，连同问题一起输入 LLM（如 GPT-4 128K、Claude 200K，或国内的一些长文本模型），让模型自己在上下文中查找答案。\n\n### 优劣对比\n\n| 维度 | RAG + 向量数据库 | 长上下文模型（全文档塞入） |\n| --- | --- | --- |\n| 成本与效率 | 优。文档只需预处理一次（向量化）。查询时只检索并注入少量相关文本，token 消耗低，响应快。 | 差。每次查询都要输入海量上下文，token 消耗极高（输入 token 通常更贵），计算开销大，延迟高。频繁查询时成本可能无法承受。 |\n| 准确性 | 可控的优。检索阶段可以精确匹配、过滤、排序；答案严格基于检索出的片段，可追溯、可验证（可展示引用来源）。通过多路检索、重排等策略还能继续优化。 | 不稳定的差。模型要在超长文本中“大海捞针”，容易出现注意力稀释或中间位置信息丢失。答案可能基于文档中不相关或错误的部分，事实幻觉风险更高，也难以追溯。 |\n| 可扩展性 | 优。知识库增长时，只需添加新的向量片段；检索系统可以高效处理百万甚至亿级文档，查询速度基本不受知识库大小影响。 | 极差。模型上下文窗口有硬性上限（如 200K）。知识库稍大就必须极度压缩或摘要，导致信息丢失，无法处理超过窗口容量的知识。 |\n| 更新与维护 | 优。更新知识时，只需增量更新或替换相关片段及其向量，可以较容易地实现知识热更新。 | 差。每次知识更新都要重新处理整个长上下文，或者与模型进行复杂交互来“告知”更新，不可靠且低效。 |\n| 技术复杂度 | 中。需要搭建和维护向量数据库、检索 pipeline，可能还需要文本分块、重排等组件。技术栈相对复杂，但生态成熟（LangChain、LlamaIndex 等）。 | 低。模型调用很简单，只需拼接文本。但需要自己处理长文本的分段、摘要、压缩等预处理，以保证不超限。 |\n| 适用场景 | 绝大多数企业级知识库问答：文档多、更新频繁、查询量大，要求答案准确且可溯源。例如客服系统、内部 Wiki 问答、产品手册查询等。 | 小而精的特定场景：文档总量很小（不超过模型窗口的 1/3），内容高度相关、结构清晰；或用于一次性分析固定长文档（如一篇长论文、一份长报告）。 |\n\n### 为什么 RAG 更有前途\n\n1. 成本效益是商业应用的关键。长上下文模型每次调用都消耗大量 token；对于每天成千上万次查询的生产系统，成本会随调用量迅速增加。RAG 把每次查询的成本从 O(全部文档) 降到 O(少量相关片段)。\n\n2. “大海捞针”问题。即使模型有 200K 上下文窗口，让它从二十万字中精准找到并依据某个具体事实回答问题，性能也远不如先用专门的检索系统（如 BM25 + 向量搜索）找出最相关的 3 到 5 个段落（共 2000 字）。后者更专精，也更可靠。\n\n3. 可控性与可解释性。RAG 可以返回答案对应的原文出处，这是企业级应用的关键需求。长上下文模型是黑盒，无法知道答案来自文档的哪一部分，可信度会大打折扣。\n\n4. 长上下文模型的局限尚未根本解决。上下文窗口在增长，但注意力机制处理超长文本时的性能衰减、“中间丢失”现象，以及对细节事实的记忆能力，依然是学术和工程上的挑战。单纯加长窗口并没有解决这些根本问题。\n\n5. 混合架构正在兴起。未来的主流架构很可能是“RAG 为主，长上下文为辅”。例如：\n\n   - 用 RAG 检索出核心相关文档。\n   - 对于检索到的关键长文档（如一份合同），再用长上下文模型做深度阅读理解、总结或对比。\n   - 这种混合模式结合了二者的优点。\n\n### 结论与建议\n\n对于严肃的、生产级别的知识库问答系统，RAG + 向量数据库是当前更成熟、更具性价比和可扩展性的选择。它已经是行业的事实标准。\n\n长上下文模型更适合作为特定场景下的补充工具，例如：\n\n- 对 RAG 检索出的单个长文档进行深度分析。\n- 处理规模很小、无需频繁更新的知识库。\n- 进行需要全局把握的文档分析（如总结一本书的基调），而不是查找具体事实。\n\n最终建议：从 RAG 路线入手。它代表了更稳健的工程实践。随着长上下文模型能力进一步演进（例如能真正解决注意力稀释问题），可以再把它作为增强组件融入 RAG pipeline，而不是替代它。"}, {"code": "315fd8", "text": "这是一个非常好的问题，它触及了当前LLM应用架构里的关键矛盾。简单直接的答案是：**在绝大多数实际场景中，使用向量数据库+RAG的方案，比简单地将文档插入到长上下文模型中更具可行性和前景。**\n\n下面从几个方面比较：\n\n### 核心概念对比\n\n1.  **RAG方案**：知识库中的文档被**拆分为片段并以向量形式存储**；查询时首先**提取**最相关的片段，然后将“问题+相关片段”传递给LLM以生成答案。\n2.  **长上下文方案**：整个或大部分文档**直接用作上下文**，与问题一起输入LLM（例如GPT-4 128K、Claude 200K或某些国产长文本模型），让模型自己从这些文档里找答案。\n\n### 优劣对比分析\n\n| 维度 | RAG + 向量数据库 | 长上下文模型（所有文档都放入上下文中） | 说明 |\n| :--- | :--- | :--- | :--- |\n| **成本与效率** | **优点**：只需预先处理一次文档（向量化）。查询时只需提取并插入少量相关文本；**Token消耗低，响应速度快**。 | **差**。每次请求都需要输入大量的上下文信息；**Token消耗很高**（输入Token通常成本更高），**计算开销大，延迟高**。如果请求频繁，成本可能难以承受。 |\n| **准确性** | **更可控、更好**。在搜索阶段可以精确匹配、过滤和排序数据。回答严格基于找到的片段，**可以追踪和验证**（能显示引用来源）。通过优化搜索策略（如多通道搜索、重新排序）还有改进空间。 | **不稳定、差**。模型需要在极长的文本中查找所需信息，这很容易导致**注意力分散**或**丢失中间位置的信息**。回答可能基于文档中不相关或错误的部分；**出现事实幻觉的风险更高**，且难以追踪。 |\n| **可扩展性** | **优**。随着知识库的增长，只需添加新的向量片段即可；搜索系统能有效处理数百万甚至数十亿份文档。查询速度几乎不受知识库规模的影响。 | **非常差**。模型的上下文窗口存在硬性限制（例如200K）。当知识库规模扩大时，不得不采用**极端压缩或摘要处理**，从而导致信息丢失。无法处理超出窗口容量的知识。 |\n| **更新与维护** | **优秀**。更新知识时，只需执行增量更新或替换相应的片段及其向量即可。实现知识的不停机更新非常容易。 | **差**。每次知识更新，都需要重新处理整个长上下文，或者与模型进行复杂的交互来“告知”更新，**不可靠且低效**。 |\n| **技术复杂度** | **一般**。需要创建和维护向量数据库、检索管道，可能还需要文本切分、重排等组件。技术栈相对复杂，但生态系统已经成熟（LangChain、LlamaIndex等）。 | **低**。调用模型很简单——只需拼接文本即可。但为了不超出限制，必须自行处理长文本的切分、生成摘要、压缩等操作。 |\n| **适用场景** | **绝大多数企业级知识库问答系统**。文档数量多、更新频繁、查询量大；需要精确且可追溯的答案。例如客户支持系统、内部Wiki问答系统、产品手册搜索等。 | **小型且专业化的场景**。文档总量不大（不超过模型窗口1/3），内容相关性高且结构清晰；或者用于固定长文档的**一次性分析**（如长论文、报告）。 |\n\n### 为什么路线RAG更具前景？\n\n1.  **商业应用里，成本效率很关键**：具有长上下文的模型在每次调用时都会消耗大量Token，这会导致每天有成千上万次查询的生产系统成本呈指数级上升。RAG能将每次请求的成本从`O(全部文档)`降至`O(少量相关片段)`。\n2.  **“大海捞针”问题的本质**：即使模型的上下文窗口达到20万个词元，它准确从20万字中找出所需片段并据此回答问题的能力，也远不如使用专用搜索系统（如BM25+向量搜索）有效——后者能筛选出3–5个最相关的段落（总共约2000字）。后一种方法更为精确可靠。\n3.  **可控性与可解释性**：RAG能够返回**答案的原始来源**，这是企业应用的关键要求。具有长上下文的模型则像是一个“黑箱”：无法确定答案源自文档的哪一部分，这大大降低了其可信度。\n4.  **长上下文模型的局限性未根本解决**：尽管模型上下文窗口在增长，但**注意力机制在处理超长文本时的性能衰减**、**“中间丢失”现象**、以及对**细节事实的记忆能力**依然是学术和工程上的挑战。单纯加长窗口并未解决这些根本问题。\n5.  **混合架构的兴起**：未来，主流架构很可能将是**“以RAG为基础，以长上下文作为补充”**。例如：\n    *   利用RAG提取关键相关文档。\n    *   对于所找到的关键长文档（如合同），再使用长上下文模型来进行深入理解、摘要或比较。\n    *   这种混合方法结合了两种方法的优势。\n\n### 结论与建议\n\n*   **对于生产级别的严肃问答系统而言，RAG与向量数据库构成了更成熟、更具性价比和可扩展性的选择。**这已成为行业的事实标准。\n*   **长上下文模型最适合作为特定场景下的辅助工具**，例如：\n    *   对搜索RAG时找到的**一份长文档进行深度分析**。\n    *   处理**规模较小且更新频率较低的知识库**。\n    *   需要**全局理解**的文档分析（例如总结一本书的基调），而非查找具体事实。\n\n**最终建议**：从RAG方案入手。这是一种更可靠的工程实践。随着长上下文模型能力的进一步提升（例如真正解决注意力分散问题的能力），可以将其作为附加组件集成到你的RAG流程中，而非取代它。"}]}, {"sid": "teaching-003", "title": "协程与线程", "scenario": "teaching", "prompt": "Python 的 coroutine 和 thread 本质区别是什么？asyncio 的 event loop 到底是怎么调度协程的？", "cands": [{"code": "261c42", "text": "在 Python 中，**协程（Coroutine）**和**线程（Thread）**有着本质的区别。理解它们的差异，以及 `asyncio` 事件循环（Event Loop）的工作原理，是掌握 Python 异步编程的关键。\n\n---\n\n### 一、 协程与线程的本质区别\n\n总结成一句话：**线程是操作系统的调度单位，是抢占式的；协程是应用程序（用户态）的调度单位，是协作式的。**\n\n| 维度 | 线程 (Thread) | 协程 (Coroutine) |\n| :--- | :--- | :--- |\n| **调度者** | 操作系统 (OS Kernel) | 用户态程序 (Python 的 Event Loop) |\n| **调度方式** | **抢占式** (Preemptive)。OS 随时可能暂停当前线程，切换到另一个线程。开发者无法控制何时切换。 | **协作式** (Cooperative)。协程必须主动通过 `await` (或 `yield`) 交出控制权，事件循环才能调度下一个协程。 |\n| **并发性** | 多线程。但在 Python 中受制于 **GIL（全局解释器锁）**，同一时刻只有一个线程在执行 Python 字节码，无法利用多核（I/O密集型有用，CPU密集型没用）。 | 单线程。所有协程都运行在一个线程内。 |\n| **上下文切换开销** | **大**。需要切换内核态/用户态，保存寄存器、独立栈等，开销在微秒级。创建过多线程会导致内存耗尽。 | **极小**。本质上是一个状态机（生成器）的函数调用，开销在纳秒级。单线程内可以轻松创建数万个协程。 |\n| **数据同步** | 容易发生竞态条件，需要使用锁（Lock/Mutex），代码复杂且容易死锁。 | 不需要锁（除非在 `await` 期间共享状态被改变）。因为在两次 `await` 之间，代码是同步执行的，不会被别人打断。 |\n\n---\n\n### 二、 asyncio 的 Event Loop 到底是怎么调度协程的？\n\n`asyncio` 的核心是 **事件循环（Event Loop）**。你可以把它想象成一个“不知疲倦的超级调度员”，它在一个死循环中不断地检查任务状态、处理 I/O 事件。\n\n它的底层调度机制可以分为以下几个核心部分：\n\n#### 1. 核心数据结构\n事件循环内部维护着几个关键的数据结构：\n*   **Ready Queue（就绪队列）**：存放马上可以执行的 Task（包装后的协程）。\n*   **Waiters（等待者字典）**：存放正在等待 I/O 操作或定时器（`sleep`）完成的 Task。\n\n#### 2. 底层魔法：I/O 多路复用 (I/O Multiplexing)\n这是单线程能处理海量并发的根本原因。\n事件循环底层调用了操作系统的 I/O 多路复用机制（如 Linux 的 `epoll`，macOS 的 `kqueue`，Windows 的 `IOCP` 或 `select`）。\n它的作用是：**把一堆 Socket 交给操作系统，操作系统会在某个 Socket 有数据可读或可写时，通知事件循环。**\n\n#### 3. 调度的详细步骤（以一个网络请求为例）\n\n假设我们有协程 A 和协程 B 都在运行：\n\n1.  **协程执行**：事件循环从 Ready Queue 中取出 Task A 运行。\n2.  **遇到 I/O**：Task A 执行到一个网络请求代码 `data = await socket.read()`。\n3.  **注册事件与挂起**：\n    *   Task A 会把自己的 Socket 注册到操作系统的 `epoll` 中。\n    *   Task A 告诉事件循环：“这个 Socket 有数据了记得叫醒我”。\n    *   Task A 触发 `yield`，**主动交出 CPU 控制权**，挂起自己。\n4.  **事件循环调度下一个**：事件循环拿回控制权，发现 Task A 在等待，于是把它放进 Waiters 中。然后从 Ready Queue 拿出 Task B 开始执行。\n5.  **操作系统通知**：过了一会儿，网卡收到了 Task A 的数据，操作系统通过 `epoll` 告诉事件循环：“Task A 的那个 Socket 有数据了！”\n6.  **唤醒协程**：事件循环收到通知，将 Task A 从 Waiters 移回到 Ready Queue。\n7.  **恢复执行**：等当前正在执行的协程（比如 Task B）遇到 `await` 交出控制权后，事件循环取出 Task A，Task A 从上次暂停的地方（`await socket.read()`）继续往下执行。\n\n#### 4. 伪代码理解事件循环\n如果把事件循环用极简的 Python 伪代码表示，大概是这样的：\n\n```python\ndef run_forever():\n    ready_queue = [...] # 准备好的任务\n    \n    while True:\n        # 1. 执行所有准备好的任务，直到它们遇到 await 挂起\n        while ready_queue:\n            task = ready_queue.pop(0)\n            try:\n                task.step() # 推动协程执行，直到它再次 yield\n            except StopIteration:\n                pass # 协程执行完毕\n        \n        # 2. 此时没有马上能执行的任务了，去问操作系统哪些 I/O 准备好了\n        # 这个操作是阻塞的，直到有 I/O 完成或超时\n        events = epoll.poll(timeout) \n        \n        # 3. 将完成 I/O 的任务重新放入 ready_queue\n        for event in events:\n            ready_queue.append(event.task)\n```\n\n### 总结\n\n*   **线程**是 OS 强制切换的，开销大，但能并行（如果没 GIL）；**协程**是代码主动 `await` 让出控制权的，开销极小，完全在单线程内运行。\n*   `asyncio` 调度的核心本质是：**生成器（保存状态/暂停/恢复） + 操作系统 I/O 多路复用（epoll，监听事件） + 一个死循环（调度中心）**。\n*   **绝对规则**：在 asyncio 中，**千万不能写阻塞代码**（如 `time.sleep()` 或 `requests.get()`），因为只有一个线程，一旦阻塞，事件循环就会卡死，所有其他协程都得不到调度。必须使用异步库（如 `asyncio.sleep()` 或 `aiohttp`）。"}, {"code": "03328d", "text": "在Python中，**协程（Coroutine）**与**线程（Thread）**之间存在本质区别。理解它们之间的差异，以及事件循环`asyncio`（Event Loop）的工作原理，是掌握Python中异步编程的关键。\n\n---\n\n### I. 协程与线程之间的本质区别\n\n简而言之：**线程是操作系统的调度单位；操作系统会抢占式切换它们。协程则是应用程序的调度单位（在用户模式下）；它们靠协作式主动让出控制权。**\n\n| 维度 | 线程 (Thread) | 协程 (Coroutine) |\n| :--- | :--- | :--- |\n| **调度者** | 操作系统（OS Kernel） | 用户模式下的程序（Python Event Loop） |\n| **调度方式** | **可被中断**（Preemptive）。OS可以在任何时候暂停当前线程并切换到另一个线程。开发者无法控制切换的时刻。 | **协作式**（Cooperative）。协程必须通过`await`（或`yield`）主动传递控制权，以便事件循环能够启动下一个协程。 |\n| **并发性** | 多线程。但在Python中它受到**GIL（解释器的全局锁）**的限制：同一时刻只有一个线程能执行 Python 字节码，因此无法利用多核处理器（对于大量使用I/O的任务有用，但对大量使用CPU的任务则无效）。 | 单线程。所有协程都在同一个线程中执行。 |\n| **上下文切换开销** | **开销较大**。需要在内核模式与用户模式之间切换、保存寄存器、使用独立的栈等；开销以微秒计。创建过多线程会导致内存耗尽。 | **开销极小**。本质上就是调用一个作为有限状态机的生成器函数；开销以纳秒计。在一个线程中可以轻松创建数万个协程。 |\n| **数据同步** | 容易出现竞态条件；必须使用锁（Lock/Mutex），代码会变得复杂且容易发生死锁。 | 不需要加锁（除非在 `await` 期间共享状态被改变）。由于两个`await`之间的代码是同步执行的，因此不会被其他代码中断。 |\n\n---\n\n### 第二点：asyncio Event Loop究竟是如何调度协程的呢？\n\n`asyncio`的核心是**事件循环（Event Loop）**。可以把它想成一个不停转的调度器，它在无限循环中不断检查任务状态并处理 I/O 事件。\n\n其底层调度机制可以分为以下几个关键组件：\n\n#### 1. 主要数据结构\n在事件循环内部，维护了几种关键的数据结构：\n*   **Ready Queue（就绪任务队列）**：存储可以立即执行的Task（已打包的协程）。\n*   **Waiters（等待任务字典）**：存储正在等待I/O操作或定时器（`sleep`）完成的Task。\n\n#### 2. 底层魔法：I/O多路复用（I/O Multiplexing）\n这正是单线程系统能够处理大量并发任务的主要原因。\n事件循环的基础是操作系统的I/O 多路复用机制（例如Linux中的`epoll`、macOS中的`kqueue`、Windows中的`IOCP`或`select`）。\n它的功能是：**将一组Socket传递给操作系统；当某个Socket中出现可读或可写的数据时，操作系统会通知事件循环。**\n\n#### 3. 详细的规划步骤（以网络请求为例）\n\n假设我们有协程A和B正在运行：\n\n1.  **协程执行**：事件循环从ReadyQueue中提取TaskA以供执行。\n2.  **遇到I/O**：TaskA执行到网络请求代码`data = await socket.read()`。\n3.  **事件注册与暂停**：\n    *   TaskA将其Socket注册到操作系统的`epoll`中。\n    *   Task A对事件循环说：“当Socket中出现数据时，请唤醒我。”\n    *   Task A启动`yield`，**自愿将控制权交给CPU**，并暂停自身。\n4.  **事件循环安排下一步**：事件循环重新获得控制权，发现Task A正在等待，便将其放入Waiters中。随后从Ready中取出Queue以供执行Task B。\n5.  **通知操作系统**：一段时间后，网卡从Task A处接收到数据；操作系统通过`epoll`通知事件循环：“Task A 的那个 Socket 有数据了！”\n6.  **协程恢复**：事件循环收到通知，并将Task A从Waiters移回ReadyQueue。\n7.  **恢复执行**：当当前正在执行的协程（例如 Task B）通过 `await` 交出控制权时，事件循环会取出 Task A，然后 Task A 会从暂停的位置继续执行（`await socket.read()`）。\n\n#### 4. 用伪代码理解事件循环\n如果将事件循环表示为最简化的 Python 伪代码，它大致如下所示：\n\n```python\ndef run_forever():\n    ready_queue = [...] # 准备好的任务\n    \n    while True:\n        # 1. 执行所有准备好的任务，直到它们遇到 await 挂起\n        while ready_queue:\n            task = ready_queue.pop(0)\n            try:\n                task.step() # 推动协程执行，直到它再次 yield\n            except StopIteration:\n                pass # 协程执行完毕\n        \n        # 2. 此时没有马上能执行的任务了，去问操作系统哪些 I/O 准备好了\n        # 这个操作是阻塞的，直到有 I/O 完成或超时\n        events = epoll.poll(timeout) \n        \n        # 3. 将完成 I/O 的任务重新放入 ready_queue\n        for event in events:\n            ready_queue.append(event.task)\n```\n\n### 总结\n\n*   **线程**是强制切换的 OS，这会带来较大的开销，但能实现并行执行（如果没有 GIL）；而**协程**则是自愿 `await` 让出控制权的，开销极小，且完全在同一线程内运行。\n*   `asyncio` 调度的核心是：**生成器（保存状态/暂停/恢复）+ 操作系统的多路复用 I/O（epoll、事件监听）+ 无限循环（调度中心）**。\n*   **绝对规则**：在asyncio中，**绝对不能编写阻塞代码**（例如`time.sleep()`或`requests.get()`），因为只有一个线程；一旦该线程被阻塞，事件循环就会停止，其他协程也就无法被调度。必须使用异步库（例如`asyncio.sleep()`或`aiohttp`）。"}, {"code": "d1fd08", "text": "在 Python 中，协程（Coroutine）和线程（Thread）的调度方式不同。理解它们的差异，以及 `asyncio` 事件循环（Event Loop）的工作方式，是掌握 Python 异步编程的关键。\n\n---\n\n### 一、协程与线程的本质区别\n\n一句话概括：**线程由操作系统调度，是抢占式的；协程由应用程序（用户态）调度，是协作式的。**\n\n| 维度 | 线程 (Thread) | 协程 (Coroutine) |\n| :--- | :--- | :--- |\n| **调度者** | 操作系统（OS Kernel） | 用户态程序（Python 的 Event Loop） |\n| **调度方式** | **抢占式**（Preemptive）。OS 可以随时暂停当前线程并切换到另一个线程，开发者无法控制切换时机。 | **协作式**（Cooperative）。协程必须主动通过 `await`（或 `yield`）交出控制权，事件循环才能调度下一个协程。 |\n| **并发性** | 多线程。但在 Python 中受 **GIL（全局解释器锁）** 限制，同一时刻只有一个线程执行 Python 字节码，因此无法利用多核。对 I/O 密集型任务有用，对 CPU 密集型任务没有帮助。 | 单线程。所有协程都运行在同一个线程内。 |\n| **上下文切换开销** | **大**。需要切换内核态/用户态，保存寄存器、独立栈等，开销在微秒级。创建过多线程会导致内存耗尽。 | **极小**。本质上是一次状态机（生成器）的函数调用，开销在纳秒级。单线程内可以轻松创建数万个协程。 |\n| **数据同步** | 容易发生竞态条件，需要使用锁（Lock/Mutex），代码复杂，也容易死锁。 | 通常不需要锁（除非在 `await` 期间共享状态被改变）。因为在两次 `await` 之间，代码同步执行，不会被其他协程打断。 |\n\n---\n\n### 二、asyncio 的事件循环如何调度协程？\n\n`asyncio` 的核心是**事件循环（Event Loop）**。可以把它看作一个调度器：它在一个循环中不断检查任务状态、处理 I/O 事件。\n\n底层调度机制包括以下几个部分：\n\n#### 1. 核心数据结构\n\n事件循环内部维护着几类关键的数据结构：\n\n*   **Ready Queue（就绪队列）**：存放马上可以执行的 Task（包装后的协程）。\n*   **Waiters（等待者字典）**：存放正在等待 I/O 操作或定时器（`sleep`）完成的 Task。\n\n#### 2. 底层机制：I/O 多路复用（I/O Multiplexing）\n\n单线程能处理大量并发 I/O，靠的就是这个机制。\n\n事件循环底层调用了操作系统的 I/O 多路复用机制（如 Linux 的 `epoll`，macOS 的 `kqueue`，Windows 的 `IOCP` 或 `select`）。它把一组 Socket 交给操作系统；当某个 Socket 可读或可写时，操作系统再通知事件循环。\n\n#### 3. 调度的详细步骤（以一个网络请求为例）\n\n假设协程 A 和协程 B 都在运行：\n\n1.  **协程执行**：事件循环从 Ready Queue 中取出 Task A 运行。\n2.  **遇到 I/O**：Task A 执行到网络请求 `data = await socket.read()`。\n3.  **注册事件与挂起**：\n    *   Task A 把自己的 Socket 注册到操作系统的 `epoll` 中。\n    *   Task A 告诉事件循环：这个 Socket 有数据时通知我。\n    *   Task A 触发 `yield`，**主动交出 CPU 控制权**，挂起自己。\n4.  **调度下一个任务**：事件循环拿回控制权，发现 Task A 在等待，便把它放进 Waiters。然后从 Ready Queue 取出 Task B 开始执行。\n5.  **操作系统通知**：过了一会儿，网卡收到 Task A 的数据，操作系统通过 `epoll` 通知事件循环：Task A 的 Socket 有数据了。\n6.  **唤醒协程**：事件循环收到通知，将 Task A 从 Waiters 移回 Ready Queue。\n7.  **恢复执行**：当前协程（比如 Task B）遇到 `await` 交出控制权后，事件循环取出 Task A；Task A 从上次暂停的地方（`await socket.read()`）继续往下执行。\n\n#### 4. 用伪代码理解事件循环\n\n如果把事件循环用极简的 Python 伪代码表示，大致如下：\n\n```python\ndef run_forever():\n    ready_queue = [...] # 准备好的任务\n    \n    while True:\n        # 1. 执行所有准备好的任务，直到它们遇到 await 挂起\n        while ready_queue:\n            task = ready_queue.pop(0)\n            try:\n                task.step() # 推动协程执行，直到它再次 yield\n            except StopIteration:\n                pass # 协程执行完毕\n        \n        # 2. 此时没有马上能执行的任务了，去问操作系统哪些 I/O 准备好了\n        # 这个操作是阻塞的，直到有 I/O 完成或超时\n        events = epoll.poll(timeout) \n        \n        # 3. 将完成 I/O 的任务重新放入 ready_queue\n        for event in events:\n            ready_queue.append(event.task)\n```\n\n### 总结\n\n*   线程由 OS 强制切换，开销大，但可以并行（在没有 GIL 限制时）；协程由代码主动 `await` 让出控制权，开销很小，全部运行在单线程内。\n*   `asyncio` 调度的核心是：生成器（保存状态、暂停和恢复）、操作系统 I/O 多路复用（如 `epoll`，负责监听事件）以及一个死循环（调度中心）。\n*   **绝对规则**：在 asyncio 中不要写阻塞代码（如 `time.sleep()` 或 `requests.get()`）。因为只有一个线程，一旦阻塞，事件循环就会卡死，其他协程都得不到调度。必须使用异步库（如 `asyncio.sleep()` 或 `aiohttp`）。"}]}, {"sid": "coding-002", "title": "feat(memory-core): reinforce L1 memories selected by agents", "scenario": "coding", "prompt": null, "cands": [{"code": "960544", "text": "## Description | 描述\n\n### 为什么做\n\n上游 L1 检索只按相似度排序，没有“这条记忆曾帮助 Agent 回答过类似问题”的反馈信号。因此，Agent 即使反复依赖同一条记忆，下一次检索也无法利用这些历史使用信息。\n\n本 PR 新增 `use_count` / `last_used_ms` 和轻量重排。开发过程中评估过一种做法：搜索返回 Top-K 就全部记为已使用。它会把仅供参考的候选和真正支持回答的记忆一起强化；多次搜索后，候选的使用时间会趋同，信号也被稀释。最终方案没有采用这种做法。\n\n同样，`updated_ms` 只代表记忆被写入或修改，不能代表它被 Agent 用于回答；新机制不把它当作使用时间。\n\n### 改完后有什么变化\n\n搜索结果会附带 id。Agent 判断某条记忆会实质支持当前回答时，调用一次 `tdai_memory_use` 写回该 id；只被展示、没有被采用的候选不会增加使用数据。下次遇到相似问题时，真正帮助过回答的记忆会获得轻量的 recency/frequency 加分；从未被采用的记忆仍按原始相似度排序。\n\n例如搜索返回 5 条“用户偏好”，Agent 最终只依据其中 1 条回答，新功能就只强化这 1 条。该功能不删除、隐藏或覆盖已有记忆，只在相似候选间加入已确认的使用信号。\n\n此外还加了时间框架门控：如果记忆内容自述为历史信息（例如“早期…后来改了”“已废弃”），而当前查询问的是现在的做法，就撤回这条记忆的使用加分，只按原始相似度排序；如果查询本身问的是过去的情况，加分照常生效。这样做是为了修复真实模型评测中发现的退化（见下方 Real-model A/B）：被确认过的旧方案靠使用加分反超了现行约定。\n\n### 收益与边界\n\n收益在于让检索从确认过的使用中学习：相似度接近时，优先返回真正帮助过回答的记忆。下方给出两层证据：仓库内可复现的 oracle-feedback benchmark，以及一次由真实模型自主检索、自主确认的 A/B 评测。\n\n两项证据都基于合成数据，不是线上或完整 L0->L1 端到端收益的测量；生产收益尚未量化。真实模型评测还表明，反馈质量决定收益方向：确认正确会提升，确认错误会放大错误；门控只覆盖“历史内容被当成现行规则”这一类问题。\n\n### 实现范围\n\n- 为 SQLite L1 新增 `use_count` / `last_used_ms`，老库初始化时自动补列。\n- L1 搜索返回 memory id；新增 `tdai_memory_use`，仅对 Agent 实际选用的 id 写回使用数据。\n- 排序使用 `last_used_ms` + `use_count`；`updated_ms` 不参与 usage boost。\n- 未实现 `touchL1Usage` 的 store 保持上游原有排序行为。\n- 时间框架门控：基于中文历史标记词（`PAST_FRAME_MARKERS`）判断记忆内容和查询的时间框架，只撤回加分、不降权，无 schema 变更；其他语言或部署可按需调整标记表。\n\n## Related Issue | 关联 Issue\n\nN/A\n\n## Change Type | 修改类型\n\n- [ ] Bug fix | Bug 修复\n- [x] New feature | 新功能\n- [ ] Documentation update | 文档更新\n- [ ] Code optimization | 代码优化\n\n## Self-test Checklist | 自测清单\n\n- [x] Verified locally | 本地验证通过\n- [x] No existing features affected | 无影响现有功能\n\n## Additional Notes | 其他说明\n\n### Benchmark\n\n```bash\ncd MemoryCore\nnpx vitest run --silent=false --reporter=verbose src/core/tools/l1-usage-boost-bench.test.ts\n```\n\n150 条 L1、45 条中文标注查询、5 个场景、3 轮。R1 包含 C/D 场景下预置的使用历史；每次检索后，只有在结果包含标注 gold 时才写回该 gold。R3 是经过两轮这样的 oracle feedback 后的结果；其余 ranker 共享 deployed feedback 轨迹。\n\n| ranker | Top-1 R1 -> R3 | MRR R1 -> R3 |\n| --- | --- | --- |\n| old FTS（上游基线） | 24/45 -> 24/45 | 0.7593 -> 0.7593 |\n| deployed usage (0.1/0.05) | 28/45 -> 39/45 | 0.7952 -> 0.9333 |\n| updated-time only（否决方案） | 23/45 -> 23/45 | 0.7556 -> 0.7556 |\n| legacy max(last_used, updated)（否决方案） | 27/45 -> 39/45 | 0.7944 -> 0.9333 |\n| usage 0.3/0.2 | 21/45 -> 39/45 | 0.6767 -> 0.9333 |\n| usage 0.5/0.4 | 21/45 -> 37/45 | 0.6767 -> 0.9111 |\n\ndeployed 相对上游 old FTS：R1 Top-1 +4/45（+8.89pp，+16.67% 相对），MRR +0.0359（+4.73% 相对）；R3 Top-1 +15/45（+33.33pp，+62.50% 相对），MRR +0.1740（+22.91% 相对）。\n\n这些结果来自合成 oracle-feedback benchmark，不是线上或完整 L0->L1 的端到端收益。R1 -> R3 的提升包含“同一查询重复 + oracle 写回”，有效的首轮新旧对比是 24/45 -> 28/45。\n\n修正了 benchmark 的 ALL 汇总：此前 regressed/rescued 只计入按类别分桶的结果，ALL 行恒为 0→0。修复后，deployed 的 ALL 为 regressed 4→0、rescued 8→15（R1 的 4 次退化中，A 类 1 次、D 类 3 次）。\n\n### Real-model A/B\n\n评测在仓库外搭建（脚本未纳入本 PR）：100 个合成多会话任务、9 类场景（相似竞争、旧规则被取代的正/反向、噪声确认、冷启动等），每个任务使用独立的 team 语料。学习阶段由模型自主决定是否检索、是否调用 `tdai_memory_use`；评测阶段换新会话、换问法，避免“重复提问”本身带来收益。做对比时使用同一份代码，只切换本功能开关；测试集先冻结（记录 SHA-256）再跑；统计以任务为单位配对，给出 bootstrap 95% CI。\n\n**第一轮：加门控之前（GLM-5.3-Flash，hybrid 检索，600 runs）**\n\n| 学习阶段被确认的记忆 | Top-1 Δ（ON − OFF） | 95% CI |\n| --- | --- | --- |\n| 正确记忆 | +8.3pt | [+1.0, +17.7] |\n| 错误或过时记忆 | −18.1pt | [−30.6, −5.6] |\n| 整体 | −1.8pt | [−7.5, +4.4]（不显著） |\n\n16 次 Top-1 退化都来自同一模式：学习阶段问“过去怎么做”，并确认了旧方案；评测时问“现在怎么做”，旧方案凭借约 ×1.11 的使用加分，在原始分数打平时反超现行约定。\n\n**第二轮：加门控之后（PR 头 d5d55ed，step-3.7-flash，3 repeats，228 对/arm）**\n\n| arm | Top-1 | MRR@5 |\n| --- | --- | --- |\n| OFF（无使用反馈） | 71.1% | 0.785 |\n| 本 PR（使用反馈 + 门控，撤回加分） | 75.9% | 0.825 |\n| 评测内的强门控变体（历史内容压到最低，未纳入本 PR） | 83.8% | 0.853 |\n\n- 本 PR − OFF：Top-1 +4.8pt [+0.9, +8.8]，MRR +0.039 [+0.002, +0.079]。\n- 强门控变体 − OFF：Top-1 +12.7pt [+6.1, +20.2]；同一设置下 1 repeat 的首轮为 +11.8pt [+2.6, +21.1]（72.4% → 84.2%）。两者唯一的区别是门控强度。本 PR 采用保守的“撤回加分”，是否改为更激进的降权，留给维护者判断。注意：d5d55ed 提交说明里的 +11.8pt 指的是这个强门控变体，不是本 PR 的实际代码。\n- 限制：第二轮因 embedding 额度耗尽，检索全部为纯 FTS，并非对 hybrid 模式的独立检验；回答正确率差异不显著；冷启动类 −5.6pt [−13.9, 0.0] 是唯一的负向信号，样本小，待观察；数据为合成语料，每个任务约 20 条记忆，规模小于生产环境。\n\n### Local tests\n\n```bash\ncd MemoryCore\nnpx vitest run src/core/tools/\nnpx tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext --skipLibCheck --types node src/core/tools/memory-search.ts src/core/tools/l1-recall-usage.test.ts src/core/tools/l1-usage-boost-bench.test.ts src/core/tools/l1-usage-frame-gate.test.ts\nnpx tsdown\n```\n\n结果（bfcaa48）：3 个测试文件、8/8 通过；严格类型检查和构建通过。\n\n### Real LLM check\n\n- Codex CLI / `gpt-5.6-terra` 在 workspace-write sandbox 中运行 L1 usage + benchmark 测试：4/4 通过。\n- 同一模型对 10 组未暴露标注的 query/候选记忆，单步选择实际采用的 id：10/10 与标注一致。\n- 这是选择一致性微测，不是 tool-calling 或线上端到端评测。\n\n限制：OpenClaw 目前未提供稳定的 turn id，`tdai_memory_use` 还无法强校验 id 一定来自本轮搜索；代码中已标记宿主提供 turn id 后的升级路径。\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"}, {"code": "eddfcd", "text": "## Description | 描述\n\n### 为什么做\n\n在上游的 L1 里检索时，结果仅按相似度排序，也没有“这条记忆帮 Agent 回答过类似问题”这样的反馈。也就是说，Agent 就算反复用同一条记忆，下次检索也用不上之前的使用记录。\n\n在此PR中添加了`use_count`/`last_used_ms`并对排序做了一点调整。开发阶段曾考虑过“把搜索返回的前 Top-K 条都记为已使用”的方案，但该方案会导致只作参考的候选会和真正帮上回答的记忆一起被加分；经过多次搜索后，候选条目的使用时间趋于接近，导致信号被稀释。所以最终没有采用这个方案。\n\n同样，`updated_ms` 只说明记忆被写入或修改，并不意味着它曾被Agent用于回答；新机制不将其视为使用时间。\n\n### 修改后发生了哪些变化？\n\n搜索结果会附带一个标识符。当Agent判定某条记忆记录确实能支持当前答案时，便会调用`tdai_memory_use`来将该标识符写回；只是被展示、没有被采用的候选，使用数据不会增加。当下次遇到类似问题时，真正帮上回答的记忆会得到一点近期使用和频率加分（recency/frequency）；从没被采用过的记忆，还是只按原来的相似度排序。\n\n例如，搜索时会返回5条“用户偏好”记录，但 Agent 最终只依据其中一条回答：新功能只强化这一条。该功能不会删除、隐藏或覆盖现有的记忆记录，只是给相似的候选加一个“这条被采用过”的信号。\n\n此外还加了一条时间框架判断规则：如果记忆内容自己标明是历史信息（例如“以前是这样……后来改变了”或“已过时”），而当前查询涉及现行做法，则对该记录的使用分数加成会被取消，它仅按原始的相似度系数排序；如果查询本身涉及过去，则分数加成仍照常生效。这样做是为了消除在评估实际模型时发现的退化现象（见下文Real-model A/B）：通过给予使用分数加成，已被证实的旧解决方案反而超过了现行标准。\n\n### 收益与边界\n\n好处是检索能根据确认过的使用记录来学习：相似度接近时，优先返回真正帮上回答的记忆。以下是两种类型的证据：仓库里可复现的 oracle 反馈基准测试，以及通过自主搜索并由真实模型验证后得出的A/B评估结果。\n\n这两种方法都基于合成数据；它们并非在线或完整的L0->L1端到端解决方案；线上实际收益还没有量化。对真实模型的评估也表明，反馈的质量决定了方向：正确的确认能改善结果，而错误的确认则会加剧错误；该管理机制仅适用于“历史内容被视为当前规则”的情况。\n\n### 实现范围\n\n- 为SQLite L1添加了`use_count` / `last_used_ms`；在初始化旧数据库时，列会自动添加。\n- L1 搜索会返回记忆 id；新增了`tdai_memory_use`，它仅针对实际选中的Agent ID记录使用数据。\n- 排序时使用`last_used_ms` + `use_count`；`updated_ms`不参与提升使用频率。\n- 尚未实现：存储库`touchL1Usage`的行为会保留原有的排序顺序。\n- 时间范围：基于中国历史标记（`PAST_FRAME_MARKERS`）来确定所记录数据和请求的时间背景；这时只撤回加分，不降低排序权重；schema没有变化；对于其他语言或部署环境，可根据需要配置标记表。\n\n## Related Issue | 关联 Issue\n\nN/A\n\n## Type的变更 | 变更类型\n\n- [ ] 错误修复 | 修复漏洞\n- [x] 功能New | 新功能\n- [ ] Documentation 更新 | 文档更新\n- [ ] Code 优化 | 代码优化\n\n## Self-测试 Checklist | 自检清单\n\n- [x] Verified 本地 | 本地测试通过\n- [x] No 受影响的现有功能 | 对现有功能无影响\n\n## Additional Notes | 其他说明\n\n### Benchmark\n\n```bash\ncd MemoryCore\nnpx vitest run --silent=false --reporter=verbose src/core/tools/l1-usage-boost-bench.test.ts\n```\n\n150条记录 L1，45个带中文注释的请求，5个场景，3轮。R1 包含预设场景的使用历史 C/D；每次搜索后，仅当结果包含gold注释时，才会将gold数据写回。R3 是两轮来自oracle的反馈之后的结果；其余ranker使用统一的反馈传播路径。\n\n| ranker | Top-1 R1 -> R3 | MRR R1 -> R3 |\n| --- | --- | --- |\n| 旧版 FTS（原始基准） | 24/45 -> 24/45 | 0.7593 -> 0.7593 |\n| deployed usage (0.1/0.05) | 28/45 -> 39/45 | 0.7952 -> 0.9333 |\n| 仅包含updated-time（被否决的方案） | 23/45 -> 23/45 | 0.7556 -> 0.7556 |\n| 传统模式：max(last_used, updated)（被否决的方案） | 27/45 -> 39/45 | 0.7944 -> 0.9333 |\n| usage 0.3/0.2 | 21/45 -> 39/45 | 0.6767 -> 0.9333 |\n| usage 0.5/0.4 | 21/45 -> 37/45 | 0.6767 -> 0.9111 |\n\nDeployed 对比旧版上游 FTS：R1 Top-1 +4/45（+8.89个百分点，相对增长+16.67%），MRR +0.0359（相对增长+4.73%）；R3 Top-1 +15/45（+33.33个百分点，相对增长+62.50%），MRR +0.1740（相对增长+22.91%）。\n\n这些是合成的预言机测试基准，并非从始至终的真实或完整的收益指标 L0->L1。改进方案 R1 -> R3 包括“重新请求并写回预言机”；有效的首轮新旧对比是 24/45 -> 28/45。\n\n已修复基准测试中的汇总ALL：此前regressed/rescued仅在分类篮中计入，且ALL的值始终为0→0。修复后，deployed的ALL值从regressed 4→0变为rescued 8→15（其中4个R1恶化情况分别涉及1个A级案例和3个D级案例）。\n\n### Real-model A/B\n\n在代码库之外进行的测试（测试脚本未包含在此PR中）：共100个合成的多会话任务，涵盖9种场景类型（类似竞争者、旧规则的直接/反向替换、噪声确认、冷启动等），每个任务使用独立的team数据集。在训练阶段，模型自行决定是否执行搜索并调用`tdai_memory_use`；在测试阶段则使用新的会话和问题表述，以避免“重复请求”带来的优势。为进行对比，使用了开启/关闭该功能后的同一段代码；测试集先被冻结（记录SHA-256），然后再运行；统计数据按任务对收集，同时计算95%的bootstrap置信区间CI。\n\n**第一轮：添加门控机制前（GLM-5.3-Flash，混合搜索，600次运行）**\n\n| 学习阶段被确认的记忆 | Top-1 Δ（ON − OFF） | 95% CI |\n| --- | --- | --- |\n| 正确记忆 | +8.3pt | [+1.0, +17.7] |\n| 错误或过时记忆 | −18.1pt | [−30.6, −5.6] |\n| 整体 | −1.8pt | [−7.5, +4.4]（不显著） |\n\n所有16个第一个元素退化的案例均呈现相同模式：在训练阶段会提出“以前是怎么做的？”这一问题，从而确认旧方案；在评估阶段则提出“现在该怎么做？”的问题。旧方案的使用会得到约×1.11的加成，在原始分数打平时反超当前做法。\n\n**第二轮：添加门控机制后（PR 头 d5d55ed，step-3.7-flash，重复 3 次，每组 228 对）**\n\n| arm | Top-1 | MRR@5 |\n| --- | --- | --- |\n| OFF（无使用反馈） | 71.1% | 0.785 |\n| 此PR（利用反馈+门控机制，取消加成） | 75.9% | 0.825 |\n| 评测内的强门控变体（历史内容被缩减到最低限度，未包含在当前的PR中） | 83.8% | 0.853 |\n\n- 该PR−OFF：Top-1 +4.8 pt [+0.9, +8.8]，MRR +0.039 [+0.002, +0.079]。\n- 强门控变体减 OFF：Top-1 +12.7分[+6.1, +20.2]；在相同设置下，第一轮1次重复的结果为+11.8分[+2.6, +21.1]（72.4% → 84.2%）。它们之间的唯一区别在于控制的严格程度。本 PR 采用保守的“撤回加分”，是否改成更激进的降权，留给维护者判断。注：提交描述中的+11.8分d5d55ed正是指这一严格控制版本，而非该PR的实际代码。\n- 限制条件：第二轮中由于配额耗尽embedding，所有请求均为纯FTS模式，未进行混合模式的独立验证；回答正确率差异不显著；唯一的负面指标是冷启动得分为-5.6分[−13.9, 0.0]；样本量较小，需进一步观察；数据为合成语料库，每个任务约20条记录，规模小于生产环境。\n\n### Local tests\n\n```bash\ncd MemoryCore\nnpx vitest run src/core/tools/\nnpx tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext --skipLibCheck --types node src/core/tools/memory-search.ts src/core/tools/l1-recall-usage.test.ts src/core/tools/l1-usage-boost-bench.test.ts src/core/tools/l1-usage-frame-gate.test.ts\nnpx tsdown\n```\n\n测试结果（bfcaa48）：3个测试文件，8/8通过；严格类型检查和构建通过。\n\n### Real LLM check\n\n- Codex CLI / `gpt-5.6-terra`已在workspace-write沙盒环境中启动，用于测试L1的使用及基准测试：4/4通过。\n- 同一模型对10组未标注候选记录执行单步选择实际应用的ID操作query/：10/10与标注结果一致。\n- 这是一次关于选择一致性的微型测试，而非工具调用或在线端到端评估。\n\n限制：目前OpenClaw无法提供稳定的turn id；`tdai_memory_use`暂时还无法严格验证该 id 是否来自本轮搜索；代码里已经标出宿主提供 turn id 后的升级路径。\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"}, {"code": "fb4f05", "text": "## Description | 描述\n\n### 为什么做\n\n上游 L1 检索只按相似度排序，没有“这条记忆曾帮助 Agent 回答过类似问题”的反馈信号。也就是说，Agent 即使反复依赖同一条记忆，下一次检索也无法从历史使用中受益。\n\n本 PR 新增 `use_count` / `last_used_ms` 和轻量重排。开发中评估过“搜索返回 Top-K 就全部记为已使用”的方案，但它会把仅供参考的候选与真正支持回答的记忆一起强化；多次搜索后，候选的使用时间趋同，信号被稀释。因此最终方案不采用该写法。\n\n同样，`updated_ms` 只代表记忆被写入或修改，不能代表它被 Agent 用于回答；新机制不把它当作使用时间。\n\n### 改完后有什么变化\n\n搜索结果附带 id。Agent 决定某条记忆会实质支持当前回答时，调用一次 `tdai_memory_use` 写回该 id；仅被展示、未被采用的候选不增长使用数据。下次遇到相似问题时，真正帮助过回答的记忆获得轻量 recency/frequency 加分；从未被采用的记忆仍按原始相似度排序。\n\n例如搜索返回 5 条“用户偏好”，Agent 最终只依据其中 1 条回答：新功能只强化这 1 条。该功能不删除、隐藏或覆盖已有记忆，只在相似候选间加入已确认的使用信号。\n\n另外加入了时间框架门控：如果记忆内容自述为历史信息（如“早期…后来改了”“已废弃”），而当前查询问的是现在的做法，就撤回这条记忆的使用加分，只按原始相似度排序；查询本身问的是过去时，加分照常生效。这是为了修复真实模型评测里发现的退化（见下方 Real-model A/B）：被确认过的旧方案凭使用加分，反超了现行约定。\n\n### 收益与边界\n\n收益是让检索能从确认过的使用中学习：在相似度接近时，优先返回真正帮助过回答的记忆。下方有两层证据：仓库内可复现的 oracle-feedback benchmark，以及一次由真实模型自主检索、自主确认的 A/B 评测。\n\n两者都基于合成数据，不是线上或完整 L0->L1 端到端收益；生产收益尚未量化。真实模型评测也表明，反馈质量决定方向：确认对了会提升，确认错了会放大错误，门控只覆盖了“历史内容被当成现行规则”这一类。\n\n### 实现范围\n\n- 新增 SQLite L1 的 `use_count` / `last_used_ms`，老库初始化时自动补列。\n- L1 搜索返回 memory id；新增 `tdai_memory_use`，仅对 Agent 实际选用的 id 写回使用数据。\n- 排序使用 `last_used_ms` + `use_count`；`updated_ms` 不参与 usage boost。\n- 未实现 `touchL1Usage` 的 store 保持上游原有排序行为。\n- 时间框架门控：基于中文历史标记词（`PAST_FRAME_MARKERS`）判断记忆内容和查询的时间框架，只撤回加分、不降权，无 schema 变更；其他语言或部署可按需调整标记表。\n\n## Related Issue | 关联 Issue\n\nN/A\n\n## Change Type | 修改类型\n\n- [ ] Bug fix | Bug 修复\n- [x] New feature | 新功能\n- [ ] Documentation update | 文档更新\n- [ ] Code optimization | 代码优化\n\n## Self-test Checklist | 自测清单\n\n- [x] Verified locally | 本地验证通过\n- [x] No existing features affected | 无影响现有功能\n\n## Additional Notes | 其他说明\n\n### Benchmark\n\n```bash\ncd MemoryCore\nnpx vitest run --silent=false --reporter=verbose src/core/tools/l1-usage-boost-bench.test.ts\n```\n\n150 条 L1、45 条中文标注查询、5 个场景、3 轮。R1 包含 C/D 场景预置的使用历史；每次检索后，仅当结果含标注 度 θ 就够了）。\n- 平面上绝大部分区域都没有数据。\n- 如果给数据加高斯噪声，点就会从圆上“飘开”，变成一个有厚度的圆环。\n- 要“去噪”，直觉上就是把点往最近的圆上拉回去。\n\n高维图像数据就是这个情形的放大版。\n\n## 4. 这和 diffusion model 的联系\n\n理解这些之后，论文里的许多设计也就有了动机：\n\n1. **加噪 = 把数据从流形上推开，填满整个空间。**\n   前向过程在数据上叠加噪声，当噪声足够大时，分布覆盖整个空间，变成容易采样的高斯分布。\n\n2. **去噪 = 把点拉回流形。**\n   score function ∇log p_t(x) 在流形附近大致指向流形方向。模型学到的去噪网络，本质上是在学“离数据流形最近的方向在哪里”。\n\n3. **为什么必须加噪（Song & Ermon 的动机）。**\n   如果数据严格位于低维流形上，那么在原空间中它**没有通常意义下的概率密度**（体积为零），score 在流形外没有定义，而且流形外几乎没有训练样本，score 估计很不准。加噪让分布在整个空间都有支撑，score 处处有定义，各区域都有样本覆盖。\n\n4. **t → 0 时的数值问题。**\n   噪声很小时，分布极度集中在流形附近，score 的幅度会变得很大（≈ −噪声/σ²），这也是为什么训练里常有噪声调度、损失加权、预测 ε 而不是直接预测 score 等设计。\n\n5. **Latent diffusion。**\n   Stable Diffusion 先用 VAE 把图像压缩到低维 latent，再做 diffusion，也可以看成是在利用“数据内在维度很低”这一点，让模型只处理有意义的自由度。\n\n## 5. 小结\n\n| 概念 | 直觉 |\n|---|---|\n| 流形 | 局部像平面/直线、整体可弯曲的空间 |\n| 低维流形假设 | 真实数据只占高维空间里一块自由度很少的曲面 |\n| 在 diffusion 里 | 加噪离开流形，去噪回到流形，score 指向流形 |\n\n不过，论文里的这句话通常只是**动机和直觉**，很少真的去证明数据严格位于某个流形上。如果你想看更严格的讨论，可以搜 *Convergence of denoising diffusion models under the manifold hypothesis*（De Bortoli, 2022）。\n\n你是在看哪一篇论文？如果有具体的上下文，我可以结合那一段再帮你解释。"}, {"code": "34e07c", "text": "# 流形是什么\n\n## 1. 数学上的定义\n\n**流形**是这样一种空间：**局部看起来像普通的欧氏空间，整体可以弯曲。**\n\n- **圆**（一条弯曲的线）：放大看任何一小段，都像一条直线，所以它是 1 维流形。\n- **球面**（比如地球表面）：局部看像一张平面，所以它是 2 维流形，尽管它嵌在 3 维空间里。\n- **反例**：数字\"8\"的交叉点附近不像直线，所以它不是流形。\n\n关键区分是两个维度：\n\n- **环境维度（ambient dimension）**：它所在的空间有多少维，比如球面是 3。\n- **内在维度（intrinsic dimension）**：局部需要几个坐标才能描述一个点，比如球面是 2（经度、纬度）。\n\n## 2. \"data lies on a low-dimensional manifold\" 的含义\n\n以图像为例。一张 256×256 的 RGB 图像是 196608 维空间里的一个点。但如果你在这个空间里**随机取点**（每个像素随机赋值），得到的几乎总是雪花噪声，而不是一张有意义的图。\n\n这说明**真实图像只占整个空间极小的一部分**。而且这一部分不是随便散落的，而是有结构的：一张人脸照片的变化，主要由姿态、表情、光照、身份等少数几个因素决定。你沿着这些因素连续变化，就在图像空间里走出一条光滑的曲面。\n\n所以这句话的意思是：\n\n> 数据虽然表示成 D 维向量，但真正的自由度只有 d 维（d ≪ D），所有真实数据点都集中在 D 维空间里一块 d 维的\"弯曲曲面\"上。\n\n这被称为 **manifold hypothesis**。它是一个**假设**，不是严格的定理。现实中更准确的说法是\"数据集中在某个流形附近\"，可能还是多块流形的并集（比如不同类别各一块）。\n\n## 3. 一个可以想象的例子\n\n在 2D 平面上，数据点都分布在一个单位圆上。\n\n- 环境维度 = 2，内在维度 = 1（一个角度 θ 就够了）。\n- 平面上绝大部分区域都没有数据。\n- 如果给数据加高斯噪声，点就会从圆上\"飘开\"，变成一个有厚度的圆环。\n- 要\"去噪\"，直觉上就是把点往最近的圆上拉回去。\n\n高维图像数据就是这个情形的放大版。\n\n## 4. 这和 diffusion model 的联系\n\n理解了上面的内容，论文里很多设计就有了动机：\n\n1. **加噪 = 把数据从流形上推开，填满整个空间。**\n   前向过程在数据上叠加噪声，当噪声足够大时，分布覆盖整个空间，变成容易采样的高斯分布。\n\n2. **去噪 = 把点拉回流形。**\n   score function ∇log p_t(x) 在流形附近大致指向流形方向。模型学到的去噪网络，本质上是在学\"离数据流形最近的方向在哪\"。\n\n3. **为什么必须加噪（Song & Ermon 的动机）。**\n   如果数据严格在低维流形上，那么在原空间中它**没有正常的概率密度**（体积为零），score 在流形外没有定义，而且流形外几乎没有训练样本，score 估计很不准。加噪让分布在全空间有支撑，score 处处有定义，各区域都有样本覆盖。\n\n4. **t → 0 时的数值问题。**\n   噪声很小时，分布极度集中在流形附近，score 的幅度会变得很大（≈ −噪声/σ²），这也是为什么训练里常有噪声调度、损失加权、预测 ε 而不是直接预测 score 等设计。\n\n5. **Latent diffusion。**\n   Stable Diffusion 先用 VAE 把图像压缩到低维 latent，再做 diffusion，也可以看成是在利用\"数据内在维度很低\"这一点，让模型只处理有意义的自由度。\n\n## 5. 小结\n\n| 概念 | 直觉 |\n|---|---|\n| 流形 | 局部像平面/直线、整体可弯曲的空间 |\n| 低维流形假设 | 真实数据只占高维空间里一块自由度很少的曲面 |\n| 在 diffusion 里 | 加噪离开流形，去噪回到流形，score 指向流形 |\n\n需要注意的是，论文里这句话通常只是**动机和直觉**，很少真的去证明数据是严格的流形。如果你想看更严格的讨论，可以搜 *Convergence of denoising diffusion models under the manifold hypothesis*（De Bortoli, 2022）。\n\n你是在看哪一篇论文？如果有具体的上下文，我可以结合那一段再帮你解释。"}, {"code": "53a324", "text": "# 流形是什么\n\n## 1. 数学定义\n\n**流形**是指这样一种空间：它**在局部看起来像普通的欧几里得空间，但整体上可能是弯曲的**。\n\n- **圆**（曲线）：放大其任意部分后，它看起来像一条直线，因此这是一维流形。\n- **球面**（例如地球表面）：在局部它看起来像平面，因此这是二维流形，尽管它嵌入在三维空间中。\n- **反例**：数字“8”的交叉处附近并不像直线，因此它不是流形。\n\n关键区别在于两个维度：\n\n- **环境维度（ambient dimension）**：物体所处的空间有多少维；例如，球面为3维。\n- **内在维度（intrinsic dimension）**：局部描述一个点所需的坐标数量；例如，球面为2维（经度和纬度）。\n\n## 2. “数据位于低维流形上”这一表述的含义。\n\n以图像为例。一张256×256的RGB图像，是196608维空间中的一个点。但如果你**随机选取该空间中的一个点**（给每个像素赋予随机值），那么几乎总会得到一张噪声图像，而非有意义的图片。\n\n这意味着**真实图像仅占整个空间的极小一部分**。而且这部分并非杂乱无章地分布，而是具有结构：人脸照片的变化主要由几个因素决定——姿势、面部表情、光照、身份等。如果依次改变这些因素，在图像空间中就会形成平滑的曲面。\n\n因此，这句话的含义如下：\n\n> 虽然数据以维度为D的向量形式呈现，但其真正的自由度仅为d个维度（d ≪ D）；所有真实数据点都集中在D维空间中一个维度为d的“曲面”上。\n\n这被称为**流形假设**。这是一个**假设**，而非严格的定理。实际上，更精确的表述是：“数据集中在某个流形附近”，而且这可能是多个流形的组合（例如，每个类别对应一个流形）。\n\n## 3. 可以想象的例子\n\n在二维平面上，数据点分布在单位圆上。\n\n- 环境维度 = 2，内在维度 = 1（只需一个角度θ即可描述）。\n- 平面的大部分区域并不包含数据。\n- 如果在数据中加入高斯噪声，这些点就会偏离圆周，变成具有厚度的圆环。\n- 去噪可以直观地理解为：把点拉回最近的圆周上。\n\n多维图像就是这种情况的扩展版本。\n\n## 4. 与扩散模型的关系\n\n理解这些之后，论文里的很多设计就有了动机：\n\n1. **添加噪声 = 将数据从流形上推开，填满整个空间。**\n   前向过程会往数据里叠加噪声；当噪声足够大时，分布会覆盖整个空间并转变为易于采样的高斯分布。\n\n2. **去除噪声 = 将点映射回流形上。**\n   在流形附近，score 函数 ∇log p_t(x)大致指向流形的方向。模型所学习的去噪网络实际上是在学习如何确定“最接近数据流形的方向”。\n\n3. **为何需要添加噪声（Song和Ermon的动机）。**\n   如果数据严格位于低维流形上，那么在原始空间中它们**没有正常的概率密度**（体积为零）；score 函数在流形外没有定义，且流形之外的训练样本也几乎不存在，因此score 估计会很不准。加噪能让分布覆盖整个空间，使score 处处有定义，并确保所有区域中都有样本存在。\n\n4. **当t → 0时的数值问题。**\n   当噪声较小时，分布会高度集中在流形附近，此时score的幅度会变得非常大（≈ −噪声/σ²）。正因如此，在训练中常采用调节噪声、损失加权、预测ε而非直接预测score等方法。\n\n5. **Latent diffusion。**\n   Stable Diffusion 首先通过VAE将图像压缩到低维潜空间，然后再应用扩散过程。这也可以理解为利用了“数据的内在维度很低”这一事实，使模型仅处理那些重要的自由度。\n\n## 5. 小结\n\n| 概念 | 直觉 |\n|---|---|\n| 流形 | 局部平面/直线，全局弯曲的空间 |\n| 低维流形假设 | 真实数据在高维空间中仅占据具有少量自由度的较小曲面。 |\n| 在扩散过程中 | 添加噪声会使点偏离流形，去除噪声则将其拉回流形；score 指向流形所在的方向。 |\n\n论文里这句话通常只是**动机和直觉**，很少真的去证明数据是严格的流形。如果你想看更严格的讨论，可以搜这篇论文：*Convergence of denoising diffusion models under the manifold hypothesis*（De Bortoli, 2022）。\n\n你具体在读哪篇文章？如果能提供上下文，我可以结合那一段再帮你解释。"}]}, {"sid": "writing-004", "title": "AI 编程助手推广方案", "scenario": "writing", "prompt": "帮我写一份内部 AI 编程助手落地推广方案，目标是在研发团队推广 Cursor / Claude Code 这类工具，需要包含目标、实施路径、风险和衡量指标。", "cands": [{"code": "86c2b7", "text": "# 内部 AI 编程助手落地推广方案\n\n> 适用工具：Cursor、Claude Code 等（可扩展至 Copilot、Codex CLI 等）\n> 适用对象：研发团队（后端 / 前端 / 客户端 / 测试 / 数据 / SRE）\n> 说明：方括号 `[ ]` 内为需结合公司实际填写的内容。\n\n---\n\n## 一、背景与定位\n\n**为什么做**\n- AI 编程工具已从“补全”发展到能理解仓库、跨文件修改、运行命令、编写测试的 Agent 形态，对研发效率的影响已不只是边际改善。\n- 员工可能已经在私下使用个人账号，存在代码外泄和合规盲区。与其放任，不如统一引入、统一治理。\n- 竞争对手的研发迭代速度在加快，需要建立组织级的 AI 研发能力，而不是依赖个人自发探索。\n\n**定位**\n> AI 是研发人员的“杠杆”，不是替代。工程师仍对代码质量、系统设计和线上结果负全责。\n\n**两类工具的差异化定位**\n\n| 维度 | Cursor（IDE 型） | Claude Code（终端 Agent 型） |\n|---|---|---|\n| 交互形态 | 编辑器内补全、对话、Agent 模式 | 终端中自主执行多步任务 |\n| 擅长场景 | 日常编码、局部重构、读代码、前端迭代 | 大范围重构、批量迁移、写测试、排查问题、脚本与自动化、CI 集成 |\n| 上手门槛 | 低，接近 VS Code 使用习惯 | 中，需适应“下任务—审查结果”的工作方式 |\n| 治理手段 | 团队/企业版管理、隐私模式、Rules | CLAUDE.md、权限配置、Hooks、MCP、可走云厂商网关 |\n\n建议不强制二选一，而是按场景提供组合，由试点数据决定主推方案。\n\n---\n\n## 二、目标\n\n### 2.1 总体目标（12 个月）\n1. 覆盖率：研发人员中，AI 工具的活跃使用率达到 `[80%]` 以上。\n2. 效率：典型任务（需求开发、Bug 修复、测试编写、代码评审）的交付周期缩短 `[15–30%]`。\n3. 质量不降：缺陷逃逸率、线上事故率不高于基线。\n4. 安全可控：零重大代码/数据泄露事件，100% 使用经批准的企业账号。\n5. 能力沉淀：形成可复用的规则库、提示词库、最佳实践和内部 Champion 网络。\n\n### 2.2 分阶段目标\n\n| 阶段 | 时间 | 核心目标 |\n|---|---|---|\n| 试点期 | 第 1–2 月 | 验证价值与风险，确定工具和规范 |\n| 扩展期 | 第 3–5 月 | 覆盖 50% 以上研发，建立培训与支持体系 |\n| 全面期 | 第 6–9 月 | 全员可用，融入研发流程（评审、CI、文档） |\n| 深化期 | 第 10–12 月 | 从“个人提效”走向“流程与团队级重构” |\n\n### 2.3 非目标（需明确，避免误解）\n- 不以裁员或减编为目的，也不用 AI 使用量做个人绩效考核。\n- 不追求“AI 生成代码占比”本身。\n- 不强制所有场景使用 AI。\n\n---\n\n## 三、实施路径\n\n### 阶段 0：准备（第 0–2 周）\n\n**关键动作**\n1. 成立推进小组（见第四节）。\n2. 采集基线数据：PR 周期、构建/评审耗时、缺陷率、部署频率、开发者满意度调研（没有基线，就无法证明价值）。\n3. 安全与法务评审：\n   - 供应商数据处理协议（是否用于训练、数据留存、数据驻留、SOC2/ISO 认证）\n   - 代码分级：哪些仓库可用，哪些禁用（如核心算法、密钥、客户敏感数据）\n   - 企业版功能：SSO、隐私模式强制开启、审计日志、用量管理\n4. 制定《AI 编程工具使用规范》v0.1（见第六节）。\n5. 确定试点预算与采购方式。\n\n**退出标准**：安全评审通过、基线数据到位、试点名单确定。\n\n### 阶段 1：试点（第 3–8 周）\n\n**试点范围**\n- 规模：`[30–50]` 人，约占研发 10%。\n- 选人原则：覆盖不同技术栈、不同资历；既要有积极拥护者，也要有 2–3 成怀疑者，以获得更真实的反馈。\n- 选项目：选择 1–2 个有代表性的存量项目和 1 个新项目。\n\n**关键动作**\n1. 启动培训（2 小时）：工具使用、提示技巧、安全红线、审查方法。\n2. 为试点仓库配置：\n   - Cursor：`.cursor/rules`\n   - Claude Code：`CLAUDE.md`，包含项目结构、构建/测试命令、编码规范、禁区\n3. 设定典型任务清单并对照记录（见下表）。\n4. 每周站会或群内答疑，每两周复盘，沉淀案例。\n5. 可选 A/B：同类任务在使用与不使用 AI 的小组间对比。\n\n**试点任务示例**\n\n| 任务类型 | 示例 |\n|---|---|\n| 理解代码 | 新人熟悉模块、梳理调用链 |\n| 写测试 | 为存量代码补单测 |\n| Bug 修复 | 根据日志定位并修复 |\n| 小需求开发 | CRUD、接口联调、页面开发 |\n| 重构/迁移 | 依赖升级、API 迁移、语言版本升级 |\n| 文档/脚本 | README、迁移脚本、运维脚本 |\n\n**退出标准**（示例）\n- 试点用户周活 ≥ 70%，NPS ≥ `[30]`。\n- 至少 3 类场景有明确提效数据。\n- 无重大安全事件，质量指标未恶化。\n- 产出规范 v1.0、规则模板、至少 10 个最佳实践案例。\n\n### 阶段 2：扩展（第 3–5 月）\n\n1. 分批放量：按团队分 2–3 批，每批 100–200 人。\n2. Champion 网络：每个小团队 1 名 Champion（约 1:10–1:15），负责答疑、分享、收集反馈。\n3. 培训体系：\n   - 入门课（必修）：工具、安全与审查\n   - 进阶课：Agent 工作流、上下文管理、MCP 接入、规则编写\n   - 场景课：前端、后端、测试、数据、SRE 各自的实战\n4. 知识库建设：内部 Wiki，包含规则模板、Prompt 库、踩坑记录、优秀案例。\n5. 自助支持：FAQ、答疑群、Office Hour（每周固定时段）。\n6. 采购与账号：接入 SSO，建立席位自动分配与回收机制。\n\n### 阶段 3：全面融入流程（第 6–9 月）\n\n1. 代码评审：PR 模板增加“AI 参与说明”（可选）；引入 AI 辅助评审作为人工评审的前置检查，而不是替代人工评审。\n2. CI/CD 集成：自动生成测试建议、变更摘要，增强安全扫描；Claude Code 等可用于无人值守的小任务（如依赖升级 PR），但必须由人工合并。\n3. 工程基础设施适配：\n   - 完善测试覆盖与 CI 速度（AI 的反馈循环依赖它）\n   - 完善文档与代码规范（AI 的上下文质量依赖它）\n   - 统一仓库内的 Agent 规则文件\n4. MCP / 内部工具接入：对接内部文档、工单、监控、代码搜索，权限按最小化原则配置。\n5. 新人 onboarding：把 AI 辅助熟悉代码库纳入新人培养流程。\n\n### 阶段 4：深化与持续运营（第 10–12 月及以后）\n\n- 从“个人提效”升级到“团队级流程重构”：例如需求拆解 → AI 起草方案 → 人审 → AI 实现 → 自动测试 → 人审。\n- 建立内部最佳实践大赛或 Demo Day。\n- 每季度评估工具选型，持续比较新工具和新模型。\n- 优化成本：按场景分配模型与额度，监控异常消耗。\n\n---\n\n## 四、组织与角色\n\n| 角色 | 职责 |\n|---|---|\n| 发起人（CTO/研发 VP） | 提供资源和授权，负责对外沟通 |\n| 推进小组（PMO + 架构 + 效能） | 负责路线图、节奏、数据、预算 |\n| 安全与法务 | 负责供应商评审、规范、审计、事件响应 |\n| IT / 平台 | 负责账号、SSO、网络、网关、采购 |\n| 效能/度量团队 | 负责基线、数据采集、看板、分析 |\n| Champion | 负责一线推广、答疑、反馈 |\n| 团队 Leader | 在团队内落实规范，营造试错氛围 |\n| 全体研发 | 合规使用，对产出负责，贡献案例 |\n\n---\n\n## 五、工具与账号治理要点\n\n- 只用企业账号：禁止个人账号处理公司代码；SSO 统一登录。\n- 隐私模式强制开启：确认不用于训练、零数据留存（按供应商企业条款核实）。\n- 模型接入方式：评估是否经公司网关或云厂商（如 Bedrock / Vertex）接入，以便统一审计、限流和计费。\n- 权限最小化：Agent 的命令执行、文件读写、网络访问采用白名单；生产环境凭证绝不暴露给 Agent。\n- 仓库分级：\n\n| 级别 | 示例 | 策略 |\n|---|---|---|\n| 一般 | 普通业务代码、前端、工具 | 允许使用 |\n| 敏感 | 支付、风控、用户数据处理 | 限定工具与模式，加强评审 |\n| 禁止 | 密钥库、核心算法、受监管数据 | 禁用，或仅限本地/私有化模型 |\n\n---\n\n## 六、使用规范（核心条款）\n\n1. 责任归属：AI 生成的代码，提交者负全责；必须逐行理解后再提交。\n2. 数据红线：不向 AI 输入密钥、Token、客户个人信息、生产数据；把 `.env` 等文件加入忽略清单。\n3. 审查要求：AI 参与的变更同样走 Code Review，高风险模块（权限、支付、并发、数据迁移）强化审查。\n4. 测试要求：AI 生成的变更必须有测试覆盖并通过 CI。\n5. 依赖与许可证：AI 引入的新依赖须经过依赖与许可证扫描；对大段疑似开源代码做相似性检查。\n6. Agent 自动执行边界：禁止自动执行破坏性命令（如 `rm -rf`、强推、数据库写操作、生产部署）；采用确认机制或沙箱。\n7. 透明度：鼓励在 PR 中说明 AI 参与程度，用于经验沉淀，而不是追责。\n8. 事件上报：发现数据误传或异常行为，须立即上报，**不追究善意上报者**。\n\n---\n\n## 七、风险与应对\n\n| 类别 | 风险 | 可能性/影响 | 应对措施 |\n|---|---|---|---|\n| 安全 | 代码或敏感数据外泄至第三方 | 中/高 | 企业版 + 隐私模式；仓库分级；DLP；网关审计；培训 |\n| 安全 | Prompt 注入、恶意 MCP/插件、供应链攻击 | 中/高 | MCP 白名单与审核；限制 Agent 的网络与命令权限；沙箱 |\n| 安全 | Agent 误操作（删库、泄露凭证、误推送） | 低/高 | 最小权限；禁用生产凭证；命令确认；分支保护 |\n| 质量 | 看似正确但实际有误的代码、隐蔽 Bug、过度设计 | 高/中 | 强制评审与测试；用规则文件约束风格；小步提交 |\n| 质量 | 代码重复度增加、架构劣化、技术债累积 | 中/中 | 架构守护规则；定期重构；监控代码重复度和变更回滚率 |\n| 能力 | 初级工程师过度依赖，基本功退化 | 中/中 | 要求“能解释每一行”；新人阶段安排有指导的使用方式；技术分享 |\n| 能力 | 评审压力增大（AI 产出多，评审成为瓶颈） | 高/中 | 控制 PR 粒度；AI 辅助预审；调整评审资源 |\n| 效率 | 实际提效不及预期，甚至变慢（熟悉代码库的资深工程师尤其可能如此） | 中/中 | 不预设结论，用数据验证；按场景推广；提供上下文配置支持 |\n| 合规 | 许可证污染、知识产权归属争议 | 低/高 | 供应商知识产权条款；开源扫描；法务备案 |\n| 合规 | 受监管行业或客户合同限制 | 视情况 | 事先梳理合同条款；敏感项目走私有化或例外审批 |\n| 组织 | 员工焦虑、抵触，或担心“被监控” | 中/中 | 公开沟通“不替代、不考核用量”；鼓励试错；展示正面案例 |\n| 组织 | 使用不均，形成“AI 富人/穷人”的分化 | 中/低 | Champion 机制；分享会；统一资源 |\n| 成本 | Token/席位成本失控，Agent 长任务消耗大 | 中/中 | 额度与预算告警；按角色分级；成本看板；鼓励拆分小任务 |\n| 依赖 | 供应商涨价、停服、模型变化 | 低/中 | 保持工具可替换；规则文件尽量与工具解耦；评估多家供应商 |\n\n---\n\n## 八、衡量指标\n\n### 8.1 原则\n- 先建基线，再比较。\n- 组合指标：既看速度，也看质量和体验，避免单一指标被刷。\n- 团队级而非个人级：不用于个人考核，防止数据被扭曲。\n- 定性与定量结合。\n- 避免把“生成代码行数”“采纳率”当作价值指标，它们只是过程参考。\n\n### 8.2 指标体系\n\n**A. 采纳与使用（过程指标）**\n\n| 指标 | 定义 | 目标参考 |\n|---|---|---|\n| 席位激活率 | 已激活 / 已分配 | ≥ 90% |\n| 周活跃率（WAU） | 每周至少使用的人数占比 | ≥ 70–80% |\n| 深度使用率 | 使用 Agent/多文件修改的用户占比 | 逐季上升 |\n| 补全/建议采纳率 | 被接受的建议比例 | 仅作参考 |\n| 培训完成率 | 完成必修课人数占比 | 100% |\n\n**B. 效率与交付（结果指标）**\n\n| 指标 | 定义 |\n|---|---|\n| PR 周期时间 | 从创建到合并的时长（拆分：编码、等待评审、评审、合并） |\n| 需求交付周期（Lead Time） | 需求开始到上线 |\n| 部署频率 | DORA 指标 |\n| 每开发者合并 PR 数/需求吞吐 | 配合质量指标一起看 |\n| 典型任务耗时对比 | 如“补 100 个单测”“一次依赖升级”的前后对比 |\n| 新人上手时间 | 入职到首个独立 PR |\n\n**C. 质量与稳定性（护栏指标，不得恶化）**\n\n| 指标 | 定义 |\n|---|---|\n| 变更失败率 | DORA：导致故障/回滚的变更比例 |\n| 故障恢复时间（MTTR） | DORA |\n| 缺陷逃逸率 | 上线后发现缺陷数 / 总缺陷 |\n| 代码返工率 / 回滚率 | 合并后短期内被修改或回滚的比例 |\n| 测试覆盖率与 CI 通过率 | 测试质量 |\n| 代码重复度、静态扫描问题数 | 代码健康度 |\n\n**D. 安全与合规**\n\n| 指标 | 目标 |\n|---|---|\n| 安全事件数 | 0 起重大事件 |\n| 非授权工具使用检出数 | 持续下降 |\n| 密钥/敏感信息泄漏检出 | 0 或快速处置 |\n| 依赖/许可证违规数 | 不上升 |\n\n**E. 开发者体验**\n\n| 指标 | 方式 |\n|---|---|\n| 满意度 / NPS | 季度问卷 |\n| 自评节省时间 | 问卷 + 访谈 |\n| 认知负担、心流体验 | SPACE 框架问题 |\n| 障碍与抱怨清单 | 持续收集 |\n\n**F. 成本与 ROI**\n\n| 指标 | 定义 |\n|---|---|\n| 人均月度成本 | 席位 + 用量 |\n| 成本结构 | 按团队、工具、模型拆分 |\n| ROI 估算 | （节省工时 × 工时成本 − 总投入）/ 总投入，保守估算并说明假设 |\n| 单位交付成本 | 每需求/每 PR 成本变化 |\n\n### 8.3 数据来源与节奏\n- 工具后台：使用量、席位、活跃度\n- Git / CI / 工单系统：PR、构建、交付、缺陷\n- 安全平台：DLP、扫描、审计日志\n- 问卷与访谈：体验与定性\n- 节奏：每周看活跃，每月看效率与成本，每季度做综合评估并向管理层汇报\n\n### 8.4 阶段验收参考\n\n| 阶段 | 关键验收条件 |\n|---|---|\n| 试点 | 活跃率 ≥ 70%；至少 3 个场景有提效证据；质量与安全无恶化 |\n| 扩展 | 覆盖 ≥ 50%；PR 周期下降 `[10%]`；NPS ≥ `[30]` |\n| 全面 | 活跃率 ≥ 80%；交付周期下降 `[15–30%]`；质量指标持平或改善 |\n| 深化 | 形成 2–3 个团队级 AI 工作流标杆；ROI 为正且可复算 |\n\n---\n\n## 九、成功关键因素\n\n1. 管理层公开站台，并明确“不用于裁员或个人考核”。\n2. 安全先行，让工程师“有路可走”，而不是“禁而不止”。\n3. Champion 与社区比大规模培训更有效。\n4. 工程基础设施（测试、CI、文档、规范）是放大器，AI 的收益很大程度取决于此。\n5. 持续度量与迭代，允许根据数据调整工具和策略。\n6. 管理预期：不同角色和场景的收益差异很大，避免“一刀切”的效率承诺。\n\n---\n\n## 十、时间线概览\n\n```\n第0-2周    准备：评审、基线、规范v0.1\n第3-8周    试点：30-50人，两个项目，周/双周复盘\n第9-12周   总结试点，决策工具组合，发布规范v1.0\n第3-5月    扩展：分批放量，Champion、培训、知识库\n第6-9月    全面：融入评审、CI、新人培养，MCP接入\n第10-12月  深化：团队级流程重构，ROI复盘，来年规划\n```\n\n---\n\n## 十一、待确认事项（启动前需拍板）\n\n1. 预算上限与采购模式（席位制 / 用量制 / 云厂商网关）。\n2. 工具主推方案与是否多工具并行。\n3. 仓库分级清单及受限项目名单。\n4. 是否有行业监管或客户合同对 AI 工具的限制。\n5. 度量数据的使用边界（确认不用于个人考核）。\n6. 推进小组人员与每人投入比例。\n\n---\n\n如需，我可以继续输出以下配套材料：\n- 《AI 编程工具使用规范》正式版草稿\n- 试点期问卷与基线调研模板\n- `CLAUDE.md` / `.cursor/rules` 的团队模板\n- 面向管理层的汇报 PPT 大纲\n- ROI 测算表结构"}, {"code": "1168ee", "text": "# 内部 AI 编程助手落地推广方案\n\n> 合适的工具：Cursor、Claude、Code等（可扩展至Copilot、Codex、CLI等）\n> 目标受众：开发团队（后端/前端/客户端/测试/数据/SRE）\n> 注：方括号`[ ]`中的内容需根据公司的实际情况填写。\n\n---\n\n## 一、背景与定位\n\n**为什么做**\n- AI 编程工具已经不只是自动补全，还能理解代码库、跨文件改代码、执行命令、写测试，成了 Agent。对研发效率的影响已经很明显。\n- 员工可能已经在用个人账号，这会带来代码泄露风险和合规漏洞。与其不管，不如统一引入、统一管理。\n- 竞争对手的研发迭代在加快，所以要把 AI 研发能力建在组织层面，不能只靠个人自发探索。\n\n**定位**\n> AI是开发人员的“杠杆”，而非替代品。工程师仍需对代码质量、系统设计以及生产环境中的成果承担全部责任。\n\n**两类工具的不同定位**\n\n| 维度 | Cursor（IDE 型） | Claude Code（终端 Agent 型） |\n|---|---|---|\n| 交互形态 | 编辑器中的自动补全、对话框、Agent模式 | 在终端中独立执行多步骤任务 |\n| 擅长场景 | 日常编程、局部重构、代码阅读、前端迭代 | 大规模重构、批量迁移、编写测试、排除故障、脚本与自动化、与CI集成 |\n| 上手门槛 | 低，接近 VS Code 的使用习惯 | 中等，需要适应“下达任务—检查结果”的工作流程 |\n| 治理抓手 | 团队/企业版管理、隐私模式、Rules | CLAUDE.md、访问权限设置、Hooks、MCP，支持使用云服务提供商网关 |\n\n建议**不要强制二选一**，而是根据场景提供组合方案；主推哪个方案，由试点数据决定。\n\n---\n\n## 二、目标\n\n### 2.1 总体目标（12个月）\n1. **覆盖水平**：研发人员中，AI 工具的活跃使用率达到 `[80%]` 以上。\n2. **效率**：典型任务（需求开发、错误修复、测试编写、代码审查）的交付周期缩短`[15–30%]`。\n3. **质量保持**：缺陷逃逸率、线上事故率不超过基准水平。\n4. **安全与控制**：无严重的代码/数据泄露事件；100%使用经批准的企业账户。\n5. **能力积累**：创建可复用的规则库、提示库、最佳实践以及内部 Champion 网络。\n\n### 2.2 阶段性目标\n\n| 阶段 | 时间 | 核心目标 |\n|---|---|---|\n| 试点期 | 第 1–2 月 | 评估价值与风险，确定工具和标准 |\n| 扩展期 | 第 3–5 月 | 覆盖 50% 以上的研发，建立培训与支持体系 |\n| 全面期 | 第 6–9 月 | 全体研发可用，融入开发流程（评审、CI、文档） |\n| 深化期 | 第10–12个月 | 从“提升个人效率”转向“流程与团队级重构”。 |\n\n### 2.3 并非目标（需加以说明以避免误解）\n- 并不以“裁员/减编”为目标，也不使用AI的使用量来评估个人工作表现。\n- 不把“AI 生成代码占比”本身当作目标。\n- 不会要求所有场景都必须用 AI。\n\n---\n\n## 三、实施路径\n\n### 阶段0：准备工作（第0–2周）\n\n**关键动作**\n1. 成立推进小组（参见第四节）。\n2. 收集**基础数据**：PR 周期、构建/评审耗时、缺陷率、部署频率、开发者满意度调查（没有基础数据就无法证明其价值）。\n3. 安全与法律方面的审查：\n   - 供应商数据处理协议（培训、数据存储、数据托管、SOC2/ISO认证）\n   - 代码分级：哪些仓库可用，哪些被禁止（例如，核心算法、密钥、客户敏感数据）\n   - 企业版功能：SSO、强制开启隐私模式、审计日志、使用管理\n4. 制定《AI 编程工具使用规范》v0.1（参见第六节）。\n5. 确定试点项目的预算和采购方式。\n\n**完成标准**：顺利通过安全性评估、具备基础数据、批准试点参与者名单。\n\n### 阶段1：试点项目（第3–8周）\n\n**试点范围**\n- 规模：`[30–50]`人，约占开发人员总数的10%。\n- 选拔原则：涵盖不同的技术栈和技能水平；**需同时纳入积极支持者和2–3 成怀疑者**，以获得更可靠的反馈。\n- 项目选择：选取1–2个具有代表性的现有项目和1个新项目。\n\n**关键动作**\n1. 培训启动（2小时）：工具使用、提示技巧、安全红线、审查方法。\n2. 试点仓库的设置：\n   - Cursor：`.cursor/rules`\n   - Claude Code：`CLAUDE.md`，包括项目结构、构建/测试命令、编码规范、禁区。\n3. 制定典型任务清单并进行相应记录（见下表）。\n4. 每周站会/群答疑，每两周复盘，积累案例。\n5. 可选 A/B：比较执行类似任务的各组在使用与不使用 AI 情况下的表现。\n\n**试点任务示例**\n\n| 任务类型 | 示例 |\n|---|---|\n| 理解代码 | 新人熟悉模块、梳理调用链 |\n| 写测试 | 为现有代码添加单元测试 |\n| 修复错误 | 通过日志查找并修复错误 |\n| 小需求开发 | CRUD，接口联调，页面开发 |\n| 重构/迁移 | 更新依赖项，API 迁移，升级语言版本 |\n| 文档/脚本 | README，迁移脚本，运维脚本 |\n\n**退出标准**（示例）\n- 试点用户一周内的活跃度≥70%，NPS ≥ `[30]`。\n- 至少 3 类场景有明确的提效数据。\n- 没有严重的安全事件，质量指标未恶化。\n- 已制定v1.0规范、规则模板以及至少10个最佳实践案例。\n\n### 阶段 2：扩展（第 3–5 月）\n\n1. **分批部署**：按团队分 2–3 批，每批 100–200 人。\n2. **Champion 网络**：每个小团队配 1 名 Champion（比例约为1:10–1:15），负责解答问题、交流经验并收集反馈。\n3. **培训体系**：\n   - 入门课程（必修）：工具使用 + 安全性 + 评审流程\n   - 进阶课程：工作流程Agent、上下文管理、集成MCP、规则编写\n   - 场景化课程：前端、后端、测试、数据，各方向均设有针对SRE的实践课程\n4. **知识库创建**：内部Wiki，包含规则模板、Prompt库、常见错误记录以及最佳实践示例。\n5. **自助服务**：FAQ、答疑群、Office Hour（每周固定时间）。\n6. 采购与账号：接入 SSO，席位自动分配和回收。\n\n### 阶段 3：全面融入流程（第 6–9 月）\n\n1. **代码评审**：在模板PR中增加“AI 参与说明”一节（可选）；引入AI以辅助评审，作为人工评审前的初步检查，而非替代人工评审。\n2. **CI/CD集成**：自动生成测试建议、变更摘要，加强安全扫描；Claude Code等可用于无需人工干预的任务（例如更新依赖项PR），但需手动合并。\n3. **工程基础设施的适配**：\n   - 完善测试覆盖与 CI 速度（AI 的反馈环依赖它）\n   - 完善文档和代码规范（AI 的上下文质量依赖它）\n   - 统一仓库内的 Agent 规则文件\n4. **MCP / 内部工具集成**：与内部文档、工单系统、监控及代码搜索功能集成；访问权限遵循最小原则。\n5. **新人引导**：把 AI 辅助熟悉代码库纳入新人培养流程。\n\n### 阶段4：深化与持续运营（10–12个月及以后）\n\n- 从“个人效率提升”转向“团队级流程重构”：例如，拆分需求 → AI 起草方案 → 人审 → AI 实现 → 自动测试 → 人工审核。\n- 组织内部最佳实践竞赛/Demo Day。\n- 每季度评估工具选型，持续对比新工具与模型。\n- 成本优化：按场景分配模型与限额，监控异常消耗情况。\n\n---\n\n## 四、组织与角色\n\n| 角色 | 职责 |\n|---|---|\n| 发起人（CTO/开发VP）。 | 资源与权限的提供、外部沟通 |\n| 推进工作组（PMO + 架构 + 效率） | 路线图、时间表、数据、预算 |\n| 安全与法务 | 供应商评估、标准、审计、事件响应 |\n| IT / 平台 | 账户、SSO、网络、网关、采购 |\n| 效能/度量团队 | 基线、数据采集、看板、分析 |\n| Champion | 推广、答疑及关于主要方向的反馈 |\n| 团队 Leader | 在团队中推行标准，营造实验氛围 |\n| 全体研发 | 遵守使用规则，对结果负责，提供示例 |\n\n---\n\n## V. 工具和账户管理要点\n\n- **仅使用企业账户**：禁止用个人账户处理公司代码；SSO为统一登录方式。\n- **必须开启隐私模式**：确保数据不用于训练且不被保存（需根据供应商条款进行确认）。\n- **模型连接方式**：评估是否通过公司网关或云服务提供商（例如Bedrock / Vertex）进行连接，以实现统一的审计检查、流量限制和成本核算。\n- **最小化访问权限**：在Agent中执行命令、读写文件及网络访问都采用白名单；生产环境凭证绝不暴露给 Agent。\n- **仓库分级**：\n\n| 级别 | 示例 | 策略 |\n|---|---|---|\n| 一般 | 常规业务代码、前端、工具 | 允许使用 |\n| 敏感 | 支付、风险管理、用户数据处理 | 限定工具与模式，加强评审 |\n| 禁止 | 密钥存储、关键算法、受监管数据 | 禁用，或仅限本地/私有化模型 |\n\n---\n\n## 六、使用规则（基本原则）\n\n1. **责任**：对于由AI生成的代码，提交者负全责；提交前必须逐行理解代码。\n2. **数据红线**：切勿将密钥、Token、客户个人信息以及生产数据输入AI；将`.env`等文件加入忽略列表。\n3. **评审要求**：涉及AI的变更同样需经过CodeReview的评审；高风险模块（权限控制、支付、并发处理、数据迁移）须接受严格评审。\n4. **测试要求**：由AI生成的变更内容必须覆盖测试用例，并通过CI的验证。\n5. **依赖项与许可证**：通过AI引入的新依赖项必须经过依赖项/许可证扫描；同时会检查其是否与疑似开源代码的大段片段相似。\n6. **自动执行Agent**：禁止自动执行破坏性命令（例如`rm -rf`、强推、数据库写入操作、生产环境部署）；需采用确认机制或沙箱环境。\n7. **透明度**：建议在PR中注明AI的参与程度，以便积累经验，而非用于追究责任。\n8. **事件报告**：一旦发现数据误传或异常行为，必须立即上报；**不得追究善意报告者的责任**。\n\n---\n\n## 七、风险与应对\n\n| 类别 | 风险 | 可能性/影响 | 应对措施 |\n|---|---|---|---|\n| 安全 | 代码或敏感数据外泄给第三方 | 中/高 | 企业版+隐私模式；仓库分类；DLP；网关审计；培训 |\n| 安全 | Prompt 植入、恶意插件 MCP/、供应链攻击 | 中/高 | MCP 白名单与审计；限制 Agent 的网络与命令权限；沙箱环境 |\n| 安全 | Agent 误操作（删库、泄露凭证、误推送） | 低/高 | 最小权限原则；禁用生产环境凭证；命令确认机制；分支保护 |\n| 质量 | 看似正确的错误代码、隐蔽 Bug、过度设计 | 高/中 | 强制评审与测试；规则文件中的风格限制；小步提交。 |\n| 质量 | 代码重复增加，架构变差，技术债务累积 | 中/中 | 架构维护规则；定期重构；监控代码重复度和变更回滚率 |\n| 能力 | 初级工程师过度依赖，基本功退化 | 中/中 | 要求“能解释每一行代码”；为新手在培训阶段提供使用方式指导；分享技术经验 |\n| 能力 | 评审负担加重（大量AI结果，评审成为瓶颈） | 高/中 | 控制PR的大小；利用AI进行预检；调整评审资源 |\n| 效率 | 实际效率提升低于预期，有时甚至有所下降（对于熟悉代码库的经验丰富的开发者而言尤其如此）。 | 中/中 | 不要过早下结论；基于数据来验证；根据具体场景来实施；确保提供上下文配置支持。 |\n| 合规 | 许可证污染、知识产权归属争议。 | 低/高 | 供应商关于知识产权的条款；开源软件扫描；法务备案。 |\n| 合规 | 与受监管行业或客户合同条款相关的限制。 | 视情况 | 提前分析合同条款；对于敏感项目，采用私有化/特别审批流程。 |\n| 组织 | 员工的担忧、抵触情绪以及“被监视”的感觉 | 中/中 | 开放式沟通：“不替代、不考核用量”；鼓励尝试；展示正面范例 |\n| 组织 | 使用不均衡，形成“AI 富裕/贫困”类别 | 中/低 | Champion机制；经验交流会议；资源统一化 |\n| 成本 | Token/席位成本失控；长期任务Agent消耗大量资源 | 中/中 | 关于限制和预算的警告；按角色划分；成本看板；鼓励将任务拆分为更小的部分 |\n| 依赖 | 供应商提价、停止服务、模型变化 | 低/中 | 保持更换工具的能力；规则文件应尽可能独立于工具；评估多个供应商 |\n\n---\n\n## 八、衡量指标\n\n### 8.1 原则\n- **先建立基准，再进行比较**。\n- **综合指标**：需考虑速度、质量和体验，以避免单一指标导致数据失真。\n- **以团队为单位，而非个人**：不用于个人评估，以防止数据失真。\n- **定性 + 定量**结合。\n- 不应将“生成的代码行数”和“采纳率”作为价值指标；它们仅作为过程中的参考依据。\n\n### 8.2 指标体系\n\n**A. 采纳与使用（过程性指标）**\n\n| 指标 | 定义 | 目标参考 |\n|---|---|---|\n| 席位激活率 | 已激活 / 已分配 | ≥ 90% |\n| 周活跃率（WAU） | 每周至少使用一次的用户比例 | ≥ 70–80% |\n| 深度使用率 | 使用Agent/编辑多个文件的用户比例 | 逐季上升 |\n| 补全/建议采纳率 | 被采纳的建议的比例 | 仅作参考 |\n| 培训完成率 | 完成必修课的人数占比 | 100% |\n\n**B. 效率与成果（成果指标）**\n\n| 指标 | 定义 |\n|---|---|\n| PR 周期时间 | 从创建到合并的时间（细分：代码编写、等待评审、评审、合并） |\n| 需求交付周期（Lead Time） | 需求开始到上线 |\n| 部署频率 | DORA 指标 |\n| 每位开发者的合并次数 PR / 需求吞吐量 | 需与质量指标一并考量 |\n| 典型任务执行时间的比较 | 诸如“编写100个单元测试”或“一次性更新依赖项”等操作前后的比较 |\n| 新人上手时间 | 入职到首个独立 PR |\n\n**C. 质量与稳定性（限制性指标，不得恶化）**\n\n| 指标 | 定义 |\n|---|---|\n| 变更失败率 | DORA：导致故障/回滚的变更比例 |\n| 故障后的恢复时间（MTTR） | DORA |\n| 缺陷逃逸率 | 发布后发现的缺陷数量 / 缺陷总数 |\n| 代码返工率 / 回滚率 | 合并后短期内的变更或回滚比例 |\n| 测试覆盖率及通过率 CI | 测试质量 |\n| 代码重复程度，静态分析中发现的问题数量 | 代码健康度 |\n\n**D. 安全性与合规性**\n\n| 指标 | 目标 |\n|---|---|\n| 安全事件数 | 0 起重大事件 |\n| 检测到的使用未经授权工具的情况数量 | 持续下降 |\n| 密钥/机密信息泄露的检测情况 | 0 或快速处置 |\n| 违反许可要求/依赖项违规的数量 | 不上升 |\n\n**E. 开发者经验**\n\n| 指标 | 方式 |\n|---|---|\n| 满意度 / NPS | 季度问卷 |\n| 自评节省时间 | 问卷 + 访谈 |\n| 认知负担、心流体验 | SPACE 框架问题 |\n| 障碍与抱怨清单 | 持续收集 |\n\n**F. 成本与 ROI**\n\n| 指标 | 定义 |\n|---|---|\n| 人均月度成本 | 席位 + 用量 |\n| 成本结构 | 按团队、工具和模型分类 |\n| ROI 估算 | （节省的时间 × 每小时工作成本 – 总成本）/ 总成本；附带假设的保守估算 |\n| 单位交付成本 | 每项需求/每个PR的成本变动 |\n\n### 8.3 数据来源与节奏\n- **后台工具**：使用量、席位、活跃度\n- **Git / CI / 工单系统**：PR、构建、交付、缺陷\n- **安全平台**：DLP，扫描，审计日志\n- **问卷与访谈**：体验与定性\n- **节奏**：每周—活动 → 每月—效率与成本 → 每季度—综合评估并向管理层汇报\n\n### 8.4 阶段验收参考\n\n| 阶段 | 关键验收条件 |\n|---|---|\n| 试点 | 活跃率 ≥ 70%；至少在3种场景下有效率提升的证据；质量与安全未恶化 |\n| 扩展 | 覆盖率≥50%；PR周期缩短`[10%]`；NPS≥`[30]` |\n| 全面 | 活跃率 ≥80%；交付周期缩短`[15–30%]`；质量指标保持不变或有所改善。 |\n| 深化 | 形成 2–3 个团队级 AI 工作流标杆；ROI 为正且可复算。 |\n\n---\n\n## 九、成功的关键因素\n\n1. **管理层公开支持**，同时明确表示这“不用于裁员或个人评估”。\n2. **安全先行**：应为工程师提供“行动路径”，而非没有替代方案的禁令。\n3. **Champion与社区**比大规模培训更有效。\n4. **工程基础设施**（测试、CI、文档、规范）起到增强作用；AI 的收益很大程度取决于它。\n5. **持续测量与迭代**，能够基于数据调整工具和策略。\n6. **期望管理**：不同角色和场景下的收益差异很大；应避免做出关于效率的通用性承诺。\n\n---\n\n## 十、时间线概览\n\n```\n第0-2周    准备：评审、基线、规范v0.1\n第3-8周    试点：30-50人，两个项目，周/双周复盘\n第9-12周   总结试点，决策工具组合，发布规范v1.0\n第3-5月    扩展：分批放量，Champion、培训、知识库\n第6-9月    全面：融入评审、CI、新人培养，MCP接入\n第10-12月  深化：团队级流程重构，ROI复盘，来年规划\n```\n\n---\n\n## 十一个需要确认的问题（启动前必须解决）。\n\n1. 预算限制与采购模式（按席位数量/按使用量/云服务提供商网关）。\n2. 推荐的主要工具方案以及同时使用多种工具的可能性。\n3. 仓库分级清单及受限项目名单。\n4. 行业监管机构或客户合同是否对 AI 工具的使用有限制。\n5. 测量数据的使用范围（确认其不用于个人评估）。\n6. 工作组的组成及各成员的参与比例。\n\n---\n\n如有需要，我可以继续提供以下相关材料：\n- 《AI 编程工具使用规范》正式版草稿。\n- 试点期问卷与基线调研模板\n- 团队模板 `CLAUDE.md` / `.cursor/rules`\n- 面向管理层的汇报 PPT 大纲\n- ROI 测算表结构"}, {"code": "6c25f8", "text": "# 内部 AI 编程助手落地推广方案\n\n> 适用工具：Cursor、Claude Code 等（可扩展至 Copilot、Codex CLI 等）\n> 适用对象：研发团队（后端 / 前端 / 客户端 / 测试 / 数据 / SRE）\n> 说明：方括号 `[ ]` 内为需结合公司实际填写的内容。\n\n---\n\n## 一、背景与定位\n\n**为什么做**\n- AI 编程工具已从\"补全\"进化到\"能理解仓库、跨文件修改、跑命令、写测试\"的 Agent 形态，对研发效率的影响不再是边际改善。\n- 员工可能已在私下使用个人账号，存在代码外泄和合规盲区。**与其放任，不如统一引入、统一治理。**\n- 竞争对手的研发迭代速度在加快，需要建立组织级的 AI 研发能力，而不是依赖个人自发探索。\n\n**定位**\n> AI 是研发人员的\"杠杆\"，不是替代。工程师仍对代码质量、系统设计和线上结果负全责。\n\n**两类工具的差异化定位**\n\n| 维度 | Cursor（IDE 型） | Claude Code（终端 Agent 型） |\n|---|---|---|\n| 交互形态 | 编辑器内补全、对话、Agent 模式 | 终端中自主执行多步任务 |\n| 擅长场景 | 日常编码、局部重构、读代码、前端迭代 | 大范围重构、批量迁移、写测试、排查问题、脚本与自动化、CI 集成 |\n| 上手门槛 | 低，接近 VS Code 使用习惯 | 中，需适应\"下任务—审查结果\"的工作方式 |\n| 治理抓手 | 团队/企业版管理、隐私模式、Rules | CLAUDE.md、权限配置、Hooks、MCP、可走云厂商网关 |\n\n建议**不强制二选一**，而是按场景提供组合，由试点数据决定主推方案。\n\n---\n\n## 二、目标\n\n### 2.1 总体目标（12 个月）\n1. **覆盖率**：研发人员 AI 工具活跃使用率达 `[80%]` 以上。\n2. **效率**：典型任务（需求开发、Bug 修复、测试编写、代码评审）的交付周期缩短 `[15–30%]`。\n3. **质量不降**：缺陷逃逸率、线上事故率不高于基线。\n4. **安全可控**：零重大代码/数据泄露事件，100% 使用经批准的企业账号。\n5. **能力沉淀**：形成可复用的规则库、提示词库、最佳实践和内部 Champion 网络。\n\n### 2.2 分阶段目标\n\n| 阶段 | 时间 | 核心目标 |\n|---|---|---|\n| 试点期 | 第 1–2 月 | 验证价值与风险，确定工具和规范 |\n| 扩展期 | 第 3–5 月 | 覆盖 50% 以上研发，建立培训与支持体系 |\n| 全面期 | 第 6–9 月 | 全员可用，融入研发流程（评审、CI、文档） |\n| 深化期 | 第 10–12 月 | 从\"个人提效\"走向\"流程与团队级重构\" |\n\n### 2.3 非目标（需明确，避免误解）\n- 不以\"裁员/减编\"为目的，也不用 AI 使用量做个人绩效考核。\n- 不追求\"AI 生成代码占比\"本身。\n- 不要求所有场景强制使用 AI。\n\n---\n\n## 三、实施路径\n\n### 阶段 0：准备（第 0–2 周）\n\n**关键动作**\n1. 成立推进小组（见第四节）。\n2. 采集**基线数据**：PR 周期、构建/评审耗时、缺陷率、部署频率、开发者满意度调研（没有基线就无法证明价值）。\n3. 安全与法务评审：\n   - 供应商数据处理协议（是否训练、数据留存、数据驻留、SOC2/ISO 认证）\n   - 代码分级：哪些仓库可用，哪些禁用（如核心算法、密钥、客户敏感数据）\n   - 企业版功能：SSO、隐私模式强制开启、审计日志、用量管理\n4. 制定《AI 编程工具使用规范》v0.1（见第六节）。\n5. 确定试点预算与采购方式。\n\n**退出标准**：安全评审通过、基线数据到位、试点名单确定。\n\n### 阶段 1：试点（第 3–8 周）\n\n**试点范围**\n- 规模：`[30–50]` 人，约占研发 10%。\n- 选人原则：覆盖不同技术栈、不同资历；**既要积极拥护者，也要 2–3 成怀疑者**，以获得更真实的反馈。\n- 选项目：选 1–2 个有代表性的存量项目和 1 个新项目。\n\n**关键动作**\n1. 启动培训（2 小时）：工具使用、提示技巧、安全红线、审查方法。\n2. 为试点仓库配置：\n   - Cursor：`.cursor/rules`\n   - Claude Code：`CLAUDE.md`，包含项目结构、构建/测试命令、编码规范、禁区\n3. 设定典型任务清单并对照记录（见下表）。\n4. 每周站会/群答疑，每两周复盘，沉淀案例。\n5. 可选 A/B：同类任务在使用与不使用 AI 的小组间对比。\n\n**试点任务示例**\n\n| 任务类型 | 示例 |\n|---|---|\n| 理解代码 | 新人熟悉模块、梳理调用链 |\n| 写测试 | 为存量代码补单测 |\n| Bug 修复 | 根据日志定位并修复 |\n| 小需求开发 | CRUD、接口联调、页面开发 |\n| 重构/迁移 | 依赖升级、API 迁移、语言版本升级 |\n| 文档/脚本 | README、迁移脚本、运维脚本 |\n\n**退出标准**（示例）\n- 试点用户周活 ≥ 70%，NPS ≥ `[30]`。\n- 至少 3 类场景有明确提效数据。\n- 无重大安全事件，质量指标未恶化。\n- 产出规范 v1.0、规则模板、至少 10 个最佳实践案例。\n\n### 阶段 2：扩展（第 3–5 月）\n\n1. **分批放量**：按团队分 2–3 批，每批 100–200 人。\n2. **Champion 网络**：每个小团队 1 名 Champion（约 1:10–1:15），负责答疑、分享、收集反馈。\n3. **培训体系**：\n   - 入门课（必修）：工具 + 安全 + 审查\n   - 进阶课：Agent 工作流、上下文管理、MCP 接入、规则编写\n   - 场景课：前端、后端、测试、数据、SRE 各自的实战\n4. **知识库建设**：内部 Wiki，包含规则模板、Prompt 库、踩坑记录、优秀案例。\n5. **自助支持**：FAQ、答疑群、Office Hour（每周固定时段）。\n6. 采购与账号：SSO 接入、席位自动分配与回收机制。\n\n### 阶段 3：全面融入流程（第 6–9 月）\n\n1. **代码评审**：PR 模板增加\"AI 参与说明\"（可选）；引入 AI 辅助评审作为人工评审的前置检查，而非替代。\n2. **CI/CD 集成**：自动生成测试建议、变更摘要、安全扫描增强；Claude Code 等可用于无人值守的小任务（如依赖升级 PR），但必须经人工合并。\n3. **工程基础设施适配**：\n   - 完善测试覆盖与 CI 速度（AI 的反馈环依赖它）\n   - 完善文档与代码规范（AI 的上下文质量依赖它）\n   - 统一仓库内的 Agent 规则文件\n4. **MCP / 内部工具接入**：对接内部文档、工单、监控、代码搜索，权限按最小化原则。\n5. **新人 onboarding**：AI 辅助熟悉代码库纳入新人培养流程。\n\n### 阶段 4：深化与持续运营（第 10–12 月及以后）\n\n- 从\"个人提效\"升级到\"团队级流程重构\"：如需求拆解 → AI 起草方案 → 人审 → AI 实现 → 自动测试 → 人审。\n- 建立内部最佳实践大赛 / Demo Day。\n- 季度评估工具选型，持续比较新工具和新模型。\n- 优化成本：按场景分配模型与额度，监控异常消耗。\n\n---\n\n## 四、组织与角色\n\n| 角色 | 职责 |\n|---|---|\n| 发起人（CTO/研发 VP） | 提供资源和授权，对外沟通 |\n| 推进小组（PMO + 架构 + 效能） | 路线图、节奏、数据、预算 |\n| 安全与法务 | 供应商评审、规范、审计、事件响应 |\n| IT / 平台 | 账号、SSO、网络、网关、采购 |\n| 效能/度量团队 | 基线、数据采集、看板、分析 |\n| Champion | 一线推广、答疑、反馈 |\n| 团队 Leader | 在团队内落实规范，营造试错氛围 |\n| 全体研发 | 合规使用，对产出负责，贡献案例 |\n\n---\n\n## 五、工具与账号治理要点\n\n- **只用企业账号**：禁止个人账号处理公司代码；SSO 统一登录。\n- **隐私模式强制开启**：确认不用于训练、零数据留存（按供应商企业条款核实）。\n- **模型接入方式**：评估是否经公司网关或云厂商（如 Bedrock / Vertex）接入，以便统一审计、限流和计费。\n- **权限最小化**：Agent 的命令执行、文件读写、网络访问采用白名单；生产环境凭证绝不暴露给 Agent。\n- **仓库分级**：\n\n| 级别 | 示例 | 策略 |\n|---|---|---|\n| 一般 | 普通业务代码、前端、工具 | 允许使用 |\n| 敏感 | 支付、风控、用户数据处理 | 限定工具与模式，加强评审 |\n| 禁止 | 密钥库、核心算法、受监管数据 | 禁用或仅限本地/私有化模型 |\n\n---\n\n## 六、使用规范（核心条款）\n\n1. **责任归属**：AI 生成的代码，提交者负全责；必须逐行理解后再提交。\n2. **数据红线**：不向 AI 输入密钥、Token、客户个人信息、生产数据；`.env` 等文件加入忽略清单。\n3. **审查要求**：AI 参与的变更同样走 Code Review，高风险模块（权限、支付、并发、数据迁移）强化审查。\n4. **测试要求**：AI 生成的变更必须有测试覆盖并通过 CI。\n5. **依赖与许可证**：AI 引入的新依赖须经过依赖/许可证扫描；对大段疑似开源代码做相似性检查。\n6. **Agent 自动执行边界**：禁止自动执行破坏性命令（如 `rm -rf`、强推、数据库写操作、生产部署）；采用确认机制或沙箱。\n7. **透明度**：鼓励在 PR 中说明 AI 参与程度，用于经验沉淀，而不是追责。\n8. **事件上报**：发现数据误传或异常行为，须立即上报，**不追究善意上报者**。\n\n---\n\n## 七、风险与应对\n\n| 类别 | 风险 | 可能性/影响 | 应对措施 |\n|---|---|---|---|\n| 安全 | 代码或敏感数据外泄至第三方 | 中/高 | 企业版 + 隐私模式；仓库分级；DLP；网关审计；培训 |\n| 安全 | Prompt 注入、恶意 MCP/插件、供应链攻击 | 中/高 | MCP 白名单与审核；限制 Agent 网络与命令权限；沙箱 |\n| 安全 | Agent 误操作（删库、泄露凭证、误推送） | 低/高 | 最小权限；禁用生产凭证；命令确认；分支保护 |\n| 质量 | 看似正确的错误代码、隐蔽 Bug、过度设计 | 高/中 | 强制评审与测试；规则文件约束风格；小步提交 |\n| 质量 | 代码重复增加、架构劣化、技术债累积 | 中/中 | 架构守护规则；定期重构；监控代码重复度和变更回滚率 |\n| 能力 | 初级工程师过度依赖，基本功退化 | 中/中 | 要求\"能解释每一行\"；新人阶段设置有指导的使用方式；技术分享 |\n| 能力 | 评审压力增大（AI 产出多，评审成为瓶颈） | 高/中 | 控制 PR 粒度；AI 辅助预审；调整评审资源 |\n| 效率 | 实际提效不及预期，甚至变慢（熟悉代码库的资深者尤其可能） | 中/中 | 不预设结论，用数据验证；按场景推广；提供上下文配置支持 |\n| 合规 | 许可证污染、知识产权归属争议 | 低/高 | 供应商知识产权条款；开源扫描；法务备案 |\n| 合规 | 受监管行业或客户合同限制 | 视情况 | 事先梳理合同条款；敏感项目走私有化/例外审批 |\n| 组织 | 员工焦虑、抵触、\"被监控\"感 | 中/中 | 公开沟通\"不替代、不考核用量\"；鼓励试错；展示正面案例 |\n| 组织 | 使用不均，形成\"AI 富人/穷人\" | 中/低 | Champion 机制；分享会；统一资源 |\n| 成本 | Token/席位成本失控，Agent 长任务消耗大 | 中/中 | 额度与预算告警；按角色分级；成本看板；鼓励小任务拆分 |\n| 依赖 | 供应商涨价、停服、模型变化 | 低/中 | 保持工具可替换；规则文件尽量与工具解耦；多供应商评估 |\n\n---\n\n## 八、衡量指标\n\n### 8.1 原则\n- **先建基线，再比较**。\n- **组合指标**：既看速度，也看质量和体验，避免单一指标被刷。\n- **团队级而非个人级**：不用于个人考核，防止数据被扭曲。\n- **定性 + 定量**结合。\n- 避免把\"生成代码行数\"\"采纳率\"当作价值指标，它们只是过程参考。\n\n### 8.2 指标体系\n\n**A. 采纳与使用（过程指标）**\n\n| 指标 | 定义 | 目标参考 |\n|---|---|---|\n| 席位激活率 | 已激活 / 已分配 | ≥ 90% |\n| 周活跃率（WAU） | 每周至少使用的人数占比 | ≥ 70–80% |\n| 深度使用率 | 使用 Agent/多文件修改的用户占比 | 逐季上升 |\n| 补全/建议采纳率 | 被接受的建议比例 | 仅作参考 |\n| 培训完成率 | 完成必修课人数占比 | 100% |\n\n**B. 效率与交付（结果指标）**\n\n| 指标 | 定义 |\n|---|---|\n| PR 周期时间 | 从创建到合并的时长（拆分：编码、等待评审、评审、合并） |\n| 需求交付周期（Lead Time） | 需求开始到上线 |\n| 部署频率 | DORA 指标 |\n| 每开发者合并 PR 数/需求吞吐 | 配合质量指标一起看 |\n| 典型任务耗时对比 | 如\"补 100 个单测\"\"一次依赖升级\"的前后对比 |\n| 新人上手时间 | 入职到首个独立 PR |\n\n**C. 质量与稳定性（护栏指标，不得恶化）**\n\n| 指标 | 定义 |\n|---|---|\n| 变更失败率 | DORA：导致故障/回滚的变更比例 |\n| 故障恢复时间（MTTR） | DORA |\n| 缺陷逃逸率 | 上线后发现缺陷数 / 总缺陷 |\n| 代码返工率 / 回滚率 | 合并后短期内被修改或回滚的比例 |\n| 测试覆盖率与 CI 通过率 | 测试质量 |\n| 代码重复度、静态扫描问题数 | 代码健康度 |\n\n**D. 安全与合规**\n\n| 指标 | 目标 |\n|---|---|\n| 安全事件数 | 0 起重大事件 |\n| 非授权工具使用检出数 | 持续下降 |\n| 密钥/敏感信息泄漏检出 | 0 或快速处置 |\n| 依赖/许可证违规数 | 不上升 |\n\n**E. 开发者体验**\n\n| 指标 | 方式 |\n|---|---|\n| 满意度 / NPS | 季度问卷 |\n| 自评节省时间 | 问卷 + 访谈 |\n| 认知负担、心流体验 | SPACE 框架问题 |\n| 障碍与抱怨清单 | 持续收集 |\n\n**F. 成本与 ROI**\n\n| 指标 | 定义 |\n|---|---|\n| 人均月度成本 | 席位 + 用量 |\n| 成本结构 | 按团队、工具、模型拆分 |\n| ROI 估算 | （节省工时 × 工时成本 − 总投入）/ 总投入，保守估算并说明假设 |\n| 单位交付成本 | 每需求/每 PR 成本变化 |\n\n### 8.3 数据来源与节奏\n- **工具后台**：使用量、席位、活跃度\n- **Git / CI / 工单系统**：PR、构建、交付、缺陷\n- **安全平台**：DLP、扫描、审计日志\n- **问卷与访谈**：体验与定性\n- **节奏**：周看活跃 → 月看效率与成本 → 季度做综合评估并向管理层汇报\n\n### 8.4 阶段验收参考\n\n| 阶段 | 关键验收条件 |\n|---|---|\n| 试点 | 活跃率 ≥ 70%；至少 3 个场景有提效证据；质量与安全无恶化 |\n| 扩展 | 覆盖 ≥ 50%；PR 周期下降 `[10%]`；NPS ≥ `[30]` |\n| 全面 | 活跃率 ≥ 80%；交付周期下降 `[15–30%]`；质量指标持平或改善 |\n| 深化 | 形成 2–3 个团队级 AI 工作流标杆；ROI 为正且可复算 |\n\n---\n\n## 九、成功关键因素\n\n1. **管理层公开站台**，且明确\"不用于裁员/个人考核\"。\n2. **安全先行**，让工程师\"有路可走\"而不是\"禁而不止\"。\n3. **Champion 与社区**比大规模培训更有效。\n4. **工程基础设施**（测试、CI、文档、规范）是放大器，AI 的收益很大程度取决于此。\n5. **持续度量与迭代**，允许根据数据调整工具和策略。\n6. **管理预期**：不同角色和场景收益差异大，避免\"一刀切\"的效率承诺。\n\n---\n\n## 十、时间线概览\n\n```\n第0-2周    准备：评审、基线、规范v0.1\n第3-8周    试点：30-50人，两个项目，周/双周复盘\n第9-12周   总结试点，决策工具组合，发布规范v1.0\n第3-5月    扩展：分批放量，Champion、培训、知识库\n第6-9月    全面：融入评审、CI、新人培养，MCP接入\n第10-12月  深化：团队级流程重构，ROI复盘，来年规划\n```\n\n---\n\n## 十一、待确认事项（启动前需拍板）\n\n1. 预算上限与采购模式（席位制 / 用量制 / 云厂商网关）。\n2. 工具主推方案与是否多工具并行。\n3. 仓库分级清单及受限项目名单。\n4. 是否有行业监管或客户合同对 AI 工具的限制。\n5. 度量数据的使用边界（确认不用于个人考核）。\n6. 推进小组人员与每人投入比例。\n\n---\n\n如需要，我可以继续输出以下配套材料：\n- 《AI 编程工具使用规范》正式版草稿\n- 试点期问卷与基线调研模板\n- `CLAUDE.md` / `.cursor/rules` 的团队模板\n- 面向管理层的汇报 PPT 大纲\n- ROI 测算表结构"}]}, {"sid": "daily-012", "title": "和房东还价", "scenario": "daily", "prompt": "帮我回复一下房东，他说下个月起房租要涨 500，我想委婉地还价。", "cands": [{"code": "2dc923", "text": "可以这样回，语气客气但把诉求说清楚：\n\n**版本1（温和还价，适合微信）**\n> 房东您好，收到您说的房租调整了，也理解您的考虑。不过我这边确实有点压力，下个月一下涨500对我来说负担比较大。我住得挺习惯，也一直按时交租、比较爱惜房子，还是希望能长期稳定租下去。您看能不能稍微少涨一点，比如涨200～300，或者先维持原租金、过半年再调整？我这边也愿意续签一年，您看方便商量吗？谢谢您理解。\n\n**版本2（更委婉，先认可再提方案）**\n> 房东您好，谢谢您提前跟我说。房子我住得挺满意，也有打算继续长住，所以想跟您商量一下：下个月涨500我这边确实有点吃力。您看能不能折中一下，少涨一点？如果续签一年、按时交租这些都没问题，我也愿意配合。麻烦您考虑一下，非常感谢。\n\n**版本3（简短版）**\n> 房东您好，收到涨租消息了，理解您的想法。不过涨500对我压力有点大，我挺想继续稳定住下去，也会按时交租、爱护房子。您看能否少涨一些，比如涨200～300，或者先缓几个月再调？方便的话咱们商量一下，谢谢您。\n\n建议你发的时候把“房东您好”改成平时称呼，比如“王哥/王姐”；如果周边同户型租金没涨，也可以补一句：“我也了解了一下附近类似房源，价格大概在××左右。”但别说得太硬，重点表达：**理解 + 想长租 + 愿意续签 + 希望少涨/缓涨**。
