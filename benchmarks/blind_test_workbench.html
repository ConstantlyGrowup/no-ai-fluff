快速扫过**：56 个 wxss 全是机械替换 `font-family`，不涉及布局和逻辑。\n3. **重点看第 3、4、6 个提交**：涉及房量/库存、接口权限、取消订单与积分返还。\n\n| # | 提交 | 做了什么 | 建议重点看 |\n|---|---|---|---|\n| 1 | 54164f0 | 全站副标题与正文改用楷体（霞鹜文楷子集，OFL 免费商用） | 字体授权、`/uploads/fonts` 跨域 |\n| 2 | bb1df55 | 在地体验新增“二十四节气”卡片和“推荐行程”，新增节气页、行程详情页（内容来自甲方 PPT 和节气表） | CMS 导入脚本 |\n| 3 | 1814295 | 每单最多 2 间；房量改为按“每晚”实时计算，下单不再永久扣库存 | 事务内 `FOR UPDATE` 防超订、超时订单付款前复核 |\n| 4 | 50b8384 | 数据库连接泄漏、订单列表隐私漏洞、删除危险废弃接口、接口时间字段变成 `{}` | 订单接口只认 token |\n| 5 | 5e7e708 | 活动/旅游套餐确认订单页白屏；酒店“立即预订”卡在“请选择会员折扣方案” | — |\n| 6 | 2fa0e9f | “取消订单”按钮无效、酒店订单详情总价 ¥0 等信息缺失、支付页问题 | 取消规则（只取消本人待支付订单） |\n| 7 | 2e3ad2b | 风物订单显示 `{}`、在线客服未登录跳转失效、出行偏好显示英文编码 | — |\n| 8 | add6bc6 | 暂时隐藏未完成的“邀请好友体验云舍村”入口 | — |\n\n## 甲方需求对照\n\n| 甲方需求 | 处理结果 |\n|---|---|\n| 1. 大标题用木刻体，副标题和正文用楷体 | 楷体已完成（霞鹜文楷，SIL OFL-1.1，可免费商用，许可原文随字体放在 `backend/public/fonts/`）。木刻体没找到能确认免费商用的版本，**本次不做**，待甲方提供字体文件和授权 |\n| 2. 在地体验点进去没有任何显示 | #2 已把活动上架；本 PR 再加入节气活动和 6 条推荐行程（数据放 CMS，运营可在后台“内容页”修改） |\n| 3. 村舍预定房间数只能加到 2 | 按“每单最多 2 间，更多请联系管家”实现；上限是常量 `MAX_ROOMS_PER_ORDER`（前端 `bookInfo.js`、后端 `utils/roomAvailability.js` 各一处），甲方本意不同时只改这两处 |\n\n## 最严重的问题（建议优先确认）\n\n1. **活动预订页白屏，所有活动都无法下单**（提交 5）：确认订单页脚本里一段兜底语句插在 `const` 声明链中间，后面的变量变成未声明，进入页面直接 `ReferenceError`。master 和 `dev/prod-aliyun` 都有这个问题。旅游套餐确认订单页是同一原因。\n2. **数据库连接泄漏**（提交 4）：风物页每次加载都会新建一个数据库连接且从不释放。实测 15 次请求 MySQL 连接数 20 → 35；上限 151，累计满后整个后端连不上数据库，只能重启（很可能就是之前“点了没反应”的原因）。修复后 15 次请求只 +1。\n3. **订单隐私 / 越权**（提交 4）：订单列表接口只凭 URL 里的 memberid 就返回他人全部订单（memberId 会出现在邀请分享链接里）；另有一个前端从未调用的废弃接口，任何登录用户凭订单号就能取消别人的订单（包括已支付）。\n4. **无法取消订单**（提交 6）：取消弹窗依赖的 3 个接口后端都没实现，按钮点了没反应；酒店订单此前完全没有取消入口。\n\n## 取消订单的规则（提交 6，涉及钱，请确认）\n\n- 只能取消**本人的、待支付**订单（按登录 token 识别本人，条件更新防并发）。\n- 取消后回补下单时扣减的库存（旅游出发日 / 活动日期 / 风物商品；酒店房量按订单实时计算，自动释放），并**原数返还**发起支付时已扣的抵扣积分。\n- **已支付订单不在小程序端取消、也不自动退款**，直接弹“一键咨询”引导联系管家。\n- 5 分钟内发起过、还没收到支付回调的订单暂不允许取消，避免与“支付成功”回调交错（订单被改回已支付，但库存和积分已退回）。\n\n## 验证方式\n\n本地 Docker（后端 + MySQL 快照）+ 微信开发者工具逐页点击实测：\n\n- **酒店**：选房 → 第 3 次点“+”提示每单最多 2 间 → 填写入住人/联系人 → 立即预订（不用再手动选会员折扣）→ 支付页倒计时 → 订单详情（总价、房间数、下单时间、预计到店都正确）→ 取消（选原因 / 填“其他原因”两条路径）→ 结果页“联系客服”“订单详情”按钮。\n- **活动**：秋收 → 预订 → 选出行人 → 立即预订 → 支付页。\n- **我的**：每个入口逐个点开；未登录时点在线客服会跳到登录页；邀请好友入口已消失，其余菜单正常。\n- **在地体验**：节气卡片、节气页（自动定位当前节气、民俗说明展开收起）、推荐行程卡片和详情、首页 banner、搜索。\n- **后端接口**：连接泄漏修复前后对比；订单列表带 / 不带 token；取消接口的未登录、本人取消、重复取消、支付进行中四种情况。\n- **未验证**：\n  - 真实微信支付：本地没有支付证书，请求止于读取私钥，不会发到微信。\n  - 真机。\n  - 旅游套餐和风物商品的购买流程：本地库里这两类商品全部是下架状态，界面上走不到。旅游确认订单页用测试数据确认过不再报错。\n\n## 部署步骤\n\n1. **备份 MySQL**。\n2. 部署新后端（本 PR **没有**数据库表结构变更）。\n3. 在后端容器内依次执行下面 3 个脚本。都可以重复执行，建议先加 `--dry-run` 演练：\n   ```bash\n   docker exec -i -w /app <后端容器名> node - < deploy/导入在地体验活动.js   # #2 的活动导入\n   docker exec -i -w /app <后端容器名> node - < deploy/导入在地体验内容.js   # 节气 + 推荐行程（CMS）\n   docker exec -i -w /app <后端容器名> node - < deploy/修正房型库存.js       # 执行前请与运营核对每个房型的实际间数\n   ```\n   `修正房型库存.js` 是必须的：旧逻辑每下一单就永久扣减 `RoomType.stock`，正式库里的值已经被扣乱，需要恢复成实际间数。\n4. 微信公众平台「开发管理 → 服务器域名」确认 **downloadFile 合法域名**包含 `https://yunshecun.com`。楷体通过 `wx.loadFontFace` 从后端加载，如果上线后字体没生效先查这一项；即使没生效也会回退到系统字体，不影响使用。\n5. 用开发者工具上传新版本小程序并提交审核。\n\n## 本 PR 没有改、留给后续的\n\n- **待甲方确认**：\n  - “会员政策”入口打开的是“预约须知”，因为后台 CMS 里 `member_policy` 填的就是预约须知内容。\n  - “我的咨询单”打开的是填写“定制行程”的表单，看不到自己提交过的咨询记录。\n  - 这两项是改菜单名字还是改内容，等甲方定。\n- 酒店订单详情接口只凭订单号就能查到联系人姓名、电话。订单号是随机串，很难猜，风险较低；如要收紧，需要前端几处调用一起改为带 token。\n- 旅游套餐下单接口在没带 token 时，可以凭请求里的 memberId 下单。这是历史上为兼容 token 偶尔丢失加的兜底，建议前端统一带 token 后去掉。\n- 优惠券详情页是空页面。目前预订流程里的可用优惠券列表恒为空，用户进不去；开启优惠券功能前需要补上。\n- 邀请好友：入口已隐藏，后端功能（邀请记录、小程序码、奖励）待开发。实现后让邀请规则接口返回真实规则，入口会自动出现。\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"}, {"code": "15f73c", "text": "## 一句话说明\n\n完成了甲方《小程序更改事项》中的 3 项需求，并在微信开发者工具里逐页、逐按钮实测，修掉发现的问题。其中“活动无法预订”和“数据库连接泄漏”在线上版本中也存在。\n\n> **本 PR 基于 #2、#3、#4、#5 开发**（这 4 个 PR 还未合并，因此 Files changed 里会连带出现它们的改动）。\n> - **只看本 PR 自身的改动：** [点这里对比 594f855...add6bc6](https://github.com/linmoIO/yunshecun-mini-app/compare/594f85583a1e73b54fd0bca9328315315491d372...add6bc64e8b21c857058b587d0244286a5f9cafc)，也可以在 Commits 标签页查看下面 8 个提交。\n> - #2–#5 合并进 master 后，这里的 Files changed 会自动只剩这 8 口未在服务器上实现；点击按钮后没有任何反应；此前甚至根本没有取消酒店订单的入口。\n\n## 订单取消规则（提交6，涉及金额问题，请确认）\n\n- 只能取消**状态为“等待付款”的自己的订单**（身份通过登录时的token确定；更新时会带上条件，防止并发冲突）。\n- 取消后，下单时预留的商品数量会恢复（旅游出发日期/活动日期/本地生产的商品；酒店房间数量会实时计算并自动释放），同时**付款时扣除的积分也会全额返还**。\n- **已付款订单无法在小程序中取消，也不会自动退款**；而是直接弹出“一键咨询”按钮，可联系管家。\n- 下单时间不足5分钟且尚未收到支付回调的订单，暂时无法取消，以避免与“支付成功”通知冲突（订单会恢复为“已支付”状态，但库存和积分已返还）。\n\n## 验证方式\n\n本地环境 Docker（后端 + MySQL快照）+ 微信开发者工具：通过依次点击页面进行测试。\n\n- **酒店**：选择房间 → 第三次点击“+”时会出现提示，说明一个订单中最多只能选择2个房间 → 填写客人/联系人信息 → 立即预订（无需手动为会员选择折扣）→ 支付页面的计时器 → 订单详情（总价、房间数量、下单时间、预计到店时间——全部正确）→ 取消（选择原因/输入“其他原因”——两种选项）→ 结果页面上有“联系客服”和“订单详情”按钮。\n- **促销活动**：秋季丰收 → 预订 → 选择出行人员 → 立即预订 → 支付页面。\n- **我的资料**：各板块依次打开；未登录时点击在线客服会跳转至登录页面；“邀请好友”入口消失，其余菜单运行正常。\n- **当地体验**：节气卡片、节气页（自动定位当前节气，展开/折叠传统习俗描述）、推荐路线卡片及其详情、首页横幅、搜索功能。\n- **后端接口**：比较修复连接泄漏前后的状态；包含/不包含token的订单列表；四种取消接口的情况：未登录用户、本人取消、重复取消、支付过程中取消。\n- **未验证**：\n  - 通过微信支付的真实支付：本地层面缺少支付证书；读取私钥时请求会停止，且不会发送至微信。\n  - 真机。\n  - 旅游套餐及当地特产商品的购买流程：这两类商品在本地数据库中均被标记为已下架，因此在界面上无法访问。使用测试数据验证了旅游订单确认页面——已无错误。\n\n## 部署步骤\n\n1. **备份 MySQL**。\n2. 部署新后端（在PR中**没有**更改数据库表结构）。\n3. 在后端容器中依次执行以下3个脚本。它们均可重复运行；建议先通过`--dry-run`进行练习：\n   ```bash\n   docker exec -i -w /app <后端容器名> node - < deploy/导入在地体验活动.js   # #2 的活动导入\n   docker exec -i -w /app <后端容器名> node - < deploy/导入在地体验内容.js   # 节气 + 推荐行程（CMS）\n   docker exec -i -w /app <后端容器名> node - < deploy/修正房型库存.js       # 执行前请与运营核对每个房型的实际间数\n   ```\n   `修正房型库存.js`必不可少：旧逻辑会在每次订单中永久扣减`RoomType.stock`的值；正式库里的数值已经被扣乱，必须将其恢复为实际数值。\n4. 在微信公众平台中，进入“开发管理 → 服务器域名”页面，确保**downloadFile 合法域名**包含`https://yunshecun.com`。楷体通过`wx.loadFontFace`从服务器加载；如果启动后字体无法显示，请检查此项。即使它不起作用，系统也会自动切换回默认字体，不会影响正常使用。\n5. 使用开发者工具上传小程序的新版本并提交审核。\n\n## 此PR未作修改，留待后续处理。\n\n- **待甲方确认**：\n  - 打开“会员政策”板块时，会显示“预约须知”页面，因为在CMS的设置中，`member_policy`字段填的是预约须知内容。\n  - 打开“我的咨询单”入口时，会显示填写“定制行程”的表单；自己提交过的咨询记录不可见。\n  - 是改菜单名称还是改内容，由客户决定。\n- 酒店订单详情接口只能通过订单号来查找联系人姓名和电话。订单号是一串随机字符串，难以猜测，因此风险较低；如果需要加强验证，只需修改前端的一些调用，使其包含token即可。\n- 旅游套餐下单接口允许在缺少token时，根据请求中的memberId来创建订单。这是为兼容token而添加的临时措施，因为以前有时会丢失 token；建议前端始终使用token，之后便可移除该措施。\n- 优惠券详情页面目前为空。当前在预订过程中，可用优惠券列表始终为空，用户也无法访问该页面；在启用优惠券功能前必须修复此问题。\n- 好友邀请功能：入口被隐藏，后端功能（邀请记录、小程序码、奖励等）尚未开发完成。功能实现后，邀请规则接口将返回真实规则，入口也会自动显示出来。\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)"}]}, {"sid": "discussion-001", "title": "创业团队单体 vs 微服务", "scenario": "discussion", "prompt": "单体 vs 微服务，对于一个 20 人左右的创业团队，你怎么看这个 trade-off？", "cands": [{"code": "1ad7a0", "text": "对于 20 人左右的创业团队（假设研发 10—15 人），在单体（Monolith）和微服务（Microservices）之间做选择，最务实、也被广泛验证的建议是：从模块化单体（Modular Monolith）起步。\n\n在这个阶段，生存、找到产品市场契合度（PMF）和快速迭代是第一要务。过早引入微服务，往往会成为创业公司的“技术毒药”。\n\n针对这个规模的团队，具体的 trade-off 如下：\n\n### 1. 为什么现在更适合单体\n\n- **开发和测试效率很高：** 代码在一个仓库里，不需要跨服务调用，也没有复杂的接口契约；本地启动后就能调试完整流程。\n- **没有“分布式税”（Distributed Tax）：** 不需要处理网络延迟、分布式事务、数据最终一致性、复杂链路追踪等问题。\n- **运维成本低：** 20 人团队往往没有专职 DevOps 或 SRE。单体应用只需要几台服务器、一个数据库和简单的 CI/CD 就能跑起来，团队可以把 90% 以上的精力放在业务开发上。\n- **符合康威定律：** 20 人团队（10 多名研发）通常也就是 1 到 2 个敏捷小组，沟通成本很低，不需要用物理的服务边界来隔离团队。\n\n### 2. 为什么这个阶段上微服务风险很高\n\n- **基础设施负担重：** 微服务需要容器编排（K8s）、服务发现、配置中心、API 网关、分布式日志等基础设施。这些会消耗团队里最优秀的 1—2 名工程师的全部精力。\n- **重构成本很高：** 创业初期业务模式不清晰，领域边界（Bounded Context）一直在变。在单体里，重构几个模块只是移动代码、改名字；在微服务里，重构跨服务的业务边界会是一场灾难。\n- **排错困难：** 几十人的团队，线上出一个 Bug 要跨 3 个服务查日志，会严重拖慢问题响应速度。\n\n### 3. 建议采用模块化单体\n\n单体不等于“面条代码”（Spaghetti Code），也不等于“大泥球”（Big Ball of Mud）。你们应该采用模块化单体架构：\n\n- **物理上是一个整体：** 仍然是一个代码库，打包成一个进程部署。\n- **逻辑上高度解耦：** 按业务领域（Domain）划分模块，比如 `User`、`Order`、`Payment`。\n- **严格管理依赖：** 模块之间只通过清晰的接口或事件通信，不能直接读写对方的数据库表。\n\n这样做的好处是：既能享受单体的开发速度和低运维成本，又因为逻辑边界清晰，未来团队扩张到 50—100 人、必须拆分微服务时，可以把某个模块很平滑地独立出去。\n\n### 4. 什么时候可以破例，少量引入微服务\n\n即使主架构是单体，遇到以下场景，也可以把个别服务拆出去：\n\n- **技术栈异构：** 比如主业务用 Java/Go 开发，但需要引入一个只能用 Python 跑的 AI 相关服务，那么这个 AI 模块可以作为独立服务。\n- **资源消耗极度不均：** 比如报表生成或视频转码模块非常吃 CPU，容易把整个系统拖垮，这类 Worker 服务就应该单独拆分部署。\n\n### 总结\n\n对于 20 人的创业团队：**Build a solid Monolith, don't build a Microservices platform.**\n\n把有限的资源集中在“证明业务能赚钱”上，而不是“证明我们的架构能支撑百万并发”上。当单体架构真的撑不住，开发人员多到经常出现代码合并冲突时，说明你们已经赚到了足够的钱和时间。到那时再拆微服务，才是幸福的烦恼。"}, {"code": "95bcb2", "text": "对于一个由约20人组成的创业团队来说（假设其中有10–15名开发人员），在单体架构（Monolith）与微服务架构（Microservices）之间做选择时，**最实用且经过广泛验证的建议是：从“模块化单体架构（Modular Monolith）”起步。**\n\n这个阶段，首要目标是活下去、找到产品与市场的契合点（PMF），并快速迭代。过早引入微服务，往往会成为初创公司的“技术毒药”。\n\n下面针对这个规模的团队，具体说说怎么权衡：\n\n### 1. 为什么现在“单体架构”更适合你们？\n\n*   **开发和测试效率很高：**代码都在同一个代码库里，不用做服务之间的调用，也没有复杂的接口约定；在本地就能把整个流程跑起来调试。\n*   **没有“分布式开销（Distributed Tax）”：**无需处理网络延迟、分布式事务、数据最终一致性、复杂的调用链追踪等问题。\n*   **运营成本低：**20人的团队通常没有专职的DevOps或SRE专家。单体应用只要几台服务器、一个数据库和一套简单的CI/CD就能跑起来，团队能把90%以上的精力放在业务开发上。\n*   **符合康威定律：**由20人组成的团队（超过10名开发人员）通常可划分为1–2个敏捷小组。沟通成本很低，也不需要靠服务边界把团队隔开。\n\n### 2. 为什么在这个阶段采用“微服务”风险极高？\n\n*   **基础设施负担很重：**微服务需要容器编排（K8s）、服务发现机制、配置中心、API网关、分布式日志系统以及其他基础设施。这将耗尽团队中1–2名顶尖工程师的全部精力。\n*   **重构成本极高：**在创业初期，商业模式尚不明朗，领域边界（Bounded Context）也不断变化。在单体里，重构几个模块不过是挪代码、改名字；在微服务里，重构跨服务的业务边界就是一场灾难。\n*   **调试难题：**线上出了一个问题，可能要跨三个服务去查日志，会严重拖慢问题响应速度。\n\n### 3. 最佳实践：模块化单体架构（Modular Monolith）\n\n单体架构并不等同于“意大利面式代码（Spaghetti Code）”或“大泥球（Big Ball of Mud）”。你们应该用**模块化单体架构**：\n\n*   **物理上——它是一个整体：**仍然是一个代码库，打包成一个进程来部署。\n*   **逻辑上——高度模块化：**模块按照业务领域划分（Domain）（例如，模块`User`、模块`Order`、模块`Payment`）。\n*   **严格的依赖管理：**模块之间只能通过定义清楚的接口或事件通信，不能直接读写对方的数据库表。\n\n**这样做的好处是：**既能保留单体的开发速度和低运维成本；又因为逻辑边界清楚，将来团队扩到 50–100 人、需要拆微服务时，可以把某个模块比较顺利地独立出去。\n\n### 4. 何时可以打破规则（有限度地引入微服务）？\n\n即使主架构还是单体，遇到下面这些特殊情况，也可以拆出个别独立服务：\n\n*   **技术栈不同：**比如核心业务用 Java/Go 开发，但需要接入一个 AI 相关服务，而它只能用 Python 跑；这时可以把这个 AI 模块拆成独立服务。\n*   **资源消耗相差很大：**比如报表生成或视频转码模块很吃 CPU，可能把整个系统拖垮；这类 Worker 服务就应该拆出去单独部署。\n\n### 总结\n\n对于20人的初创团队：**Build是可靠的Monolith，切勿搭建Microservices平台。** \n\n把有限的资源集中在证明业务能够盈利上，而不是证明我们的架构能够承受百万级的同时请求。等单体真的撑不住负载，开发人员多到经常出现代码合并冲突，说明你们已经赚到了足够的钱和时间。到那时，拆分微服务才会变成一件值得高兴的麻烦。"}, {"code": "4c6b2b", "text": "对于一个 20 人左右的创业团队（假设其中研发人员在 10-15 人左右），在单体（Monolith）和微服务（Microservices）之间做选择，**最务实且被广泛验证的建议是：从“模块化单体（Modular Monolith）”起步。**\n\n在这个阶段，生存、寻找产品市场契合度（PMF）和快速迭代是第一要务。过早引入微服务往往是创业公司的“技术毒药”。\n\n以下是针对这个规模团队的具体 Trade-off 分析：\n\n### 1. 为什么“单体”更适合现在的你们？\n\n*   **极高的开发与测试效率：** 代码在一个仓库，不需要跨服务调用，没有复杂的接口契约，本地跑起来就能调试全流程。\n*   **没有“分布式税（Distributed Tax）”：** 不需要处理网络延迟、分布式事务、数据最终一致性、复杂的链路追踪等难题。\n*   **运维成本低：** 20 人的团队往往没有专职的 DevOps 或 SRE 专家。单体应用只需要几台服务器、一个数据库、简单的 CI/CD 就能跑起来，团队可以将 90% 以上的精力放在业务开发上。\n*   **符合康威定律：** 20 人的团队（10 多个研发）通常也就是 1 到 2 个敏捷小组。沟通成本很低，不需要用物理的服务边界来隔离团队。\n\n### 2. 为什么“微服务”在这个阶段风险极高？\n\n*   **沉重的基建负担：** 微服务需要容器编排（K8s）、服务发现、配置中心、API 网关、分布式日志等基础设施。这会消耗你团队里最优秀的 1-2 个工程师的全部精力。\n*   **重构成本极高：** 创业初期业务模式不清晰，领域边界（Bounded Context）一直在变。在单体里，重构几个模块只是移动代码和改名；但在微服务里，重构跨服务的业务边界简直是一场灾难。\n*   **排错困难：** 对于一个几十人的团队，线上出一个 Bug 需要跨 3 个服务去查日志，会严重拖慢问题响应速度。\n\n### 3. 最佳实践：模块化单体（Modular Monolith）\n\n单体不等于“面条代码（Spaghetti Code）”或“大泥球（Big Ball of Mud）”。你们应该采用**模块化单体**架构：\n\n*   **物理上是一个整体：** 依然是一个代码库，打包成一个进程部署。\n*   **逻辑上高度解耦：** 按照业务领域（Domain）划分模块（比如 `User` 模块、`Order` 模块、`Payment` 模块）。\n*   **严格的依赖管理：** 模块之间只能通过清晰的接口/事件进行通信，不能直接读写对方的数据库表。\n\n**这样做的好处是：** 享受单体的开发速度和低运维成本，同时由于逻辑边界清晰，未来某天当团队扩张到 50-100 人，必须拆分微服务时，可以非常丝滑地将某个模块独立出去。\n\n### 4. 什么时候可以打破规则（少量引入微服务）？\n\n即使主架构是单体，如果有以下特殊场景，可以剥离出个别独立服务：\n\n*   **技术栈异构：** 比如主业务是 Java/Go 开发的，但需要引入一个 AI 相关的服务，只能用 Python 跑，那么这个 AI 模块可以作为独立服务。\n*   **资源消耗极度不均：** 比如有一个报表生成/视频转码模块，非常消耗 CPU 且容易把整个系统拖垮，应该将这类 Worker 服务单独拆分部署。\n\n### 总结\n\n对于 20 人的创业团队：**Build a solid Monolith, don't build a Microservices platform.** \n\n把有限的资源集中在“证明业务能赚钱”上，而不是“证明我们的架构能支撑百万并发”上。当你们的单体架构真的撑不住、开发人员多到经常产生代码合并冲突时，说明你们已经赚到了足够的钱和时间，那时候再去拆分微服务才是幸福的烦恼。"}]}]};

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s)
    .replace(/\*\*(\S(?:.*?\S)?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*]*?[^*\s])\*(?![*\w])/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, t, u) => /^(https?:|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);
  return s.replace(/\u0000(\d+)\u0000/g, (_, k) => "<code>" + esc(codes[+k]) + "</code>");
}
function md(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n"); const out = []; let i = 0;
  const isTable = (a, b) => /^\s*\|.*\|\s*$/.test(a) && /^\s*\|?\s*:?-{2,}/.test(b || "");
  while (i < lines.length) {
    let l = lines[i];
    if (/^\s*(```|~~~)/.test(l)) { const f = l.trim().slice(0, 3); const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(f)) buf.push(lines[i++]); i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue; }
    if (/^\s*$/.test(l)) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (isTable(l, lines[i + 1])) {
      const row = r => r.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => inline(c.trim()));
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push("<table><thead><tr>" + head.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table>"); continue; }
    if (/^\s*>/.test(l)) { const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + md(buf.join("\n")) + "</blockquote>"); continue; }
    if (/^\s*([-*+]|\d{1,3}[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d{1,3}[.)])\s+/.test(lines[i])) {
        let t = lines[i++].replace(/^\s*([-*+]|\d{1,3}[.)])\s+/, "").replace(/^\[([ xX])\]\s+/, (_, c) => c.trim() ? "☑ " : "☐ ");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d{1,3}[.)])\s+/.test(lines[i])) t += " " + lines[i++].trim();
        items.push("<li>" + inline(t) + "</li>"); }
      out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>")); continue; }
    const buf = [l]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|\s*```|\s*>|\s*([-*+]|\d{1,3}[.)])\s+|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
  }
  return out.join("\n");
}

// ---- 渲染 ----
const $ = id => document.getElementById(id);
const item = () => DATA.items[state.i];
const vote = () => (state.votes[item().sid] ||= { best: null, worst: null, tie: false, note: "", seconds: 0 });

function ratio(el) { const max = el.scrollHeight - el.clientHeight; return max > 0 ? el.scrollTop / max : 0; }
function setRatio(el, r) { el.scrollTop = r * (el.scrollHeight - el.clientHeight); }

function renderProgress() {
  $("progress").innerHTML = DATA.items.map((it, k) => {
    const v = state.votes[it.sid]; const done = v && v.best;
    return `<button class="dot ${done ? "done" : ""} ${k === state.i ? "cur" : ""}" data-k="${k}" aria-label="第 ${k + 1} 篇${done ? "，已投" : ""}">${k + 1}</button>`;
  }).join("");
}
function renderTabs() {
  const it = item(); const v = vote(); const seen = state.seen[it.sid] || [];
  $("tabs").querySelectorAll(".tab").forEach(t => t.remove());
  const frag = document.createDocumentFragment();
  it.cands.forEach((c, k) => {
    const b = document.createElement("button");
    b.className = "tab" + (v.best === c.code ? " best" : ""); b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(k === state.tab && !state.split || state.split && k === state.tab));
    b.innerHTML = `${LETTERS[k]}<span class="seen ${seen.includes(k) ? "on" : ""}" title="${seen.includes(k) ? "已读过" : "未读"}"></span>`;
    b.onclick = () => showTab(k); frag.appendChild(b);
  });
  $("tabs").insertBefore(frag, $("tabs").querySelector(".modes"));
}
function markSeen(k) { const s = (state.seen[item().sid] ||= []); if (!s.includes(k)) { s.push(k); save(); } }
function showTab(k, keepRatio = true) {
  const r = keepRatio ? ratio($("paneL")) : 0;
  state.tab = k; $("docL").innerHTML = md(item().cands[k].text); $("selL").value = k;
  requestAnimationFrame(() => setRatio($("paneL"), r));
  markSeen(k); renderTabs(); renderVote();
}
function showRight(k, keepRatio = true) { const r = keepRatio ? ratio($("paneR")) : 0; state.right = k; $("docR").innerHTML = md(item().cands[k].text); $("selR").value = k; requestAnimationFrame(() => setRatio($("paneR"), r)); markSeen(k); renderTabs(); }
function renderVote() {
  const it = item(); const v = vote(); const seen = state.seen[it.sid] || [];
  const mk = (kind) => it.cands.map((c, k) => `<button class="pick ${kind}" data-kind="${kind}" data-code="${c.code}" aria-pressed="${v[kind] === c.code}" aria-label="${kind === "best" ? "最好读" : "最难读"}：${LETTERS[k]}">${LETTERS[k]}</button>`).join("");
  $("bestPicks").innerHTML = mk("best"); $("worstPicks").innerHTML = mk("worst");
  $("tie").checked = !!v.tie; $("note").value = v.note || "";
  const unread = it.cands.length - seen.length;
  const st = $("status");
  if (unread > 0) { st.textContent = `还有 ${unread} 个版本没打开过。建议每版至少读完一遍再选。`; st.className = "status warn"; }
  else if (!v.best) { st.textContent = "4 个版本都读过了，选出最好读的一版就可以去下一篇。"; st.className = "status"; }
  else { st.textContent = "已记录。可以去下一篇，也可以随时回来改。"; st.className = "status"; }
  $("prevBtn").disabled = state.i === 0;
  $("nextBtn").textContent = state.i === DATA.items.length - 1 ? "完成" : "下一篇";
}
function renderItem() {
  const it = item();
  $("brief").innerHTML = `第 ${state.i + 1} / ${DATA.items.length} 篇：<b>${esc(it.title)}</b>。下面是同一篇内容的 ${it.cands.length} 个版本，来源已隐去，顺序是随机的。` +
    (it.prompt ? `<br>当时的提问：${esc(it.prompt)}` : "");
  const opts = it.cands.map((_, k) => `<option value="${k}">${LETTERS[k]}</option>`).join("");
  $("selL").innerHTML = opts; $("selR").innerHTML = opts;
  state.tab = 0; state.right = Math.min(1, it.cands.length - 1);
  $("paneL").scrollTop = 0; $("paneR").scrollTop = 0;
  showTab(0, false); if (state.split) showRight(state.right, false);
  state.started[it.sid] = Date.now();
  renderProgress();
}
function go(k) {
  tick(); if (k < 0) return;
  if (k >= DATA.items.length) { $("main").classList.add("hidden"); $("finish").classList.remove("hidden"); return; }
  state.i = k; save(); $("main").classList.remove("hidden"); $("finish").classList.add("hidden"); renderItem();
}
function tick() { const it = item(); const t0 = state.started[it.sid]; if (t0) { vote().seconds = (vote().seconds || 0) + Math.round((Date.now() - t0) / 1000); state.started[it.sid] = Date.now(); save(); } }
function setSplit(on) {
  state.split = on; $("panes").classList.toggle("split", on); $("paneR").classList.toggle("hidden", !on);
  $("modeSingle").setAttribute("aria-pressed", String(!on)); $("modeSplit").setAttribute("aria-pressed", String(on));
  if (on) { const k = state.tab === state.right ? (state.tab + 1) % item().cands.length : state.right; showRight(k); }
}

// ---- 事件 ----
document.addEventListener("click", e => {
  const p = e.target.closest(".pick"); if (p) { const v = vote(); const kind = p.dataset.kind, code = p.dataset.code;
    v[kind] = v[kind] === code ? null : code;
    if (v.best && v.best === v.worst) v[kind === "best" ? "worst" : "best"] = null;
    save(); renderVote(); renderTabs(); renderProgress(); return; }
  const d = e.target.closest(".dot"); if (d) go(+d.dataset.k);
});
$("tie").onchange = e => { vote().tie = e.target.checked; save(); };
$("note").oninput = e => { vote().note = e.target.value; save(); };
$("prevBtn").onclick = () => go(state.i - 1);
$("nextBtn").onclick = () => go(state.i + 1);
$("backBtn").onclick = () => go(DATA.items.length - 1);
$("modeSingle").onclick = () => setSplit(false);
$("modeSplit").onclick = () => setSplit(true);
$("selL").onchange = e => showTab(+e.target.value);
$("selR").onchange = e => showRight(+e.target.value);
let syncing = false;
["paneL", "paneR"].forEach((id, k) => $(id).addEventListener("scroll", () => {
  if (!state.split || syncing) return; syncing = true;
  setRatio($(k ? "paneL" : "paneR"), ratio($(id))); requestAnimationFrame(() => syncing = false);
}));
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea,input,select")) return;
  if (/^[1-6]$/.test(e.key) && +e.key <= item().cands.length) showTab(+e.key - 1);
  else if (e.key === "ArrowRight") go(state.i + 1);
  else if (e.key === "ArrowLeft") go(state.i - 1);
});
$("exportBtn").onclick = () => {
  tick();
  const done = DATA.items.filter(it => state.votes[it.sid] && state.votes[it.sid].best).length;
  const blob = new Blob([JSON.stringify({ run: DATA.run, exported_at: new Date().toISOString(), completed: done, total: DATA.items.length, votes: state.votes }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "blind_votes.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  $("status").textContent = `已导出 ${done} / ${DATA.items.length} 篇的投票。`; $("status").className = "status";
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (j.run !== DATA.run) throw new Error("这份进度属于另一轮盲测（" + j.run + "）");
    state.votes = j.votes || {}; save(); renderItem(); $("status").textContent = "进度已载入。"; }
  catch (err) { $("status").textContent = "载入失败：" + err.message; $("status").className = "status warn"; }
  e.target.value = "";
};
window.addEventListener("beforeunload", tick);

load(); renderItem();
</script>
</body>
</html>
