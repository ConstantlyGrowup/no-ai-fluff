<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盲测：哪一版更好读</title>
<style>
:root{
  --paper:#F5F7F4; --sheet:#FCFDFB; --ink:#1E2422; --ink-soft:#4A5450; --muted:#87918C;
  --rule:#6E9A80; --rule-faint:#D6E2DA; --red:#B3392F; --red-wash:#F6E3E0;
  --serif:"Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rule);outline-offset:2px}

/* 顶栏 */
.top{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--rule-faint);background:var(--sheet)}
.top h1{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;letter-spacing:.02em}
.progress{display:flex;gap:5px;align-items:center;flex:1;min-width:0}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule-faint);background:none;font-size:11px;color:var(--muted);display:grid;place-items:center;flex:none}
.dot.done{border-color:var(--rule);color:var(--ink)}
.dot.cur{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.top .tools{display:flex;gap:8px}
.btn{border:1px solid var(--rule-faint);background:var(--sheet);border-radius:6px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--rule)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* 主体 */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.reader{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule-faint)}
.brief{padding:16px 32px 0;color:var(--ink-soft);font-size:14px;line-height:1.7;max-width:46em}
.brief b{color:var(--ink);font-weight:600}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:14px 32px 0;border-bottom:1.5px solid var(--rule)}
.tab{position:relative;border:1.5px solid transparent;border-bottom:none;background:none;padding:6px 18px 8px;font-family:var(--serif);font-size:18px;color:var(--muted);border-radius:6px 6px 0 0;margin-bottom:-1.5px}
.tab[aria-selected="true"]{border-color:var(--rule);background:var(--sheet);color:var(--ink)}
.tab .seen{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--rule-faint)}
.tab .seen.on{background:var(--rule)}
.tab.best{color:var(--red)}
.tab.best::after{content:"";position:absolute;inset:3px 8px 5px;border:1.5px solid var(--red);border-radius:50%;transform:rotate(-6deg);pointer-events:none}
.modes{margin-left:auto;display:flex;gap:4px;padding-bottom:6px}
.modes .btn{padding:4px 10px;font-size:13px}
.modes .btn[aria-pressed="true"]{border-color:var(--rule);background:var(--rule-faint)}

.panes{flex:1;display:grid;grid-template-columns:1fr;min-height:0;background:var(--sheet)}
.panes.split{grid-template-columns:1fr 1fr}
.pane{overflow-y:auto;min-height:0;padding:28px 32px 80px}
.panes.split .pane:first-child{border-right:1px solid var(--rule-faint)}
.pane-head{display:none;align-items:center;gap:8px;margin:-12px 0 16px;color:var(--muted);font-size:13px}
.panes.split .pane-head{display:flex}
.pane-head select{font:inherit;border:1px solid var(--rule-faint);border-radius:4px;background:var(--sheet);padding:2px 6px}

/* 正文排版：宋体、约 36 字一行 */
.doc{font-family:var(--serif);font-size:17px;line-height:1.9;max-width:36em;margin:0 auto;color:var(--ink)}
.panes.split .doc{font-size:16px}
.doc h1,.doc h2,.doc h3,.doc h4{font-weight:600;line-height:1.5;margin:1.4em 0 .5em}
.doc h1{font-size:1.35em}.doc h2{font-size:1.2em}.doc h3{font-size:1.08em}.doc h4{font-size:1em}
.doc p{margin:0 0 .9em}
.doc ul,.doc ol{margin:0 0 .9em;padding-left:1.6em}
.doc li{margin:.2em 0}
.doc blockquote{margin:0 0 .9em;padding:.1em 0 .1em 1em;border-left:3px solid var(--rule-faint);color:var(--ink-soft)}
.doc code{font-family:var(--mono);font-size:.86em;background:#EEF2EF;padding:.05em .3em;border-radius:3px}
.doc pre{background:#EEF2EF;padding:12px 14px;border-radius:6px;overflow-x:auto;line-height:1.55;font-size:13.5px}
.doc pre code{background:none;padding:0;font-size:inherit}
.doc table{border-collapse:collapse;margin:0 0 1em;font-size:.92em;line-height:1.6}
.doc th,.doc td{border:1px solid var(--rule-faint);padding:4px 10px;text-align:left;vertical-align:top}
.doc th{background:#EEF2EF;font-weight:600}
.doc hr{border:none;border-top:1px dashed var(--rule-faint);margin:1.4em 0}
.doc a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule)}

/* 投票栏 */
.vote{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;background:var(--paper)}
.vote h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 8px}
.vote p.hint{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.6}
.picks{display:flex;gap:8px}
.pick{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule-faint);background:var(--sheet);font-family:var(--serif);font-size:18px;display:grid;place-items:center}
.pick:hover{border-color:var(--ink-soft)}
.pick[aria-pressed="true"].best{border-color:var(--red);color:var(--red);background:var(--red-wash)}
.pick[aria-pressed="true"].worst{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.pick:disabled{opacity:.3;cursor:default}
label.tie{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft)}
textarea{width:100%;min-height:90px;resize:vertical;font:inherit;font-size:14px;line-height:1.6;border:1px solid var(--rule-faint);border-radius:6px;padding:8px 10px;background:var(--sheet)}
.nav{display:flex;gap:8px;margin-top:auto}
.nav .btn{flex:1;padding:9px}
.status{font-size:13px;color:var(--muted);line-height:1.6}
.status.warn{color:var(--red)}
.keys{font-size:12px;color:var(--muted);line-height:1.8}
.keys kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-faint);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--sheet)}

/* 完成页 */
.finish{max-width:34em;margin:60px auto;padding:0 24px;font-family:var(--serif);line-height:1.9}
.finish h2{font-size:22px;font-weight:600}
.hidden{display:none!important}

@media (max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .reader{border-right:none;border-bottom:1px solid var(--rule-faint)}
  .modes{display:none}
  .panes.split{grid-template-columns:1fr}.panes.split .pane:last-child{display:none}
  .pane{padding:20px 18px 40px}.brief,.tabs{padding-left:18px;padding-right:18px}
  .vote{max-height:46vh}
  .progress{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .pick,.tab,.btn{transition:border-color .15s,background-color .15s,color .15s}
}
</style>
</head>
<body>
<header class="top">
  <h1>哪一版更好读</h1>
  <nav class="progress" id="progress" aria-label="篇目进度"></nav>
  <div class="tools">
    <button class="btn" id="importBtn" title="载入之前导出的进度">载入进度</button>
    <button class="btn primary" id="exportBtn">导出结果</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </div>
</header>

<main class="main" id="main">
  <section class="reader" aria-label="阅读区">
    <div class="brief" id="brief"></div>
    <div class="tabs" role="tablist" id="tabs">
      <div class="modes">
        <button class="btn" id="modeSingle" aria-pressed="true">逐个读</button>
        <button class="btn" id="modeSplit" aria-pressed="false">并排对照</button>
      </div>
    </div>
    <div class="panes" id="panes">
      <article class="pane" id="paneL"><div class="pane-head">左侧：<select id="selL"></select></div><div class="doc" id="docL"></div></article>
      <article class="pane hidden" id="paneR"><div class="pane-head">右侧：<select id="selR"></select></div><div class="doc" id="docR"></div></article>
    </div>
  </section>

  <aside class="vote" aria-label="投票">
    <div>
      <h2>最好读的一版</h2>
      <p class="hint">凭读起来的感觉选：哪一版最像人话、读着最不累。不用逐字找错。</p>
      <div class="picks" id="bestPicks"></div>
    </div>
    <div>
      <h2>最难读的一版（可选）</h2>
      <div class="picks" id="worstPicks"></div>
    </div>
    <label class="tie"><input type="checkbox" id="tie"> 几版差不多，很难分出高下</label>
    <div>
      <h2>想说的话（可选）</h2>
      <textarea id="note" placeholder="比如：B 的第二段很别扭；A 和 C 几乎一样"></textarea>
    </div>
    <div class="status" id="status"></div>
    <div class="nav">
      <button class="btn" id="prevBtn">上一篇</button>
      <button class="btn primary" id="nextBtn">下一篇</button>
    </div>
    <div class="keys"><kbd>1</kbd>–<kbd>4</kbd> 切换版本　<kbd>←</kbd><kbd>→</kbd> 换篇</div>
  </aside>
</main>

<section class="finish hidden" id="finish">
  <h2>全部投完了</h2>
  <p>点右上角的“导出结果”，保存 <b>blind_votes.json</b>，然后在项目根目录运行：</p>
  <p><code>python benchmarks/blind_workbench.py analyze blind_votes.json</code></p>
  <p>脚本会解码每个代号对应的版本，并给出统计。想改某一篇的投票，可以点上方进度圆点回去修改。</p>
  <p><button class="btn" id="backBtn">回到最后一篇</button></p>
</section>

<script>
const DATA = {"run": "sonnet1", "items": [{"sid": "discussion-001", "title": "创业团队单体 vs 微服务", "scenario": "discussion", "prompt": "单体 vs 微服务，对于一个 20 人左右的创业团队，你怎么看这个 trade-off？", "cands": [{"code": "9cc3d4", "text": "对于一个 20 人左右的创业团队（假设其中研发人员在 10-15 人左右），在单体（Monolith）和微服务（Microservices）之间做选择，**最务实且被广泛验证的建议是：从“模块化单体（Modular Monolith）”起步。**\n\n在这个阶段，生存、寻找产品市场契合度（PMF）和快速迭代是第一要务。过早引入微服务往往是创业公司的“技术毒药”。\n\n以下是针对这个规模团队的具体 Trade-off 分析：\n\n### 1. 为什么“单体”更适合现在的你们？\n\n*   **极高的开发与测试效率：** 代码在一个仓库，不需要跨服务调用，没有复杂的接口契约，本地跑起来就能调试全流程。\n*   **没有“分布式税（Distributed Tax）”：** 不需要处理网络延迟、分布式事务、数据最终一致性、复杂的链路追踪等难题。\n*   **运维成本低：** 20 人的团队往往没有专职的 DevOps 或 SRE 专家。单体应用只需要几台服务器、一个数据库、简单的 CI/CD 就能跑起来，团队可以将 90% 以上的精力放在业务开发上。\n*   **符合康威定律：** 20 人的团队（10 多个研发）通常也就是 1 到 2 个敏捷小组。沟通成本很低，不需要用物理的服务边界来隔离团队。\n\n### 2. 为什么“微服务”在这个阶段风险极高？\n\n*   **沉重的基建负担：** 微服务需要容器编排（K8s）、服务发现、配置中心、API 网关、分布式日志等基础设施。这会消耗你团队里最优秀的 1-2 个工程师的全部精力。\n*   **重构成本极高：** 创业初期业务模式不清晰，领域边界（Bounded Context）一直在变。在单体里，重构几个模块只是移动代码和改名；但在微服务里，重构跨服务的业务边界简直是一场灾难。\n*   **排错困难：** 对于一个几十人的团队，线上出一个 Bug 需要跨 3 个服务去查日志，会严重拖慢问题响应速度。\n\n### 3. 最佳实践：模块化单体（Modular Monolith）\n\n单体不等于“面条代码（Spaghetti Code）”或“大泥球（Big Ball of Mud）”。你们应该采用**模块化单体**架构：\n\n*   **物理上是一个整体：** 依然是一个代码库，打包成一个进程部署。\n*   **逻辑上高度解耦：** 按照业务领域（Domain）划分模块（比如 `User` 模块、`Order` 模块、`Payment` 模块）。\n*   **严格的依赖管理：** 模块之间只能通过清晰的接口/事件进行通信，不能直接读写对方的数据库表。\n\n**这样做的好处是：** 享受单体的开发速度和低运维成本，同时由于逻辑边界清晰，未来某天当团队扩张到 50-100 人，必须拆分微服务时，可以非常丝滑地将某个模块独立出去。\n\n### 4. 什么时候可以打破规则（少量引入微服务）？\n\n即使主架构是单体，如果有以下特殊场景，可以剥离出个别独立服务：\n\n*   **技术栈异构：** 比如主业务是 Java/Go 开发的，但需要引入一个 AI 相关的服务，只能用 Python 跑，那么这个 AI 模块可以作为独立服务。\n*   **资源消耗极度不均：** 比如有一个报表生成/视频转码模块，非常消耗 CPU 且容易把整个系统拖垮，应该将这类 Worker 服务单独拆分部署。\n\n### 总结\n\n对于 20 人的创业团队：**Build a solid Monolith, don't build a Microservices platform.** \n\n把有限的资源集中在“证明业务能赚钱”上，而不是“证明我们的架构能支撑百万并发”上。当你们的单体架构真的撑不住、开发人员多到经常产生代码合并冲突时，说明你们已经赚到了足够的钱和时间，那时候再去拆分微服务才是幸福的烦恼。"}, {"code": "66c472", "text": "对于一个 20 人左右的创业团队（假设研发人员在 10-15 人），在单体（Monolith）和微服务（Microservices）之间做选择，最务实、也被广泛验证的建议是：**从“模块化单体（ const LETTERS = ["A","B","C","D","E","F"];
const STORE = "nafBlind:" + (DATA && DATA.run);
const state = { i: 0, tab: 0, split: false, right: 1, votes: {}, seen: {}, started: {} };

// ---- 持久化（浏览器存储可能不可用，失败时只保留在内存里，靠导出兜底） ----
function save() { try { localStorage.setItem(STORE, JSON.stringify({ votes: state.votes, seen: state.seen, i: state.i })); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s) { state.votes = s.votes || {}; state.seen = s.seen || {}; state.i = Math.min(s.i || 0, DATA.items.length - 1); } } catch (e) {}
}

// ---- 极简 Markdown 渲染（先转义，离线可用） ----
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s)
    .replace(/\*\*(\S(?:.*?\S)?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*]*?[^*\s])\*(?![*\w])/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, t, u) => /^(https?:|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);
  return s.replace(/\u0000(\d+)\u0000/g, (_, k) => "<code>" + esc(codes[+k]) + "</code>");
}
function md(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n"); const out = []; let i = 0;
  const isTable = (a, b) => /^\s*\|.*\|\s*$/.test(a) && /^\s*\|?\s*:?-{2,}/.test(b || "");
  while (i < lines.length) {
    let l = lines[i];
    if (/^\s*(```|~~~)/.test(l)) { const f = l.trim().slice(0, 3); const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(f)) buf.push(lines[i++]); i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue; }
    if (/^\s*$/.test(l)) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (isTable(l, lines[i + 1])) {
      const row = r => r.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => inline(c.trim()));
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push("<table><thead><tr>" + head.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table>"); continue; }
    if (/^\s*>/.test(l)) { const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + md(buf.join("\n")) + "</blockquote>"); continue; }
    if (/^\s*([-*+]|\d{1,3}[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d{1,3}[.)])\s+/.test(lines[i])) {
        let t = lines[i++].replace(/^\s*([-*+]|\d{1,3}[.)])\s+/, "").replace(/^\[([ xX])\]\s+/, (_, c) => c.trim() ? "☑ " : "☐ ");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d{1,3}[.)])\s+/.test(lines[i])) t += " " + lines[i++].trim();
        items.push("<li>" + inline(t) + "</li>"); }
      out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>")); continue; }
    const buf = [l]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|\s*```|\s*>|\s*([-*+]|\d{1,3}[.)])\s+|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
  }
  return out.join("\n");
}

const $ = id => document.getElementById(id);
const item = () => DATA.items[state.i];
const vote = () => (state.votes[item().sid] ||= { best: null, worst: null, tie: false, note: "", seconds: 0 });

function ratio(el) { const max = el.scrollHeight - el.clientHeight; return max > 0 ? el.scrollTop / max : 0; }
function setRatio(el, r) { el.scrollTop = r * (el.scrollHeight - el.clientHeight); }

function renderProgress() {
  $("progress").innerHTML = DATA.items.map((it, k) => {
    const v = state.votes[it.sid]; const done = v && v.best;
    return `<button class="dot ${done ? "done" : ""} ${k === state.i ? "cur" : ""}" data-k="${k}" aria-label="第 ${k + 1} 篇${done ? "，已投" : ""}">${k + 1}</button>`;
  }).join("");
}
function renderTabs() {
  const it = item(); const v = vote(); const seen = state.seen[it.sid] || [];
  $("tabs").querySelectorAll(".tab").forEach(t => t.remove());
  const frag = document.createDocumentFragment();
  it.cands.forEach((c, k) => {
    const b = document.createElement("button");
    b.className = "tab" + (v.best === c.code ? " best" : ""); b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(k === state.tab && !state.split || state.split && k === state.tab));
    b.innerHTML = `${LETTERS[k]}<span class="seen ${seen.includes(k) ? "on" : ""}" title="${seen.includes(k) ? "已读过" : "未读"}"></span>`;
    b.onclick = () => showTab(k); frag.appendChild(b);
  });
  $("tabs").insertBefore(frag, $("tabs").querySelector(".modes"));
}
function markSeen(k) { const s = (state.seen[item().sid] ||= []); if (!s.includes(k)) { s.push(k); save(); } }
function showTab(k, keepRatio = true) {
  const r = keepRatio ? ratio($("paneL")) : 0;
  state.tab = k; $("docL").innerHTML = md(item().cands[k].text); $("selL").value = k;
  requestAnimationFrame(() => setRatio($("paneL"), r));
  markSeen(k); renderTabs(); renderVote();
}
function showRight(k, keepRatio = true) { const r = keepRatio ? ratio($("paneR")) : 0; state.right = k; $("docR").innerHTML = md(item().cands[k].text); $("selR").value = k; requestAnimationFrame(() => setRatio($("paneR"), r)); markSeen(k); renderTabs(); }
function renderVote() {
  const it = item(); const v = vote(); const seen = state.seen[it.sid] || [];
  const mk = (kind) => it.cands.map((c, k) => `<button class="pick ${kind}" data-kind="${kind}" data-code="${c.code}" aria-pressed="${v[kind] === c.code}" aria-label="${kind === "best" ? "最好读" : "最难读"}：${LETTERS[k]}">${LETTERS[k]}</button>`).join("");
  $("bestPicks").innerHTML = mk("best"); $("worstPicks").innerHTML = mk("worst");
  $("tie").checked = !!v.tie; $("note").value = v.note || "";
  const unread = it.cands.length - seen.length;
  const st = $("status");
  if (unread > 0) { st.textContent = `还有 ${unread} 个版本没打开过。建议每版至少读完一遍再选。`; st.className = "status warn"; }
  else if (!v.best) { st.textContent = "4 个版本都读过了，选出最好读的一版就可以去下一篇。"; st.className = "status"; }
  else { st.textContent = "已记录。可以去下一篇，也可以随时回来改。"; st.className = "status"; }
  $("prevBtn").disabled = state.i === 0;
  $("nextBtn").textContent = state.i === DATA.items.length - 1 ? "完成" : "下一篇";
}
function renderItem() {
  const it = item();
  $("brief").innerHTML = `第 ${state.i + 1} / ${DATA.items.length} 篇：<b>${esc(it.title)}</b>。下面是同一篇内容的 ${it.cands.length} 个版本，来源已隐去，顺序是随机的。` +
    (it.prompt ? `<br>当时的提问：${esc(it.prompt)}` : "");
  const opts = it.cands.map((_, k) => `<option value="${k}">${LETTERS[k]}</option>`).join("");
  $("selL").innerHTML = opts; $("selR").innerHTML = opts;
  state.tab = 0; state.right = Math.min(1, it.cands.length - 1);
  $("paneL").scrollTop = 0; $("paneR").scrollTop = 0;
  showTab(0, false); if (state.split) showRight(state.right, false);
  state.started[it.sid] = Date.now();
  renderProgress();
}
function go(k) {
  tick(); if (k < 0) return;
  if (k >= DATA.items.length) { $("main").classList.add("hidden"); $("finish").classList.remove("hidden"); return; }
  state.i = k; save(); $("main").classList.remove("hidden"); $("finish").classList.add("hidden"); renderItem();
}
function tick() { const it = item(); const t0 = state.started[it.sid]; if (t0) { vote().seconds = (vote().seconds || 0) + Math.round((Date.now() - t0) / 1000); state.started[it.sid] = Date.now(); save(); } }
function setSplit(on) {
  state.split = on; $("panes").classList.toggle("split", on); $("paneR").classList.toggle("hidden", !on);
  $("modeSingle").setAttribute("aria-pressed", String(!on)); $("modeSplit").setAttribute("aria-pressed", String(on));
  if (on) { const k = state.tab === state.right ? (state.tab + 1) % item().cands.length : state.right; showRight(k); }
}

// ---- 事件 ----
document.addEventListener("click", e => {
  const p = e.target.closest(".pick"); if (p) { const v = vote(); const kind = p.dataset.kind, code = p.dataset.code;
    v[kind] = v[kind] === code ? null : code;
    if (v.best && v.best === v.worst) v[kind === "best" ? "worst" : "best"] = null;
    save(); renderVote(); renderTabs(); renderProgress(); return; }
  const d = e.target.closest(".dot"); if (d) go(+d.dataset.k);
});
$("tie").onchange = e => { vote().tie = e.target.checked; save(); };
$("note").oninput = e => { vote().note = e.target.value; save(); };
$("prevBtn").onclick = () => go(state.i - 1);
$("nextBtn").onclick = () => go(state.i + 1);
$("backBtn").onclick = () => go(DATA.items.length - 1);
$("modeSingle").onclick = () => setSplit(false);
$("modeSplit").onclick = () => setSplit(true);
$("selL").onchange = e => showTab(+e.target.value);
$("selR").onchange = e => showRight(+e.target.value);
let syncing = false;
["paneL", "paneR"].forEach((id, k) => $(id).addEventListener("scroll", () => {
  if (!state.split || syncing) return; syncing = true;
  setRatio($(k ? "paneL" : "paneR"), ratio($(id))); requestAnimationFrame(() => syncing = false);
}));
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea,input,select")) return;
  if (/^[1-6]$/.test(e.key) && +e.key <= item().cands.length) showTab(+e.key - 1);
  else if (e.key === "ArrowRight") go(state.i + 1);
  else if (e.key === "ArrowLeft") go(state.i - 1);
});
$("exportBtn").onclick = () => {
  tick();
  const done = DATA.items.filter(it => state.votes[it.sid] && state.votes[it.sid].best).length;
  const blob = new Blob([JSON.stringify({ run: DATA.run, exported_at: new Date().toISOString(), completed: done, total: DATA.items.length, votes: state.votes }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "blind_votes.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  $("status").textContent = `已导出 ${done} / ${DATA.items.length} 篇的投票。`; $("status").className = "status";
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (j.run !== DATA.run) throw new Error("这份进度属于另一轮盲测（" + j.run + "）");
    state.votes = j.votes || {}; save(); renderItem(); $("status").textContent = "进度已载入。"; }
  catch (err) { $("status").textContent = "载入失败：" + err.message; $("status").className = "status warn"; }
  e.target.value = "";
};
window.addEventListener("beforeunload", tick);

load(); renderItem();
</script>
</body>
</html>
