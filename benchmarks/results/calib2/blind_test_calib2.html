<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盲测：哪一版更好读</title>
<style>
:root{
  --paper:#F5F7F4; --sheet:#FCFDFB; --ink:#1E2422; --ink-soft:#4A5450; --muted:#87918C;
  --rule:#6E9A80; --rule-faint:#D6E2DA; --red:#B3392F; --red-wash:#F6E3E0;
  --serif:"Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rule);outline-offset:2px}

/* 顶栏 */
.top{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--rule-faint);background:var(--sheet)}
.top h1{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;letter-spacing:.02em}
.progress{display:flex;gap:5px;align-items:center;flex:1;min-width:0}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule-faint);background:none;font-size:11px;color:var(--muted);display:grid;place-items:center;flex:none}
.dot.done{border-color:var(--rule);color:var(--ink)}
.dot.cur{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.top .tools{display:flex;gap:8px}
.btn{border:1px solid var(--rule-faint);background:var(--sheet);border-radius:6px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--rule)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* 主体 */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.reader{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule-faint)}
.brief{padding:16px 32px 0;color:var(--ink-soft);font-size:14px;line-height:1.7;max-width:46em}
.brief b{color:var(--ink);font-weight:600}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:14px 32px 0;border-bottom:1.5px solid var(--rule)}
.tab{position:relative;border:1.5px solid transparent;border-bottom:none;background:none;padding:6px 18px 8px;font-family:var(--serif);font-size:18px;color:var(--muted);border-radius:6px 6px 0 0;margin-bottom:-1.5px}
.tab[aria-selected="true"]{border-color:var(--rule);background:var(--sheet);color:var(--ink)}
.tab .seen{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--rule-faint)}
.tab .seen.on{background:var(--rule)}
.tab.best{color:var(--red)}
.tab.best::after{content:"";position:absolute;inset:3px 8px 5px;border:1.5px solid var(--red);border-radius:50%;transform:rotate(-6deg);pointer-events:none}
.modes{margin-left:auto;display:flex;gap:4px;padding-bottom:6px}
.modes .btn{padding:4px 10px;font-size:13px}
.modes .btn[aria-pressed="true"]{border-color:var(--rule);background:var(--rule-faint)}

.panes{flex:1;display:grid;grid-template-columns:1fr;min-height:0;background:var(--sheet)}
.panes.split{grid-template-columns:1fr 1fr}
.pane{overflow-y:auto;min-height:0;padding:28px 32px 80px}
.panes.split .pane:first-child{border-right:1px solid var(--rule-faint)}
.pane-head{display:none;align-items:center;gap:8px;margin:-12px 0 16px;color:var(--muted);font-size:13px}
.panes.split .pane-head{display:flex}
.pane-head select{font:inherit;border:1px solid var(--rule-faint);border-radius:4px;background:var(--sheet);padding:2px 6px}

/* 正文排版：宋体、约 36 字一行 */
.doc{font-family:var(--serif);font-size:17px;line-height:1.9;max-width:36em;margin:0 auto;color:var(--ink)}
.panes.split .doc{font-size:16px}
.doc h1,.doc h2,.doc h3,.doc h4{font-weight:600;line-height:1.5;margin:1.4em 0 .5em}
.doc h1{font-size:1.35em}.doc h2{font-size:1.2em}.doc h3{font-size:1.08em}.doc h4{font-size:1em}
.doc p{margin:0 0 .9em}
.doc ul,.doc ol{margin:0 0 .9em;padding-left:1.6em}
.doc li{margin:.2em 0}
.doc blockquote{margin:0 0 .9em;padding:.1em 0 .1em 1em;border-left:3px solid var(--rule-faint);color:var(--ink-soft)}
.doc code{font-family:var(--mono);font-size:.86em;background:#EEF2EF;padding:.05em .3em;border-radius:3px}
.doc pre{background:#EEF2EF;padding:12px 14px;border-radius:6px;overflow-x:auto;line-height:1.55;font-size:13.5px}
.doc pre code{background:none;padding:0;font-size:inherit}
.doc table{border-collapse:collapse;margin:0 0 1em;font-size:.92em;line-height:1.6}
.doc th,.doc td{border:1px solid var(--rule-faint);padding:4px 10px;text-align:left;vertical-align:top}
.doc th{background:#EEF2EF;font-weight:600}
.doc hr{border:none;border-top:1px dashed var(--rule-faint);margin:1.4em 0}
.doc a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule)}

/* 投票栏 */
.vote{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;background:var(--paper)}
.vote h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 8px}
.vote p.hint{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.6}
.picks{display:flex;gap:8px}
.pick{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule-faint);background:var(--sheet);font-family:var(--serif);font-size:18px;display:grid;place-items:center}
.pick:hover{border-color:var(--ink-soft)}
.pick[aria-pressed="true"].best{border-color:var(--red);color:var(--red);background:var(--red-wash)}
.pick[aria-pressed="true"].worst{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.pick:disabled{opacity:.3;cursor:default}
label.tie{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft)}
textarea{width:100%;min-height:90px;resize:vertical;font:inherit;font-size:14px;line-height:1.6;border:1px solid var(--rule-faint);border-radius:6px;padding:8px 10px;background:var(--sheet)}
.nav{display:flex;gap:8px;margin-top:auto}
.nav .btn{flex:1;padding:9px}
.status{font-size:13px;color:var(--muted);line-height:1.6}
.status.warn{color:var(--red)}
.keys{font-size:12px;color:var(--muted);line-height:1.8}
.keys kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-faint);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--sheet)}

/* 完成页 */
.finish{max-width:34em;margin:60px auto;padding:0 24px;font-family:var(--serif);line-height:1.9}
.finish h2{font-size:22px;font-weight:600}
.hidden{display:none!important}

@media (max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .reader{border-right:none;border-bottom:1px solid var(--rule-faint)}
  .modes{display:none}
  .panes.split{grid-template-columns:1fr}.panes.split .pane:last-child{display:none}
  .pane{padding:20px 18px 40px}.brief,.tabs{padding-left:18px;padding-right:18px}
  .vote{max-height:46vh}
  .progress{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .pick,.tab,.btn{transition:border-color .15s,background-color .15s,color .15s}
}
</style>
</head>
<body>
<header class="top">
  <h1>哪一版更好读</h1>
  <nav class="progress" id="progress" aria-label="篇目进度"></nav>
  <div class="tools">
    <button class="btn" id="importBtn" title="载入之前导出的进度">载入进度</button>
    <button class="btn primary" id="exportBtn">导出结果</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </div>
</header>

<main class="main" id="main">
  <section class="reader" aria-label="阅读区">
    <div class="brief" id="brief"></div>
    <div class="tabs" role="tablist" id="tabs">
      <div class="modes">
        <button class="btn" id="modeSingle" aria-pressed="true">逐个读</button>
        <button class="btn" id="modeSplit" aria-pressed="false">并排对照</button>
      </div>
    </div>
    <div class="panes" id="panes">
      <article class="pane" id="paneL"><div class="pane-head">左侧：<select id="selL"></select></div><div class="doc" id="docL"></div></article>
      <article class="pane hidden" id="paneR"><div class="pane-head">右侧：<select id="selR"></select></div><div class="doc" id="docR"></div></article>
    </div>
  </section>

  <aside class="vote" aria-label="投票">
    <div>
      <h2>最好读的一版</h2>
      <p class="hint">凭读起来的感觉选：哪一版最像人话、读着最不累。不用逐字找错。</p>
      <div class="picks" id="bestPicks"></div>
    </div>
    <div>
      <h2>最难读的一版（可选）</h2>
      <div class="picks" id="worstPicks"></div>
    </div>
    <label class="tie"><input type="checkbox" id="tie"> 几版差不多，很难分出高下</label>
    <div>
      <h2>想说的话（可选）</h2>
      <textarea id="note" placeholder="比如：B 的第二段很别扭；A 和 C 几乎一样"></textarea>
    </div>
    <div class="status" id="status"></div>
    <div class="nav">
      <button class="btn" id="prevBtn">上一篇</button>
      <button class="btn primary" id="nextBtn">下一篇</button>
    </div>
    <div class="keys"><kbd>1</kbd>–<kbd>4</kbd> 切换版本　<kbd>←</kbd><kbd>→</kbd> 换篇</div>
  </aside>
</main>

<section class="finish hidden" id="finish">
  <h2>全部投完了</h2>
  <p>点右上角的“导出结果”，保存 <b>blind_votes.json</b>，然后在项目根目录运行：</p>
  <p><code>python benchmarks/blind_workbench.py analyze blind_votes.json</code></p>
  <p>脚本会解码每个代号对应的版本，并给出统计。想改某一篇的投票，可以点上方进度圆点回去修改。</p>
  <p><button class="btn" id="backBtn">回到最后一篇</button></p>
</section>

<script>
const DATA = {"run": "calib2", "items": [{"sid": "discussion-001", "title": "创业团队单体 vs 微服务", "scenario": "discussion", "prompt": "单体 vs 微服务，对于一个 20 人左右的创业团队，你怎么看这个 trade-off？", "cands": [{"code": "dc6950", "text": "对于一个 20 人左右的创业团队（假设其中研发人员在 10-15 人左右），在单体（Monolith）和微服务（Microservices）之间做选择，**最务实且被广泛验证的建议是：从“模块化单体（Modular Monolith）”起步。**\n\n在这个阶段，生存、寻找产品市场契合度（PMF）和快速迭代是第一要务。过早引入微服务往往是创业公司的“技术毒药”。\n\n以下是针对这个规模团队的具体 Trade-off 分析：\n\n### 1. 为什么“单体”更适合现在的你们？\n\n*   **极高的开发与测试效率：** 代码在一个仓库，不需要跨服务调用，没有复杂的接口契约，本地跑起来就能调试全流程。\n*   **没有“分布式税（Distributed Tax）”：** 不需要处理网络延迟、分布式事务、数据最终一致性、复杂的链路追踪等难题。\n*   **运维成本低：** 20 人的团队往往没有专职的 DevOps 或 SRE 专家。单体应用只需要几台服务器、一个数据库、简单的 CI/CD 就能跑起来，团队可以将 90% 以上的精力放在业务开发上。\n*   **符合康威定律：** 20 人的团队（10 多个研发）通常也就是 1 到 2 个敏捷小组。沟通成本很低，不需要用物理的服务边界来隔离团队。\n\n### 2. 为什么“微服务”在这个阶段风险极高？\n\n*   **沉重的基建负担：** 微服务需要容器编排（K8s）、服务发现、配置中心、API 网关、分布式日志等基础设施。这会消耗你团队里最优秀的 1-2 个工程师的全部精力。\n*   **重构成本极高：** 创业初期业务模式不清晰，领域边界（Bounded Context）一直在变。在单体里，重构几个模块只是移动代码和改名；但在微服务里，重构跨服务的业务边界简直是一场灾难。\n*   **排错困难：** 对于一个几十人的团队，线上出个缺陷，需要跨 3 个服务去查日志，会严重拖慢问题响应速度。\n\n### 3. 最佳实践：模块化单体（Modular Monolith）\n\n单体不等于“面条代码（Spaghetti Code）”或“大泥球（Big Ball of Mud）”。你们应该采用**模块化单体**架构：\n\n*   **物理上是一个整体：** 依然是一个代码库，打包成一个进程部署。\n*   **逻辑上高度解耦：** 按照业务领域（Domain）划分模块（比如 `User` 模块、`Order` 模块、`Payment` 模块）。\n*   **严格的依赖管理：** 模块之间只能通过清晰的接口/事件进行通信，不能直接读写对方的数据库表。\n\n**这样做的好处是：** 既能拿到单体的开发速度和低运维成本，又因为逻辑边界清晰，未来某天团队扩张到 50-100 人、必须拆分微服务时，可以非常丝滑地把某个模块独立出去。\n\n### 4. 什么时候可以打破规则（少量引入微服务）？\n\n即使主架构是单体，如果有以下特殊场景，可以剥离出个别独立服务：\n\n*   **技术栈异构：** 比如主业务是 Java/Go 开发的，但需要引入一个 AI 相关的服务，只能用 Python 跑，那么这个 AI 模块可以作为独立服务。\n*   **资源消耗差别极大：** 比如有一个报表生成/视频转码模块，非常消耗 CPU 且容易把整个系统拖垮，应该将这类 Worker 服务单独拆分部署。\n\n### 总结\n\n对于 20 人的创业团队：**把单体做扎实，别去搭微服务平台。** \n\n把有限的资源集中在“证明业务能赚钱”上，而不是“证明我们的架构能支撑百万并发”上。当你们的单体架构真的撑不住、开发人员多到经常产生代码合并冲突时，说明你们已经赚到了足够的钱和时间，那时候再去拆分微服务才是幸福的烦恼。"}, {"code": "9ef93c", "text": "对于一个 20 人左右的创业团队（假设其中研发人员在 10-15 人左右），在单体（Monolith）和微服务（Microservices）之间做选择，**最务实且被广泛验证的建议是：从“模块化单体（Modular Monolith）”起步。**\n\n在这个阶段，生存、寻找产品市场契合度（PMF）和快速迭代是第一要务。过早引入微服务往往是创业公司的“技术毒药”。\n\n以下是针对这个规模团队的具体 Trade-off 分析：\n\n### 1. 为什么“单体”更适合现在的你们？\n\n*   **极高的开发与测试效率：** 代码在一个仓库，不需要跨服务调用，没有复杂的接口契约，本地跑起来就能调试全流程。\n*   **没有“分布式税（Distributed Tax）”：** 不需要处理网络延迟、分布式事务、数据最终一致性、复杂的链路追踪等难题。\n*   **运维成本低：** 20 人的团队往往没有专职的 DevOps 或 SRE 专家。单体应用只需要几台服务器、一个数据库、简单的 CI/CD 就能跑起来，团队可以将 90% 以上的精力放在业务开发上。\n*   **符合康威定律：** 20 人的团队（10 多个研发）通常也就是 1 到 2 个敏捷小组。沟通成本很低，不需要用物理的服务边界来隔离团队。\n\n### 2. 为什么“微服务”在这个阶段风险极高？\n\n*   **沉重的基建负担：** 微服务需要容器编排（K8s）、服务发现、配置中心、API 网关、分布式日志等基础设施。这会消耗你团队里最优秀的 1-2 个工程师的全部精力。\n*   **重构成本极高：** 创业初期业务模式不清晰，领域边界（Bounded Context）一直在变。在单体里，重构几个模块只是移动代码和改名；但在微服务里，重构跨服务的业务边界简直是一场灾难。\n*   **排错困难：** 对于一个几十人的团队，线上出一个 Bug 需要跨 3 个服务去查日志，会严重拖慢问题响应速度。\n\n### 3. 最佳实践：模块化单体（Modular Monolith）\n\n单体不等于“面条代码（Spaghetti Code）”或“大泥球（Big Ball of Mud）”。你们应该采用**模块化单体**架构：\n\n*   **物理上是一个整体：** 依然是一个代码库，打包成一个进程部署。\n*   **逻辑上高度解耦：** 按照业务领域（Domain）划分模块（比如 `User` 模块、`Order` 模块、`Payment` 模块）。\n*   **严格的依赖管理：** 模块之间只能通过清晰的接口/事件进行通信，不能直接读写对方的数据库表。\n\n**这样做的好处是：** 享受单体的开发速度和低运维成本，同时由于逻辑边界清晰，未来某天当团队扩张到 50-100 人，必须拆分微服务时，可以非常丝滑地将某个模块独立出去。\n\n### 4. 什么时候可以打破规则（少量引入微服务）？\n\n即使主架构是单体，如果有以下特殊场景，可以剥离出个别独立服务：\n\n*   **技术栈异构：** 比如主业务是 Java/Go 开发的，但需要引入一个 AI 相关的服务，只能用 Python 跑，那么这个 AI 模块可以作为独立服务。\n*   **资源消耗极度不均：** 比如有一个报表生成/视频转码模块，非常消耗 CPU 且容易把整个系统拖垮，应该将这类 Worker 服务单独拆分部署。\n\n### 总结\n\n对于 20 人的创业团队：**Build a solid Monolith, don't build a Microservices platform.** \n\n把有限的资源集中在“证明业务能赚钱”上，而不是“证明我们的架构能支撑百万并发”上。当你们的单体架构真的撑不住、开发人员多到经常产生代码合并冲突时，说明你们已经赚到了足够的钱和时间，那时候再去拆分微服务才是幸福的烦恼。"}, {"code": "475fbc", "text": "对于一个 20 人左右、研发人员约 10–15 人的创业团队，在单体（Monolith）和微服务（Microservices）之间做选择，最务实、也被广泛验证的建议是：从模块化单体（Modular Monolith）起步。\n\n这个阶段，生存、找到产品市场契合度（PMF）和快速迭代是第一要务。过早引入微服务，对创业公司往往是“技术毒药”。\n\n对这个规模的团队，具体 Trade-off 如下：\n\n### 1. 为什么单体更适合你们现在？\n\n* **开发与测试效率高：** 代码在一个仓库里，不需要跨服务调用，也没有跨服务的接口契约，本地跑起来就能调试完整流程。\n* **没有“分布式税（Distributed Tax）”：** 不需要处理服务间的网络延迟、分布式事务、最终一致性、复杂的链路追踪等问题。\n* **运维成本低：** 20 人的团队往往没有专职的 DevOps 或 SRE，单体应用只需要几台服务器、一个数据库和简单的 CI/CD 就能跑起来，团队可以把 90% 以上的精力放在业务开发上。\n* **符合康威定律：** 20 人的团队（10 多个研发）通常也就是 1 到 2 个敏捷小组，沟通成本很低，不需要用物理的服务边界来隔离团队。\n\n### 2. 为什么微服务在这个阶段风险极高？\n\n* **基础设施负担重：** 微服务需要容器编排（K8s）、服务发现、配置中心、API 网关、分布式日志等基础设施。这会消耗团队里最优秀的 1–2 个工程师的全部精力。\n* **重构成本极高：** 创业初期业务模式不清晰，领域边界（Bounded Context）一直在变。在单体里，重构几个模块只是移动代码和改名；在微服务里，重构跨服务的业务边界会困难得多。\n* **排错困难：** 对你们这个规模的团队来说，线上出一个 Bug 要跨 3 个服务查日志，会严重拖慢问题响应速度。\n\n### 3. 最佳实践：模块化单体（Modular Monolith）\n\n单体不等于“面条代码（Spaghetti Code）”或“大泥球（Big Ball of Mud）”。你们应该采用**模块化单体**架构：\n\n* **物理上是一个整体：** 依然是一个代码库，打包成一个进程部署。\n* **逻辑上高度解耦：** 按业务领域（Domain）划分模块，比如 `User`、`Order`、`Payment`。\n* **严格的依赖管理：** 模块之间只能通过清晰的接口或事件通信，不能直接读写对方的数据库表。\n\n**这样做的好处是：** 既能享受单体的开发速度和低运维成本，又因为逻辑边界清晰，未来团队扩张到 50–100 人、必须拆分微服务时，可以比较平滑地把某个模块拆成独立服务。\n\n### 4. 什么时候可以少量引入微服务？\n\n即使主架构是单体，以下特殊场景也可以剥离出个别独立服务：\n\n* **技术栈异构：** 主业务用 Java/Go 开发，但需要引入一个 AI 相关服务，只能用 Python 跑，这个 AI 模块就可以作为独立服务。\n* **资源消耗极度不均：** 比如报表生成或视频转码模块非常消耗 CPU，容易把整个系统拖垮，这类 Worker 服务适合单独拆分部署。\n\n### 总结\n\n对于 20 人的创业团队：**Build a solid Monolith, don't build a Microservices platform.**\n\n把有限的资源集中在“证明业务能赚钱”上，而不是“证明我们的架构能支撑百万并发”上。当单体架构真的撑不住、开发人员多到经常产生代码合并冲突时，说明你们已经赚到了足够的钱和时间，到那时再拆微服务，才是幸福的烦恼。"}]}, {"sid": "writing-005", "title": "开放平台 API v2 发布说明", "scenario": "writing", "prompt": "写一份开放平台 API v2 的对外发布说明。主要变化：鉴权从 API Key 改为 OAuth 2.0；新增 webhook 事件订阅；限流策略调整为按应用维度；v1 将在 6 个月后下线。", "cands": [{"code": "4d87b6", "text": "# 开放平台 API v2 对外发布说明\n\n我们正式发布开放平台 **API v2**。本次版本升级围绕安全性、事件通知能力和调用治理进行了重要调整，建议所有开发者尽快评估并启动迁移。\n\n## 一、主要变化\n\n### 1. 鉴权方式升级为 OAuth 2.0\n\nAPI v2 将鉴权方式从原有的 **API Key** 升级为 **OAuth 2.0**。\n\n通过 OAuth 2.0，开发者可以实现更安全、标准化的授权流程，并支持更细粒度的权限控制。\n\n主要变化包括：\n\n- 不再使用 API Key 作为主要鉴权方式\n- 调用 API 需使用 OAuth 2.0 获取 `access_token`\n- 请求接口时通过 `Authorization` 请求头传递令牌\n- 支持按授权范围控制接口访问权限\n\n示例：\n\n```http\nAuthorization: Bearer <access_token>\n```\n\n请开发者根据新的鉴权文档完成授权流程接入。\n\n---\n\n### 2. 新增 Webhook 事件订阅能力\n\nAPI v2 新增 **Webhook 事件订阅** 功能。\n\n开发者可以订阅平台事件，并在事件发生时接收平台主动推送的通知，无需再通过轮询方式获取状态变化。\n\n支持能力包括：\n\n- 创建和管理事件订阅\n- 配置事件回调地址\n- 接收平台事件推送\n- 支持事件签名校验，保障回调安全\n\n典型使用场景：\n\n- 订单状态变更通知\n- 用户授权状态变化通知\n- 资源创建、更新或删除通知\n- 异步任务完成通知\n\n请在开发者后台或通过 API 配置 Webhook 订阅。\n\n---\n\n### 3. 限流策略调整为按应用维度\n\nAPI v2 对限流策略进行了调整。\n\n原有策略将升级为 **按应用维度进行限流**，即同一个应用下的所有调用共享该应用的限流额度。\n\n调整后的策略有助于提升平台调用管理的一致性，并便于开发者基于应用进行容量规划。\n\n请开发者注意：\n\n- 限流额度以应用为单位统计\n- 同一应用下不同用户或不同凭证的请求将共享限流配额\n- 当超过限流阈值时，接口将返回限流错误\n- 建议合理控制并发请求，必要时实现重试和退避机制\n\n---\n\n### 4. API v1 将于 6 个月后下线\n\n随着 API v2 发布，API v1 将进入下线过渡期。\n\n**API v1 将在本公告发布之日起 6 个月后正式下线。**\n\n下线后：\n\n- API v1 接口将不再提供服务\n- 使用 API Key 的旧版鉴权方式将不再支持\n- 依赖 v1 的应用可能无法继续正常调用开放平台能力\n\n请所有仍在使用 API v1 的开发者尽快完成迁移。\n\n---\n\n## 二、迁移建议\n\n为确保业务平稳过渡，建议开发者按以下步骤进行迁移：\n\n1. **确认当前使用的 v1 接口清单**\n   - 梳理现有系统中调用的 API v1 接口\n   - 识别依赖 API Key 鉴权的调用链路\n\n2. **完成 OAuth 2.0 接入**\n   - 创建或升级应用配置\n   - 获取客户端凭证\n   - 实现授权流程和令牌刷新机制\n\n3. **替换接口调用地址和请求方式**\n   - 将 v1 接口替换为对应的 v2 接口\n   - 按 v2 文档调整请求参数和响应处理逻辑\n\n4. **评估限流影响**\n   - 根据应用维度重新评估调用量\n   - 优化高频调用场景\n   - 增加限流重试和降级处理\n\n5. **启用 Webhook 能力**\n   - 对适合事件驱动的场景，建议由轮询改为 Webhook\n   - 配置回调地址并完成签名验证\n   - 做好事件幂等处理\n\n6. **完成测试并上线**\n   - 在测试环境完成联调验证\n   - 灰度切换到 API v2\n   - 监控调用成功率、延迟和限流情况\n\n---\n\n## 三、时间安排\n\n| 阶段 | 时间 | 说明 |\n|---|---|---|\n| API v2 发布 | 即日起 | 开发者可开始接入 API v2 |\n| 迁移过渡期 | 发布后 6 个月内 | API v1 与 API v2 并行可用 |\n| API v1 下线 | 发布 6 个月后 | API v1 停止服务 |\n\n---\n\n## 四、开发者需采取的行动\n\n请开发者尽快完成以下事项：\n\n- 阅读 API v2 接入文档\n- 在开发者后台创建或升级应用\n- 将鉴权方式迁移至 OAuth 2.0\n- 根据应用维度限流策略调整调用逻辑\n- 根据业务需要配置 Webhook 事件订阅\n- 在 API v1 下线前完成全部迁移\n\n---\n\n## 五、支持与反馈\n\n如在迁移过程中遇到问题，请通过以下方式联系我们：\n\n- 开发者后台提交工单\n- 联系客户成功或技术支持团队\n- 查阅开放平台 API v2 文档和迁移指南\n\n感谢各位开发者长期以来对开放平台的支持。我们将持续提升平台能力、安全性和稳定性，帮助开发者更高效地构建集成应用。"}, {"code": "b56736", "text": "# 开放平台 API v2 对外发布说明\n\n开放平台 API v2 正式发布。本次升级涉及安全性、事件通知和限流策略，建议所有开发者尽快评估并启动迁移。\n\n## 一、主要变化\n\n### 1. 鉴权方式升级为 OAuth 2.0\n\nAPI v2 将鉴权方式从 API Key 升级为 OAuth 2.0。OAuth 2.0 提供更安全、标准化的授权流程，并支持更细粒度的权限控制。\n\n主要变化：\n\n- 不再使用 API Key 作为主要鉴权方式\n- 调用 API 需通过 OAuth 2.0 获取 `access_token`\n- 请求接口时通过 `Authorization` 请求头传递令牌\n- 支持按授权范围控制接口访问权限\n\n示例：\n\n```http\nAuthorization: Bearer <access_token>\n```\n\n请按新的鉴权文档接入授权流程。\n\n### 2. 新增 Webhook 事件订阅能力\n\nAPI v2 新增 Webhook 事件订阅。开发者可以订阅平台事件，并在事件发生时接收平台主动推送的通知，无需再通过轮询获取状态变化。\n\n支持：\n\n- 创建和管理事件订阅\n- 配置事件回调地址\n- 接收平台事件推送\n- 支持事件签名校验，保障回调安全\n\n典型场景：\n\n- 订单状态变更通知\n- 用户授权状态变化通知\n- 资源创建、更新或删除通知\n- 异步任务完成通知\n\n请在开发者后台或通过 API 配置 Webhook 订阅。\n\n### 3. 限流策略调整为按应用维度\n\nAPI v2 将限流策略调整为按应用维度，即同一应用下的所有调用共享该应用的限流额度。这有助于提升调用管理的一致性，也方便开发者按应用规划容量。\n\n请注意：\n\n- 限流额度以应用为单位统计\n- 同一应用下不同用户或不同凭证的请求将共享限流配额\n- 当超过限流阈值时，接口将返回限流错误\n- 建议合理控制并发请求，必要时实现重试和退避机制\n\n### 4. API v1 将于 6 个月后下线\n\nAPI v2 发布后，API v1 进入下线过渡期。\n\n**API v1 将在本公告发布之日起 6 个月后正式下线。**\n\n下线后：\n\n- API v1 接口将停止服务\n- 平台不再支持使用 API Key 的旧版鉴权方式\n- 依赖 v1 的应用可能无法继续正常调用开放平台能力\n\n请所有仍在使用 API v1 的开发者尽快完成迁移。\n\n## 二、迁移建议\n\n建议按以下步骤迁移，以确保业务平稳过渡：\n\n1. 确认当前使用的 v1 接口清单\n   - 梳理现有系统中调用的 API v1 接口\n   - 识别依赖 API Key 鉴权的调用链路\n\n2. 完成 OAuth 2.0 接入\n   - 创建或升级应用配置\n   - 获取客户端凭证\n   - 实现授权流程和令牌刷新机制\n\n3. 替换接口调用地址和请求方式\n   - 将 v1 接口替换为对应的 v2 接口\n   - 按 v2 文档调整请求参数和响应处理逻辑\n\n4. 评估限流影响\n   - 根据应用维度重新评估调用量\n   - 优化高频调用场景\n   - 加入限流重试和降级处理\n\n5. 启用 Webhook 能力\n   - 对适合事件驱动的场景，建议由轮询改为 Webhook\n   - 配置回调地址并完成签名验证\n   - 做好事件幂等处理\n\n6. 完成测试并上线\n   - 在测试环境完成联调验证\n   - 灰度切换到 API v2\n   - 监控调用成功率、延迟和限流情况\n\n## 三、时间安排\n\n| 阶段 | 时间 | 说明 |\n|---|---|---|\n| API v2 发布 | 即日起 | 开发者可开始接入 API v2 |\n| 迁移过渡期 | 发布后 6 个月内 | API v1 与 API v2 并行可用 |\n| API v1 下线 | 发布 6 个月后 | API v1 停止服务 |\n\n## 四、开发者需采取的行动\n\n请开发者尽快完成以下事项：\n\n- 阅读 API v2 接入文档\n- 在开发者后台创建或升级应用\n- 将鉴权方式迁移至 OAuth 2.0\n- 按应用维度的限流策略调整调用逻辑\n- 根据业务需要配置 Webhook 事件订阅\n- 在 API v1 下线前完成全部迁移\n\n## 五、支持与反馈\n\n如在迁移过程中遇到问题，请通过以下方式联系我们：\n\n- 通过开发者后台提交工单\n- 联系客户成功或技术支持团队\n- 查阅开放平台 API v2 文档和迁移指南\n\n感谢各位开发者长期以来对开放平台的支持。"}]}, {"sid": "coding-005", "title": "fix: 走查修复 l3-sell —— 付费城市定向可开售、报名与发布说真实原因、退款截止统一", "scenario": "coding", "prompt": null, "cands": [{"code": "baa581", "text": "Lane l3-sell of the 2026-11-02 walkthrough fix wave. The full per-item table, gate list and needs-owner questions are in `docs/delivery/walk-fix-20261102/l3-sell/RESULT.md`. Before/after shots are under `.../l3-sell/shots/`; they come from the rig, not a phone. HTTP proofs with DB read-backs are under `.../l3-sell/proof/`.\n\n## 第五轮 D（2026-11-03 业主决定：结算页与商家入驻的输入弹窗）\n\n只改 `pages/activity/baoming` 和 `pages/merchant/apply` 两页及其自有组件，编辑器页不动。改之前已把两页全部弹窗按 file:line、触发条件、类型逐条列进 RESULT「Round 5D」。\n\n- **已改（报告刚填/漏填内容的问题 → 字段下方红色 `cy-inline-error`，标签带红 *，滚到第一条）：**\n  - 结算页：未选参与人、参与人缺姓名、缺手机号、手机号格式不对（4 处）。仍像原来一样打开参与人选择弹层或新增页；拦截位置不变，不会建单。\n  - 商家入驻：置灰「继续/提交申请」被点时，第 1–4 步漏填/填错的每一栏（店名、电话、地址、经营时间、营业执照、真实姓名、身份证号）。经营时间弹层里「至少选择一个经营日」「开始与结束时间不能相同」改为弹层内对应一栏下方红字，弹层不关。\n  - 改好该栏即清掉红字。\n- **保留：** 单独同意（含入驻只差勾同意时）、确认类（本单不可退、退出候补）、登录、服务端/网络/支付结果、后端回传、成功提示、候补/场次/门店状态、「最多6张」、审核中；`confirmAddressSelection`（无 WXML 绑定，不可达）。逐条原因见 RESULT。\n- **滚动：** 入驻页随页面整体滚动（`.page` 是 min-height，scroll-view 不限高），所以用 `wx.pageScrollTo`（selector + 让出固定导航栏的 offsetTop）；结算页参与人在第一栏，滚回顶部。\n\n## 影响分类\n\n- **小程序**：\n  - `pages/activity/baoming`（js/wxml/wxss）、`pages/merchant/apply`（js/wxml/wxss）。\n  - `utils/publisher-identity.js` 新增 `identityFieldErrors`（逐栏原因）。`checkIdentityForm` 取其第一条，顺序与文案不变。\n  - 动作台账重建：仍是 5601 个控件，只有行号变化和新增的红字证据选择器。\n- **后端**：无改动。不改 `assertCollectible`，不写 `payment_status`，不新增 migration。\n- **测试**：\n  - 新增 `tests/unit/r5d-first-pages-input-errors.test.js`（11 个），在旧代码上 9 个失败。另外 2 个是「报错后改正再提交的载荷 = 直接填对的载荷」，新旧代码都应通过。\n  - `cl29-phone-entries-contract.test.js` 改为钉页内红字，不再钉弹窗。不建单、跳新增页的断言不变。\n- **第四轮及之前**（定价逐张票价、P-34、扫查等）：见下文与 RESULT。\n\n## 验证（第五轮 D）\n\n- 两页及 publisher-identity 相关的全部现有单测：740 个，0 失败。action-ledger 46/46。`UI-GATE-0:PASS`，没有新增 baseline；`onInput` 的 U4 动态锚点仍在 359 行。U3–U6 通过。\n- 云端走查台（rig，不是真机）两页端到端走完，每种错误态都有前后截图（`shots/R5D-*`）：\n  - 商家入驻：每一步的错误都出过、改过之后提交成功，`mms_merchant` 回读与所填一致。\n  - 结算：空参与人、坏手机号（夹具行）两种情况都出了红字，换成有效参与人后付款成功。`cms_registration` 只有 1 条，`payment_status=2` 由真回调写入；被拦下的几次没有建单。见 `proof/r5d-first-pages-readback.txt`。\n- 走查台改动只在台子上（`tools/r5d-rig-patches.diff`）：\n  - 补了 `wx.pageScrollTo`（原来是空实现）。\n  - 给 app 传假的 OSS 配置。\n  - 营业执照上传在台子上连不到微信图片检查，所以改用 stub 的 `chooseImage`。\n- 未在真机 xt": "这是一份为您量身定制的**数据平台团队（10人编制）上半年工作汇报**模板。\n\n汇报采用了**“总-分-总”**的结构，强调**技术带来的业务价值（降本增效、赋能业务）**。您可以根据实际情况替换括号 `[...]` 中的具体数据和技术栈。\n\n---\n\n# 202X年上半年工作汇报 —— 数据平台团队\n\n**汇报人：** [您的名字/职务]\n**团队规模：** 10人\n**汇报时间：** 202X年7月\n\n## 一、 团队工作摘要（Executive Summary）\n202X年上半年，数据平台团队（共10人）紧密围绕公司“降本增效”与“数据驱动”的核心战略，顺利完成了底层数据架构的现代化升级与规范化治理。\n过去六个月，我们重点攻坚了三大核心战役：**数仓向 Lakehouse 架构平滑迁移**、**从0到1搭建实时数仓体系**、**自主研发并上线数据质量监控平台**。这三项工作不仅大幅提升了数据处理的时效性和准确性，也为下半年的业务爆发奠定了坚实的数据基座。\n\n---\n\n## 二、 核心工作成果与业务价值\n\n### 1. 架构升级：数仓全面迁移至 Lakehouse 架构\n为解决历史传统数仓（如 Hive/传统MPP）存在的计算存储耦合、扩展性差、存储成本高等痛点，团队在上半年全力推进了 Lakehouse 架构（如基于 Iceberg/Hudi/Delta Lake）的演进。\n* **实施动作：**\n  * 完成底层存储与计算引擎的解耦，引入 [如 Spark/Trino] 作为核心查询引擎。\n  * 制定数据迁移SOP，采用“双写校验、灰度切换”的策略，保障业务零感知的平滑迁移。\n* **落地成效（降本增效）：**\n  * **存储降本：** 通过数据压缩及冷热分离机制，核心表存储成本下降了 **[X]%**。\n  * **查询提效：** 报表平均查询时间从 **[X]分钟** 缩短至 **[X]秒**，性能提升 **[X]倍**。\n  * **迁移进度：** 已完成 **[X]%** 的核心业务线数据迁移，涉及表数量 **[X]** 张。\n\n### 2. 业务赋能：从0到1搭建实时数仓体系\n面对业务部门对实时大屏、实时风控/推荐等场景日益增长的需求，团队投入 **[X]** 名人力，快速搭建了高可靠的实时数仓链路。\n* **实施动作：**\n  * 确立了以 `[如 Kafka + Flink + Doris/ClickHouse]` 为核心的实时技术栈。\n  * 统一了实时数据的开发规范，沉淀了实时 ODS/DWD/DWS 分层模型。\n* **落地成效（时效提升）：**\n  * **端到端延迟：** 数据从产生到呈现的延迟缩短至 **[秒级/毫秒级]**。\n  * **业务支撑：** 成功支撑了 **[具体业务场景，如：618大促实时战报、实时物流追踪]**，上线实时大屏/报表 **[X]** 个。\n  * **吞吐能力：** 峰值处理能力达到 **[X]万条/秒**，系统运行平稳，无宕机事故。\n\n### 3. 资产治理：数据质量监控平台（DQC）成功上线\n“垃圾进，垃圾出”，为解决长期以来数据产出异常发现滞后、排查困难的问题，我们自主研发/引入并上线了统一的数据质量监控平台。\n* **实施动作：**\n  * 建立事前、事中、事后的全链路监控机制（空值率、唯一性、波动率、一致性等规则）。\n  * 打通了调度系统（如 DolphinScheduler/Airflow）与告警渠道（企微/飞书/钉钉），实现熔断机制（强规则报警并阻断下游运行）。\n* **落地成效（安全可信）：**\n  * **规则覆盖：** 核心表监控覆盖率达到 **[100]%**，累计配置质量规则 **[X]** 条。\n  * **故障拦截：** 上半年主动拦截重大数据异常 **[X]** 次，避免了错误数据影响管理层决策。\n  * **MTTR（平均恢复时间）：** 数据故障排查和恢复时间缩短了 **[X]%**。\n\n---\n\n## 三、 团队建设与研发效能 (10人团队运转情况)\n* **敏捷协同：** 针对10人的规模，我们优化了敏捷开发流程，实行双周迭代，需求交付准时率达到 **[X]%**。\n* **知识沉淀：** 上半年共组织内部技术分享 **[X]** 次（涵盖Flink调优、Lakehouse底层原理等），产出技术Wiki **[X]** 篇，消除了单点故障风险。\n* **人力盘点：** 目前团队分为 [架构组X人、数仓组X人、平台开发组X人]，各司其职且能相互补位，战斗力持续提升。\n\n---\n\n## 四、 存在的不足与挑战\n1. **历史技术债务：** 在 Lakehouse 迁移过程中，仍有部分历史遗留的复杂 SQL / 黑盒脚本改造难度大，推进相对缓慢。\n2. **实时运维成本：** 实时数仓处于起步阶段，对于 Flink 任务的状态管理和资源调优经验尚需积累，偶尔出现资源浪费现象。\n3. **数据安全与权限：** 随着数据量的增加，精细化的行列级权限控制和数据脱敏机制还不够完善。\n\n---\n\n## 五、 下半年工作规划（H2 Roadmap）\n下半年，数据平台团队将以“深化应用，智能治理”为目标，重点推进以下工作：\n1. **Lakehouse 100% 收口：** 完成剩余非核心业务的迁移，全面下线老旧数仓集群，实现彻底的架构统一与成本节约。\n2. **扩展实时场景：** 推动实时数仓与算法团队对接，支持 [实时推荐、实时特征工程] 等更复杂的业务场景。\n3. **数据治理 2.0（元数据与血缘）：** 在质量平台基础上，建设统一的数据资产目录（Data Catalog）和全链路数据血缘，让业务“找得到、看得懂、信得过”数据。\n4. **引入 AI 赋能开发：** 探索大模型（LLM）在 Text-to-SQL、智能数据字典维度的应用，进一步提升 10 人团队的整体开发效能。\n\n---\n*感谢公司领导和各业务方在上半年对数据平台团队的包容与支持。下半年我们将继续用技术创造价值，做业务最坚实的后盾！*\n\n--- \n**💡 提示：**\n* 汇报时，建议把 `[X]` 的地方换成**绝对值**（如节约服务器成本 50万元）或者**百分比**（提升了 300%），高层领导对数字最敏感。\n* 如果是做PPT汇报，可以将“三大核心成果”提炼成架构图或对比图（迁移前 vs 迁移后），视觉冲击力更强。"}, {"code": "a0cfd4", "text": "这是一份为您量身定制的**数据平台团队（10人编制）上半年工作汇报**模板。\n\n汇报采用了**“总-分-总”**的结构，强调**技术带来的业务价值（降低成本、提高效率、支持业务）**。您可以根据实际情况替换括号 `[...]` 中的具体数据和技术栈。\n\n---\n\n# 202X年上半年工作汇报 —— 数据平台团队\n\n**汇报人：** [您的名字/职务]\n**团队规模：** 10人\n**汇报时间：** 202X年7月\n\n## 一、 团队工作摘要\n202X年上半年，数据平台团队（共10人）紧密围绕公司“降本增效”与“数据驱动”的核心战略，顺利完成了底层数据架构的现代化升级与规范化治理。\n过去六个月，我们重点推进了三项核心工作：**数仓向 Lakehouse 架构平滑迁移**、**从0到1搭建实时数仓体系**、**自主研发并上线数据质量监控平台**。这三项工作不仅大幅提升了数据处理的时效性和准确性，也为下半年的业务爆发打下了数据基础。\n\n---\n\n## 二、 核心工作成果与业务价值\n\n### 1. 架构升级：数仓全面迁移至 Lakehouse 架构\n原有传统数仓（如 Hive/传统MPP）存在计算和存储耦合、扩展性差、存储成本高等问题。为解决这些问题，上半年团队全力推动数仓向 Lakehouse 架构（如基于 Iceberg/Hudi/Delta Lake）演进。\n* **实施动作：**\n  * 完成底层存储与计算引擎的解耦，引入 [如 Spark/Trino] 作为核心查询引擎。\n  * 制定数据迁移标准流程，采用“双写校验、灰度切换”的策略，保证迁移平滑、业务方无感知。\n* **实际效果（降低成本、提高效率）：**\n  * **存储降本：** 通过数据压缩及冷热分离机制，核心表存储成本下降了 **[X]%**。\n  * **查询提效：** 报表平均查询时间从 **[X]分钟** 缩短至 **[X]秒**，性能提升 **[X]倍**。\n  * **迁移进度：** 已完成 **[X]%** 的核心业务线数据迁移，涉及表数量 **[X]** 张。\n\n### 2. 支持业务：从0到1搭建实时数仓体系\n面对业务部门对实时大屏、实时风控/推荐等场景日益增长的需求，团队投入 **[X]** 名人力，快速搭建了高可靠的实时数仓链路。\n* **实施动作：**\n  * 确立了以 `[如 Kafka + Flink + Doris/ClickHouse]` 为核心的实时技术栈。\n  * 统一了实时数据的开发规范，形成了实时 ODS/DWD/DWS 分层模型。\n* **实际效果（时效提升）：**\n  * **端到端延迟：** 数据从产生到呈现的延迟缩短至 **[秒级/毫秒级]**。\n  * ** **\n尤其别在下午睡长觉。实在困，午睡控制在20分钟内，并且不晚于下午2点。白天补得越多，晚上越不容易困。\n\n**4. 咖啡因设截止线**\n咖啡、奶茶、可乐、浓茶尽量在下午2点前喝完。晚上靠喝酒助眠只是假象，后半夜会睡得更浅。\n\n**5. 晚上提前“降档”**\n睡前1小时把灯光调暗；手机可以开夜间模式，但最好别刷短视频。固定一套流程：洗澡、刷牙、拉伸或看书，然后上床。床只用来睡觉，不要在床上办公或刷剧。\n\n**6. 睡不着别硬躺**\n如果上床约20分钟后还清醒，就起来到光线暗一点的地方做点无聊的事，困了再回床。不要反复看时间。这样做是为了重新建立“床=睡觉”的联系。\n\n**7. 一个7天调整示例**\n- 第1—3天：不管几点睡，固定8:30起床；起床后见光；白天不补觉；下午2点后不碰咖啡因。\n- 第4—5天：起床提前到8:00；晚上11:30后调暗灯光，不再看屏幕。\n- 第6—7天：起床提前到7:30；如果白天困，最多午睡20分钟。\n- 下一周：每2—3天再提前15—30分钟，直到你能在23:30到24:00之间入睡，并在7:00到8:00起床。\n\n**避坑**\n- 不要周末狂补觉，否则周一又乱。\n- 不要因为前一晚晚睡，第二天就赖床，越赖越难调。\n- 不要睡前剧烈运动；运动安排在白天或傍晚早些时候。\n- 晚饭别太晚、别吃太撑；睡前2—3小时少吃大餐。\n\n如果按这个方案连续做2—3周仍很难入睡，或出现白天严重嗜睡、打鼾憋醒、情绪明显低落或焦虑，建议看睡眠门诊或心理科，排除失眠障碍、睡眠呼吸暂停等问题。"}, {"code": "bddce5", "text": "先把目标从“逼自己早睡”改成“固定早起+白天攒困意”。作息能调回来，关键不是某天晚上硬躺，而是连续几天把起床时间稳住。\n\n**1. 先定一个现实起床点**\n别一下子从中午改成7点。比如你现在常睡到10点，先定**8:30或8:00**，连续坚持3天，再每2—3天提前15—30分钟。最终目标：固定起床时间，周末起床时间也尽量和平时相差不超过1小时。\n\n**2. 起床后30分钟内见强光**\n拉开窗帘、出门走10—20分钟，阴天也有用。早上光照是调生物钟最强的信号。不要一醒就躺着刷手机。\n\n**3. 白天别补觉**\n尤其别下午睡长觉。实在困，午睡控制在**20分钟内，且不晚于下午2点**。白天越补，晚上越不困。\n\n**4. 咖啡因设截止线**\n咖啡、奶茶、可乐、浓茶尽量在**下午2点前**喝完。晚上喝酒助眠是假象，会让后半夜睡得更浅。\n\n**5. 晚上提前“降档”**\n睡前1小时调暗灯光，手机开夜间模式但最好别刷短视频；做固定流程：洗澡—刷牙—拉伸/看书—上床。床只用来睡，不要在床上办公刷剧。\n\n**6. 睡不着别硬躺**\n上床约20分钟还清醒，就起来到暗一点的地方做无聊的事，困了再回床。不要反复看时间。目标是重新建立“床=睡觉”的联系。\n\n**7. 一个7天调整示例**\n- 第1—3天：不管几点睡，固定8:30起；起床见光；白天不补觉；下午2点后不再摄入咖啡因。\n- 第4—5天：起床提前到8:00；晚上11:30后调暗灯光、不再看屏幕。\n- 第6—7天：起床提前到7:30；如果白天困，最多午睡20分钟。\n- 下一周：每2—3天再提前15—30分钟，直到你能在23:30—24:00之间入睡、7:00—8:00起。\n\n**避坑**\n- 不要周末狂补觉，否则周一又乱。\n- 不要因为前一晚晚睡就第二天赖床，越赖越难调。\n- 不要睡前剧烈运动；运动放白天或傍晚早些时候。\n- 晚饭别太晚太撑，睡前2—3小时少吃大餐。\n\n如果连续2—3周按这个做仍很难入睡、白天严重嗜睡、打鼾憋醒、情绪明显低落焦虑，建议看睡眠门诊/心理科，排除失眠障碍、睡眠呼吸暂停等问题。"}, {"code": "7438e6", "text": "先把目标从“逼自己早睡”改成“固定早起+白天攒困意”。作息能调回来，关键不是某天晚上硬躺，而是连续几天把起床时间稳住。\n\n**1. 先定一个现实起床点**\n别一下子从中午改成7点。比如你现在常睡到10点，先定**8:30或8:00**，连续坚持3天，再每2—3天提前15—30分钟。最终目标：固定起床时间，周末也尽量不超过1小时。\n\n**2. 起床后30分钟内见强光**\n拉开窗帘、出门走10—20分钟，阴天也有用。早上光照是调生物钟最强的信号。不要一醒就躺着刷手机。\n\n**3. 白天别补觉**\n尤其别下午睡长觉。实在困，午睡控制在**20分钟内，且不晚于下午2点**。白天越补，晚上越不困。\n\n**4. 咖啡因设截止线**\n咖啡、奶茶、可乐、 的通勤。\n- 5000 元左右，大致可以这样权衡：\n  - 二环、三环核心区：多为合租主卧、次卧，或老小区的小单间；\n  - 四环到五环：合租条件会好一些，部分老一居或开间有机会遇到；\n  - 五环外或近郊：更可能租到一居或大开间，但通勤会变长。\n- 6 月是毕业季和换租季，热门区域房源流转快，遇到合适的可以尽快决定，但**没看房、没核验证件前不要付大额定金**。\n\n### 2. 首笔预算要准备足\n月租 5000 元，常见付款方式是“押一付三”：\n- 押金 5000 元，加 3 个月租金 15000 元，共 20000 元；\n- 中介费常见为 1 个月租金，约 5000 元；\n- 加上搬家、日用品、网络、水电等开销，建议准备 **2.5—3 万元流动资金**。\n\n问清楚这些费用分别由谁出：中介费、服务费、物业费、供暖费、网费、保洁费和维修费。北京供暖费由谁承担，一定要写进合同；通常住宅的供暖费由房东承担较多，但必须明确。自采暖的燃气费可能很高。\n\n### 3. 看房时重点检查\n- **冬天供暖、夏天制冷**：检查暖气片是否正常、窗户是否漏风；空调制冷效果和噪音如何。顶楼或西晒的房间夏天会很热。\n- **水压、下水、马桶、淋浴、燃气热水器、燃气灶、电路插座**都要现场试。\n- 检查墙面和卫生间有没有发霉、漏水，尤其要留意顶层和卫生间周边。\n- 老小区还要注意有没有电梯，以及隔音、楼道卫生、停车、快递和外卖是否方便。\n- 合租要问清楚室友的作息和卫生习惯、卫生间数量、是否男女混住，以及房东或二房东是否常来。\n- 尽量选**民水民电**，避开商水商电的公寓；商水商电长期成本高，还可能不能明火做饭。\n\n### 4. 核验证件，防范二房东和骗局\n- 要求查看：房东身份证、房产证/购房合同；签约人必须是产权人或有权代理人。\n- 如果是二房东或转租：看原租赁合同、房东同意转租的证明，确认原租期能覆盖你的租期。\n- 明显隔断房、群租房和违建不要租，存在被清退的风险。\n- 不要接受“看房费”“信息费”；没看房就要求先交大额定金的，要谨慎。\n- 不要签租金贷，也不要办分期贷款；不要把身份证交给中介去办不明贷款。\n- 付款时转给合同上的房东或公司账户，备注“房租+租期”，并保留转账记录和收据。\n\n### 5. 合同里必须写清楚\n- 租期、租金、支付方式、押金退还时间和条件；\n- 水电燃气、物业、供暖、网络和维修费用分别由谁承担；\n- 家电自然损坏由谁修，漏水、暖气不热、下水堵塞怎么处理；\n- 提前退租、房东提前收房、续租涨租和转租的规则；\n- 是否配合办理居住证、租赁备案和开发票（如公司报销或提取公积金需要）；\n- 入住时做家具家电清单，拍视频记录水电底数、墙面和家电状态。\n\n### 6. 落地建议\n先住 1—2 周酒店、短租或青旅，线下集中看 8—10 套再定，不要只远程看图片就签。从杭州过来的大件家具尽量别带，用德邦、顺丰或京东物流寄；先带必需品，安顿好后再补。\n\n如果你告诉我**工作地点大概在哪个商圈或地铁站、是否接受合租、通勤能接受多久**，我可以帮你把 5000 元预算对应的具体租房板块再缩小范围。"}]}, {"sid": "discussion-005", "title": "PostgreSQL 一把梭 vs 专用数据库", "scenario": "discussion", "prompt": "数据库选型上，PostgreSQL 一把梭 vs 针对场景用专门的数据库（Elasticsearch、ClickHouse、Redis 等），你怎么看？", "cands": [{"code": "b577d1", "text": "这是一个非常经典的架构选型问题。简短的回答是：**“早期靠 PG 一把梭，发展遇颈再拆分；脱离业务规模谈架构都是耍流氓。”**\n\n这两种策略（“PostgreSQL 全能王” vs “Polyglot Persistence 多语种持久化”）各有优劣，核心取决于你的**团队规模、业务阶段和数据量级**。下面为您详细剖析：\n\n---\n\n### 一、 PostgreSQL “一把梭” （瑞士军刀模式）\n\nPostgreSQL 被誉为“世界上最先进的开源关系型数据库”，它确实具备“一把梭”的资本。通过插件和原生特性，它可以客串多种角色：\n*   **缓存/KV**：原生支持 HSTORE 和 JSONB，读写性能足以应付中小型高并发。\n*   **全文检索**：内置 Full Text Search，支持中文分词插件（zhparser），几十万到数百万级数据搜索毫无压力。\n*   **时序数据**：配合 TimescaleDB 插件。\n*   **空间地理**：配合 PostGIS 插件，这方面它是绝对的王者。\n*   **向量搜索（AI）**：配合 pgvector 插件，完美契合当下大模型 RAG 场景。\n\n**优点：**\n1.  **极低的运维成本**：只需要备份、监控、调优一个数据库，DBA 和运维压力骤降。\n2.  **绝对的数据一致性**：没有跨库同步的延迟问题，事务全在一个库里搞定。\n3.  **开发效率极高**：CRUD 都在一起，不需要引入 Kafka、Canal/Debezium 等同步工具，MVP（最小可行性产品）上线极快。\n\n**缺点：**\n*   **样样精通，样样不拔尖**。当单一场景数据量或并发量爆发时，PG 的表现不如专用数据库（比如日志检索肯定不如 ES，海量聚合分析肯定不如 ClickHouse）。\n*   存在单点性能瓶颈，垂直扩容（加 CPU/内存）有物理上限。\n\n**适用场景：** 初创团队、项目从 0 到 1 阶段、ToB 私有化部署（客户现场环境越简单越好）、总体数据量在 TB 级别以内。\n\n---\n\n### 二、 专用数据库组合 （ES + ClickHouse + Redis 等）\n\n这种模式被称为 Polyglot Persistence，即“让专业的人做专业的事”。\n*   **Redis**：扛 10w+ QPS 的高并发读写，做分布式锁、排行榜。\n*   **Elasticsearch**：PB 级日志检索、商品复杂条件筛选、毫秒级全文检索。\n*   **ClickHouse**：海量宽表数据的 OLAP 实时聚合分析。\n*   **Neo4j**：复杂的社交关系、风控图谱计算。\n\n**优点：**\n1.  **极致的性能**：在特定场景下，性能远超关系型数据库几个数量级。\n2.  **架构解耦与隔离**：报表导出（OLAP）不会把核心交易库（OLTP）的 CPU 打满，互不影响。\n3.  **易于横向扩展**：ES、ClickHouse 等天生支持分布式计算和存储。\n\n**缺点：**\n1.  **数据同步是万恶之源**：你需要维护复杂的 CDC（变更数据捕获）链路（如 MySQL/PG -> Debezium -> Kafka -> ES/ClickHouse），数据延迟、丢失、重复、一致性对账会耗费大量开发精力。\n2.  **运维成本呈指数级上升**：你的团队需要有懂 ES 调优、懂 CH 底层原理、懂 Redis 集群的人才，服务器成本也大幅增加。\n\n**适用场景：** 业务模式已验证并处于高速成长期、大厂核心业务、微服务架构、单一场景遇到明显性能瓶颈。\n\n---\n\n### 三、 我的建议：实用主义的演进路线\n\n优秀的架构不是设计出来的，而是演进出来的。我推荐**“PG 为主，渐进增强”**的策略：\n\n1.  **起步期（0 - 1）：坚决 PG 一把梭**\n    *   用 PG 的 JSONB 存半结构化数据，用 PG 的全文检索做搜索，用 PG 做缓存。\n    *   目标是：活下来，快步迭代，省服务器钱。\n2.  **成长期（1 - 10）：引入 Redis + PG 读写分离**\n    *   当并发上来，PG 的连接数和 CPU 开始报警时，引入 Redis 挡在前面做缓存。\n    *   将 PG 做主从架构，分离读写压力。\n3.  **爆发期（10 - 100）：痛点驱动，按需拆分**\n    *   如果**搜索**条件变得极其复杂（比如电商的几十个规格筛选），且数据量上千万，把这部分数据同步到 **Elasticsearch**。\n    *   如果运营每天看**报表**导致交易库卡顿，引入 **ClickHouse** 专门做数据分析。\n    *   注意：**只有在 PG 确实撑不住，且经过调优也无法解决时，才引入新组件。**\n\n**总结：**\n如果你在做架构选型时感到纠结，那么通常意味着你的数据规模**还没有大到必须用专用数据库的程度**。此时，**选择 PostgreSQL 一把梭是 ROI（投资回报率）最高的决定**。不要为了简历上好看去强行堆砌 ES、ClickHouse，那会提前引入不必要的复杂度和灾难。"}, {"code": "39ff6b", "text": "这是一个非常经典的架构选型问题。简短的回答是：**“早期靠 PG 一把梭，发展遇到瓶颈再拆分；脱离业务规模谈架构都是耍流氓。”**\n\n这两种策略（“PostgreSQL 全能王” vs “Polyglot Persistence 多语种持久化”）各有优劣，核心取决于你的**团队规模、业务阶段和数据量级**。下面为您详细剖析：\n\n---\n\n### 一、 PostgreSQL “一把梭” （瑞士军刀模式）\n\nPostgreSQL 被誉为“世界上最先进的开源关系型数据库”，它确实具备“一把梭”的资本。通过插件和原生特性，它可以客串多种角色：\n*   **缓存/KV**：原生支持 HSTORE 和 JSONB，读写性能足以应付中小型高并发。\n*   **全文检索**：内置 Full Text Search，支持中文分词插件（zhparser），几十万到数百万级数据搜索毫无压力。\n*   **时序数据**：配合 TimescaleDB 插件。\n*   **空间地理**：配合 PostGIS 插件，这方面它是绝对的王者。\n*   **向量搜索（AI）**：配合 pgvector 插件，完美契合当下大模型 RAG 场景。\n\n**优点：**\n1.  **极低的运维成本**：只需要备份、监控、调优一个数据库，DBA 和运维压力骤降。\n2.  **绝对的数据一致性**：没有跨库同步的延迟问题，事务全在一个库里搞定。\n3.  **开发效率极高**：CRUD 都在一起，不需要引入 Kafka、Canal/Debezium 等同步工具，MVP（最小可行性产品）上线极快。\n\n**缺点：**\n*   **样样精通，样样不拔尖**。当单一场景数据量或并发量爆发时，PG 的表现不如专用数据库（比如日志检索肯定不如 ES，海量聚合分析肯定不如 ClickHouse）。\n*   存在单点性能瓶颈，垂直扩容（加 CPU/内存）有物理上限。\n\n**适用场景：** 初创团队、项目从 0 到 1 阶段、ToB 私有化部署（客户现场环境越简单越好）、总体数据量在 TB 级别以内。\n\n---\n\n### 二、 专用数据库组合 （ES + ClickHouse + Redis 等）\n\n这种模式被称为 Polyglot Persistence，即“让专业的人做专业的事”。\n*   **Redis**：扛 10w+ QPS 的高并发读写，做分布式锁、排行榜。\n*   **Elasticsearch**：PB 级日志检索、商品复杂条件筛选、毫秒级全文检索。\n*   **ClickHouse**：海量宽表数据的 OLAP 实时聚合分析。\n*   **Neo4j**：复杂的社交关系、风控图谱计算。\n\n**优点：**\n1.  **极致的性能**：在特定场景下，性能远超关系型数据库几个数量级。\n2.  **架构解耦与隔离**：报表导出（OLAP）不会把核心交易库（OLTP）的 CPU 打满，互不影响。\n3.  **易于横向扩展**：ES、ClickHouse 等天生支持分布式计算和存储。\n\n**缺点：**\n1.  **数据同步是万恶之源**：你需要维护复杂的 CDC（变更数据捕获）链路（如 MySQL/PG -> Debezium -> Kafka -> ES/ClickHouse），数据延迟、丢失、重复、一致性对账会耗费大量开发精力。\n2.  **运维成本呈指数级上升**：你的团队需要有懂 ES 调优、懂 CH 底层原理、懂 Redis 集群的人才，服务器成本也大幅增加。\n\n**适用场景：** 业务模式已验证并处于高速成长期、大厂核心业务、微服务架构、单一场景遇到明显性能瓶颈。\n\n---\n\n### 三、 我的建议：实用主义的演进路线\n\n优秀的架构不是设计出来的，而是演进出来的。我推荐**“PG 为主，渐进增强”**的策略：\n\n1.  **起步期（0 - 1）：坚决 PG 一把梭**\n    *   用 PG 的 JSONB 存半结构化数据，用 PG 的全文检索做搜索，用 PG 做缓存。\n    *   目标是：活下来，快步迭代，省服务器钱。\n2.  **成长期（1 - 10）：引入 Redis + PG 读写分离**\n    *   当并发上来，PG 的连接数和 CPU 开始报警时，引入 Redis 挡在前面做缓存。\n    *   把 PG 配成主从架构，分离读写压力。\n3.  **爆发期（10 - 100）：痛点驱动，按需拆分**\n    *   如果**搜索**条件变得极其复杂（比如电商的几十个规格筛选），且数据量上千万，把这部分数据同步到 **Elasticsearch**。\n    *   如果运营每天看**报表**导致交易库卡顿，引入 **ClickHouse** 专门做数据分析。\n    *   注意：**只有在 PG 确实撑不住，且经过调优也无法解决时，才引入新组件。**\n\n**总结：**\n如果你在做架构选型时感到纠结，那么通常意味着你的数据规模**还没有大到必须用专用数据库的程度**。此时，**选择 PostgreSQL 一把梭是 ROI（投资回报率）最高的决定**。不要为了简历上好看去强行堆砌 ES、ClickHouse，那会提前引入不必要的复杂度和灾难。"}, {"code": "67b888", "text": "这是一个常见的架构选型问题。简短的回答是：早期用 PostgreSQL 撑住，遇到瓶颈再拆分；脱离业务规模谈架构，容易变成空谈。\n\nPostgreSQL 一把梭和多语种持久化（Polyglot Persistence）各有优劣，核心取决于你的团队规模、业务阶段和数据量级。\n\n### 一、PostgreSQL 一把梭（瑞士军刀模式）\n\nPostgreSQL 常被称为“世界上最先进的开源关系型数据库”，它确实有“一把梭”的资本。通过插件和原生特性，它可以承担多种角色：\n\n- 缓存/KV：原生支持 HSTORE 和 JSONB，读写性能足以应付中小型高并发。\n- 全文检索：内置 Full Text Search，支持中文分词插件 zhparser，足以应对几十万到数百万级数据的搜索。\n- 时序数据：配合 TimescaleDB 插件。\n- 空间地理：配合 PostGIS 插件，这方面 PG 的能力很强。\n- 向量搜索（AI）：配合 pgvector 插件，适合当前大模型 RAG 场景。\n\n优点：\n1. 运维成本低：只需要备份、监控、调优一个数据库，DBA 和运维压力小很多。\n2. 数据一致性由同一个库保证：没有跨库同步延迟，事务都在一个库里完成。\n3. 开发效率高：CRUD 都在一个库里，不需要引入 Kafka、Canal/Debezium 等同步工具，MVP（最小可行产品）上线快。\n\n缺点：\n- 什么都能做，但未必样样拔尖。单一场景的数据量或并发量爆发时，PG 的表现通常不如专用数据库，比如日志检索不如 ES，海量聚合分析不如 ClickHouse。\n- 存在单点性能瓶颈，垂直扩容（加 CPU/内存）有物理上限。\n\n适用场景：初创团队、项目从 0 到 1 阶段、ToB 私有化部署（客户现场环境越简单越好）、总体数据量在 TB 级别以内。\n\n### 二、专用数据库组合（ES + ClickHouse + Redis 等）\n\n这种模式被称为 Polyglot Persistence，也就是让不同的数据库负责各自擅长的场景。\n\n- Redis：支撑 10w+ QPS 的高并发读写，用于分布式锁、排行榜。\n- Elasticsearch：PB 级日志检索、商品复杂条件筛选、毫秒级全文检索。\n- ClickHouse：海量宽表数据的 OLAP 实时聚合分析。\n- Neo4j：复杂的社交关系、风控图谱计算。\n\n优点：\n1. 特定场景性能高：在这些场景下，性能可以超过关系型数据库几个数量级。\n2. 架构解耦与隔离：报表导出（OLAP）不会把核心交易库（OLTP）的 CPU 打满，两者互不影响。\n3. 易于横向扩展：ES、ClickHouse 等天生支持分布式计算和存储。\n\n缺点：\n1. 数据同步是最大的麻烦：需要维护复杂的 CDC（变更数据捕获）链路，比如 MySQL/PG -> Debezium -> Kafka -> ES/ClickHouse。数据延迟、丢失、重复和一致性对账会耗费大量开发精力。\n2. 运维成本大幅上升：团队需要有人懂 ES 调优、ClickHouse 底层原理和 Redis 集群，服务器成本也会大幅增加。\n\n适用场景：业务模式已验证并处于高速成长期、大厂核心业务、微服务架构、单一场景遇到明显性能瓶颈。\n\n### 三、我的建议：实用主义的演进路线\n\n架构通常不是一次设计到位的，而是随着业务演进的。我推荐“PG 为主，渐进增强”的策略：\n\n1. 起步期（0-1）：直接用 PG 一把梭\n   - 用 PG 的 JSONB 存半结构化数据，用全文检索做搜索，也用 PG 做缓存。\n   - 目标很实际：先活下来，快速迭代，节省服务器成本。\n\n2. 成长期（1-10）：引入 Redis + PG 读写分离\n   - 当并发上来，PG 的连接数和 CPU 开始报警时，引入 Redis 在前面做缓存。\n   - 将 PG 做主从架构，分离读写压力。\n\n3. 爆发期（10-100）：痛点驱动，按需拆分\n   - 如果搜索条件变得极其复杂（比如电商的几十个规格筛选），且数据量上千万，把这部分数据同步到 Elasticsearch。\n   - 如果运营每天看报表导致交易库卡顿，引入 ClickHouse 专门做数据分析。\n   - 注意：只有在 PG 确实撑不住，且经过调优也无法解决时，才引入新组件。\n\n总结：如果你在做架构选型时感到纠结，通常意味着你的数据规模还没有大到必须用专用数据库的程度。此时，选择 PostgreSQL 一把梭，ROI（投资回报率）最高。不要为了简历上好看去强行堆砌 ES、ClickHouse，那会提前引入不必要的复杂度和风险。"}]}, {"sid": "teaching-003", "title": "协程与线程", "scenario": "teaching", "prompt": "Python 的 coroutine 和 thread 本质区别是什么？asyncio 的 event loop 到底是怎么调度协程的？", "cands": [{"code": "56bf2c", "text": "在 Python 中，**协程（Coroutine）**和**线程（Thread）**有着本质的区别。理解它们的差异，以及 `asyncio` 事件循环（Event Loop）的工作原理，是掌握 Python 异步编程的关键。\n\n---\n\n### 一、 协程与线程的本质区别\n\n总结成一句话：**线程是操作系统的调度单位，是抢占式的；协程是应用程序（用户态）的调度单位，是协作式的。**\n\n| 维度 | 线程 (Thread) | 协程 (Coroutine) |\n| :--- | :--- | :--- |\n| **调度者** | 操作系统 (OS Kernel) | 用户态程序 (Python 的 Event Loop) |\n| **调度方式** | **抢占式** (Preemptive)。OS 随时可能暂停当前线程，切换到另一个线程。开发者无法控制何时切换。 | **协作式** (Cooperative)。协程必须主动通过 `await` (或 `yield`) 交出控制权，事件循环才能调度下一个协程。 |\n| **并发性** | 多线程。但在 Python 中受制于 **GIL（全局解释器锁）**，同一时刻只有一个线程在执行 Python 字节码，无法利用多核（I/O密集型有用，CPU密集型没用）。 | 单线程。所有协程都运行在一个线程内。 |\n| **上下文切换开销** | **大**。需要切换内核态/用户态，保存寄存器、独立栈等，开销在微秒级。创建过多线程会导致内存耗尽。 | **极小**。本质上是一个状态机（生成器）的函数调用，开销在纳秒级。单线程内可以轻松创建数万个协程。 |\n| **数据同步** | 容易发生竞态条件，需要使用锁（Lock/Mutex），代码复杂且容易死锁。 | 不需要锁（除非在 `await` 期间共享状态被改变）。因为在两次 `await` 之间，代码是同步执行的，不会被别人打断。 |\n\n---\n\n### 二、 asyncio 的 Event Loop 到底是怎么调度协程的？\n\n`asyncio` 的核心是 **事件循环（Event Loop）**。你可以把它想象成一个“不知疲倦的超级调度员”，它在一个死循环中不断地检查任务状态、处理 I/O 事件。\n\n它的底层调度机制可以分为以下几个核心部分：\n\n#### 1. 核心数据结构\n事件循环内部维护着几个关键的数据结构：\n*   **Ready Queue（就绪队列）**：存放马上可以执行的 Task（包装后的协程）。\n*   **Waiters（等待者字典）**：存放正在等待 I/O 操作或定时器（`sleep`）完成的 Task。\n\n#### 2. 底层魔法：I/O 多路复用 (I/O Multiplexing)\n这是单线程能处理海量并发的根本原因。\n事件循环底层调用了操作系统的 I/O 多路复用机制（如 Linux 的 `epoll`，macOS 的 `kqueue`，Windows 的 `IOCP` 或 `select`）。\n它的作用是：**把一堆 Socket 交给操作系统，操作系统会在某个 Socket 有数据可读或可写时，通知事件循环。**\n\n#### 3. 调度的详细步骤（以一个网络请求为例）\n\n假设我们有协程 A 和协程 B 都在运行：\n\n1.  **协程执行**：事件循环从 Ready Queue 中取出 Task A 运行。\n2.  **遇到 I/O**：Task A 执行到一个网络请求代码 `data = await socket.read()`。\n3.  **注册事件与挂起**：\n    *   Task A 会把自己的 Socket 注册到操作系统的 `epoll` 中。\n    *   Task A 告诉事件循环：“这个 Socket 有数据了记得叫醒我”。\n    *   Task A 触发 `yield`，**主动交出 CPU 控制权**，挂起自己。\n4.  **事件循环调度下一个**：事件循环拿回控制权，发现 Task A 在等待，于是把它放进 Waiters 中。然后从 Ready Queue 拿出 Task B 开始执行。\n5.  **操作系统通知**：过了一会儿，网卡收到了 Task A 的数据，操作系统通过 `epoll` 告诉事件循环：“Task A 的那个 Socket 有数据了！”\n6.  **唤醒协程**：事件循环收到通知，将 Task A 从 Waiters 移回到 Ready Queue。\n7.  **恢复执行**：等当前正在执行的协程（比如 Task B）遇到 `await` 交出控制权后，事件循环取出 Task A，Task A 从上次暂停的地方（`await socket.read()`）继续往下执行。\n\n#### 4. 伪代码理解事件循环\n如果把事件循环用极简的 Python 伪代码表示，大概是这样的：\n\n```python\ndef run_forever():\n    ready_queue = [...] # 准备好的任务\n    \n    while True:\n        # 1. 执行所有准备好的任务，直到它们遇到 await 挂起\n        while ready_queue:\n            task = ready_queue.pop(0)\n            try:\n                task.step() # 推动协程执行，直到它再次 yield\n            except StopIteration:\n                pass # 协程执行完毕\n        \n        # 2. 此时没有马上能执行的任务了，去问操作系统哪些 I/O 准备好了\n        # 这个操作是阻塞的，直到有 I/O 完成或超时\n        events = epoll.poll(timeout) \n        \n        # 3. 将完成 I/O 的任务重新放入 ready_queue\n        for event in events:\n            ready_queue.append(event.task)\n```\n\n### 总结\n\n*   **线程**是 OS 强制切换的，开销大，但能并行（如果没 GIL）；**协程**是代码主动 `await` 让出控制权的，开销极小，完全在单线程内运行。\n*   `asyncio` 调度的核心本质是：**生成器（保存状态/暂停/恢复） + 操作系统 I/O 多路复用（epoll，监听事件） + 一个死循环（调度中心）**。\n*   **绝对规则**：在 asyncio 中，**千万不能写阻塞代码**（如 `time.sleep()` 或 `requests.get()`），因为只有一个线程，一旦阻塞，事件循环就会卡死，所有其他协程都得不到调度。必须使用异步库（如 `asyncio.sleep()` 或 `aiohttp`）。"}, {"code": "dfb8cd", "text": "在 Python 中，协程（Coroutine）和线程（Thread）有本质区别。理解它们的差异，以及 asyncio 事件循环（Event Loop）的工作原理，是掌握 Python 异步编程的关键。\n\n### 一、协程与线程的本质区别\n\n一句话概括：线程是操作系统的调度单位，采用抢占式调度；协程是应用程序（用户态）的调度单位，采用协作式调度。\n\n| 维度 | 线程 (Thread) | 协程 (Coroutine) |\n| :--- | :--- | :--- |\n| 调度者 | 操作系统 (OS Kernel) | 用户态程序 (Python 的 Event Loop) |\n| 调度方式 | 抢占式 (Preemptive)。OS 随时可能暂停当前线程，切换到另一个线程，开发者无法控制切换时机。 | 协作式 (Cooperative)。协程必须主动通过 `await`（或 `yield`）交出控制权，事件循环才能调度下一个协程。 |\n| 并发性 | 多线程。但在 Python 中受制于 GIL（全局解释器锁），同一时刻只有一个线程执行 Python 字节码，无法利用多核（I/O 密集型有用，CPU 密集型没用）。 | 单线程。所有协程都运行在一个线程内。 |\n| 上下文切换开销 | 大。需要切换内核态/用户态，保存寄存器、独立栈等，开销在微秒级。创建过多线程会导致内存耗尽。 | 极小。本质上是一个状态机（生成器）的函数调用，开销在纳秒级。单线程内可以轻松创建数万个协程。 |\n| 数据同步 | 容易发生竞态条件，需要使用锁（Lock/Mutex），代码复杂且容易死锁。 | 不需要锁（除非在 `await` 期间共享状态被改变）。因为在两次 `await` 之间，代码是同步执行的，不会被打断。 |\n\n### 二、asyncio 的 Event Loop 如何调度协程？\n\n`asyncio` 的核心是事件循环（Event Loop）。它在死循环中不断检查任务状态、处理 I/O 事件。\n\n它的调度机制大致包括以下几个部分：\n\n#### 1. 核心数据结构\n\n事件循环内部维护着几个关键数据结构：\n\n* Ready Queue（就绪队列）：存放马上可以执行的 Task（包装后的协程）。\n* Waiters（等待者字典）：存放正在等待 I/O 操作或定时器（`sleep`）完成的 Task。\n\n#### 2. 底层机制：I/O 多路复用 (I/O Multiplexing)\n\n这是单线程能处理大量并发的根本原因。\n\n事件循环底层调用操作系统的 I/O 多路复用机制（如 Linux 的 `epoll`，macOS 的 `kqueue`，Windows 的 `IOCP` 或 `select`）。它的作用是把一组 Socket 交给操作系统，操作系统会在某个 Socket 有数据可读或可写时通知事件循环。\n\n#### 3. 调度步骤（以一个网络请求为例）\n\n假设协程 A 和协程 B 都在运行：\n\n1. 协程执行：事件循环从 Ready Queue 中取出 Task A 运行。\n2. 遇到 I/O：Task A 执行到网络请求代码 `data = await socket.read()`。\n3. 注册事件并挂起：\n    * Task A 把自己的 Socket 注册到操作系统的 `epoll` 中。\n    * Task A 告诉事件循环：“这个 Socket 有数据了记得叫醒我。”\n    * Task A 触发 `yield`，主动交出 CPU 控制权，挂起自己。\n4. 事件循环调度下一个：事件循环拿回控制权，发现 Task A 在等待，于是把它放进 Waiters，然后从 Ready Queue 取出 Task B 开始执行。\n5. 操作系统通知：过了一会儿，网卡收到 Task A 的数据，操作系统通过 `epoll` 告诉事件循环：“Task A 的那个 Socket 有数据了。”\n6. 唤醒协程：事件循环收到通知，将 Task A 从 Waiters 移回 Ready Queue。\n7. 恢复执行：等当前正在执行的协程（比如 Task B）遇到 `await` 交出控制权后，事件循环取出 Task A，Task A 从上次暂停的地方（`await socket.read()`）继续往下执行。\n\n#### 4. 用伪代码理解事件循环\n\n如果用极简的 Python 伪代码表示事件循环，大概是这样：\n\n```python\ndef run_forever():\n    ready_queue = [...] # 准备好的任务\n    \n    while True:\n        # 1. 执行所有准备好的任务，直到它们遇到 await 挂起\n        while ready_queue:\n            task = ready_queue.pop(0)\n            try:\n                task.step() # 推动协程执行，直到它再次 yield\n            except StopIteration:\n                pass # 协程执行完毕\n        \n        # 2. 此时没有马上能执行的任务了，去问操作系统哪些 I/O 准备好了\n        # 这个操作是阻塞的，直到有 I/O 完成或超时\n        events = epoll.poll(timeout) \n        \n        # 3. 将完成 I/O 的任务重新放入 ready_queue\n        for event in events:\n            ready_queue.append(event.task)\n```\n\n### 总结\n\n* 线程由 OS 强制切换，开销大，但能并行（如果没有 GIL）；协程由代码主动 `await` 让出控制权，开销极小，完全在单线程内运行。\n* `asyncio` 调度的核心是：生成器（保存状态、暂停、恢复）+ 操作系统 I/O 多路复用（epoll，监听事件）+ 一个死循环（调度中心）。\n* 在 asyncio 中不能写阻塞代码（如 `time.sleep()` 或 `requests.get()`）。因为只有一个线程，一旦阻塞，事件循环就会卡死，其他协程都得不到调度。必须使用异步库（如 `asyncio.sleep()` 或 `aiohttp`）。"}]}, {"sid": "teaching-004", "title": "内存屏障", "scenario": "teaching", "prompt": "解释一下 memory barrier。为什么 x86 上很多时候不用显式加 fence，ARM 上却必须加？它跟 C++ 的 memory_order 是怎么对应的？", "cands": [{"code": "f68680", "text": "内存屏障（Memory Barrier）在不同架构下的实现和开销存在差异。\n\n## 1. 内存屏障（Memory Barrier）是什么？\n\n内存屏障（Memory Barrier，也称内存栅栏）是一种硬件或软件层面的同步原语，用来控制内存操作的可见性和顺序。\n\n**主要作用：**\n- **防止指令重排**：阻止编译器和 CPU 重排屏障前后的内存操作。\n- **保证可见性**：确保屏障前的写操作对屏障后的读操作可见。\n- **同步内存**：在多核系统中，让各 CPU 核心看到一致的内存状态。\n\n## 2. 内存屏障的类型\n\n常见屏障类型（大致按约束强度排列）：\n- **全屏障**（Full Barrier）：双向屏障，LoadLoad + LoadStore + StoreLoad + StoreStore。\n- **获取屏障**（Acquire Barrier）：LoadLoad + LoadStore，保证后续操作能看到之前的结果。\n- **释放屏障**（Release Barrier）：StoreStore + LoadStore，保证之前的操作在后续操作之前完成。\n- **读写屏障**：只控制特定方向的操作顺序。\n\n## 3. x86 与 ARM 架构的差异\n\n### x86 的特点（TSO 内存模型）：\n- **强内存模型**：Total Store Order（全存储序）。\n- **对不同操作顺序的保证**：\n  - **写写顺序**（Store-Store）：保证有序。\n  - **写读顺序**（Store-Load）：会重排（需要 MFENCE）。\n  - **读读顺序**（Load-Load）：保证有序。\n  - **读写顺序**（Load-Store）：保证有序。\n- x86 处理器本身会保证大部分内存操作的顺序，因此许多情况下不需要显式屏障。\n\n**为什么 x86 经常不需要显式屏障：**\n```cpp\n// x86 上，这个代码通常不需要显式屏障\nint x = 0;\nstd::atomic<int> flag = 0;\n\n// 线程1\nx = 42;            // 普通写\nflag.store(1, std::memory_order_release);  // x86 的 store-release 通常不需要额外屏障\n\n// 线程2\nwhile (flag.load(std::memory_order_acquire) == 0) {} // acquire 语义自动满足\nint value = x;  // 能看到 x = 42\n```\n\n### ARM 的特点（弱内存模型）：\n- **宽松内存模型**：保证更弱，允许更多重排。\n- **需要显式屏障**：几乎所有顺序保证都需要程序员明确指定。\n- **更节能**：弱内存模型允许硬件做更多优化，从而节省功耗，这对移动设备很重要。\n\n**ARM 上必须加屏障：**\n```cpp\n// ARM 上，需要显式或隐式屏障\nint x = 0;\nstd::atomic<int> flag = 0;\n\n// 线程1\nx = 42;\n// ARM 需要 DMB（内存屏障）指令来保证 x 的写入在 flag 之前全局可见\nflag.store(1, std::memory_order_release);  // 会生成 DMB 指令\n\n// 线程2\nwhile (flag.load(std::memory_order_acquire) == 0) {} // 会生成 DMB 指令\nint value = x;  // 现在能看到 x = 42\n```\n\n## 4. C++ memory_order 与内存屏障的对应关系\n\nC++11 引入了 6 种内存序，对应不同的屏障强度：\n\n| C++ memory_order | 屏障类型 | x86 指令 | ARM 指令 | 保证 |\n|-----------------|----------|----------|----------|------|\n| `memory_order_seq_cst` | 全屏障 | `mfence` 或 `lock` 前缀 | `dmb ish`（全屏障） | 最强保证，完全顺序一致性 |\n| `memory_order_acquire` | 获取屏障 | 编译时屏障（无硬件指令） | `dmb ishld` | 保证后续操作看到之前结果 |\n| `memory_order_release` | 释放屏障 | 编译时屏障（无硬件指令） | `dmb ishst` | 保证之前操作在后续操作前完成 |\n| `memory_order_acq_rel` | 获取+释放屏障 | 编译时屏障 | `dmb ish` | acquire + release |\n| `memory_order_consume` | 数据依赖屏障 | 无 | 数据依赖时需屏障 | 弱于 acquire，只保证依赖关系 |\n| `memory_order_relaxed` | 无屏障 | 无 | 无 | 只保证原子性，不保证顺序 |\n\n## 5. 实际代码示例\n\n```cpp\n#include <atomic>\n#include <thread>\n\nstd::atomic<int> data_ready(0);\nint shared_data = 0;\n\n// 生产者线程\nvoid producer() {\n    shared_data = 42;\n    // release: 保证 shared_data = 42 在 data_ready = 1 之前对其他线程可见\n    data_ready.store(1, std::memory_order_release);\n}\n\n// 消费者线程\nvoid consumer() {\n    // acquire: 保证看到 data_ready = 1 时，也能看到之前的写操作\n    while (data_ready.load(std::memory_order_acquire) == 0) {\n        // 忙等待\n    }\n    // 这里一定能看到 shared_data = 42\n    int value = shared_data;\n}\n```\n\n## 6. 架构差异总结\n\n| 特性 | x86/x64 | ARM |\n|------|---------|-----|\n| **内存模型** | TSO（强模型） | Weak（弱模型） |\n| **默认屏障** | 大部分自动提供 | 很少自动提供 |\n| **指令重排** | 限制较多 | 允许更多重排 |\n| **功耗考虑** | 相对较高 | 优化节能 |\n| **显式屏障需求** | 较少（主要在 Store-Load 重排） | 频繁需要 |\n| **典型屏障指令** | MFENCE, LFENCE, SFENCE | DMB, DSB, ISB |\n\n## 7. 性能影响\n\n- **x86**：硬件已经提供了很多顺序保证，使用较弱的内存序（如 `acquire`/`release`）通常不会生成实际的硬件屏障指令，性能更好。\n- **ARM**：即使是 `acquire`/`release` 语义，也可能需要生成 `DMB` 指令，因而有额外开销。\n\n**建议：**\n1. 编写跨平台代码时，使用合适的 `memory_order`。\n2. 不要过度使用 `memory_order_seq_cst`。\n3. 理解底层架构差异，有助于编写高效代码。\n\n这些差异会影响多线程程序的性能和可移植性，编写跨平台代码时需要留意。"}, {"code": "d40a18", "text": "我来详细解释内存屏障（Memory Barrier）及其在不同架构下的差异。\n\n## 1. 内存屏障（Memory Barrier）是什么？\n\n内存屏障（也叫内存栅栏）是一种硬件或软件层面的同步原语，用于控制内存操作的可见性和顺序 数据依赖时需屏障 | 弱于acquire，只保证依赖关系 |\n| `memory_order_relaxed` | 无屏障 | 无 | 无 | 只保证原子性，不保证顺序 |\n\n## 5. 实际代码示例\n\n```cpp\n#include <atomic>\n#include <thread>\n\nstd::atomic<int> data_ready(0);\nint shared_data = 0;\n\n// 生产者线程\nvoid producer() {\n    shared_data = 42;\n    // release: 保证 shared_data = 42 在 data_ready = 1 之前对其他线程可见\n    data_ready.store(1, std::memory_order_release);\n}\n\n// 消费者线程\nvoid consumer() {\n    // acquire: 保证看到 data_ready = 1 时，也能看到之前的写操作\n    while (data_ready.load(std::memory_order_acquire) == 0) {\n        // 忙等待\n    }\n    // 这里一定能看到 shared_data = 42\n    int value = shared_data;\n}\n```\n\n## 6. 架构差异总结\n\n| 特性 | x86/x64 | ARM |\n|------|---------|-----|\n| **内存模型** | TSO（强模型） | Weak（弱模型） |\n| **默认屏障** | 大部分自动提供 | 很少自动提供 |\n| **指令重排** | 限制较多 | 允许更多重排 |\n| **功耗考虑** | 相对较高 | 优化节能 |\n| **显式屏障需求** | 较少（主要在Store-Load重排） | 频繁需要 |\n| **典型屏障指令** | MFENCE, LFENCE, SFENCE | DMB, DSB, ISB |\n\n## 7. 性能影响\n\n- **x86**：由于硬件已经提供了很多保证，使用较弱的内存序（如 `acquire/release`）通常不会生成实际的硬件屏障指令，性能更好\n- **ARM**：即使是 `acquire/release` 语义也可能需要生成 `DMB` 指令，有额外开销\n\n**建议**：\n1. 写跨平台代码时，使用合适的 `memory_order`\n2. 不要过度使用 `memory_order_seq_cst`\n3. 理解底层架构差异有助于编写高效代码\n\n理解这些差异对于编写高性能、可移植的多线程程序至关重要。"}, {"code": "004428", "text": "我来详细解释内存屏障（Memory Barrier）及其在不同架构下的差异。\n\n## 1. 内存屏障（Memory Barrier）是什么？\n\n内存屏障（也叫内存栅栏）是一种硬件或软件层面的同步原语，用于控制内存操作的可见性和顺序性。\n\n**主要作用：**\n- **防止指令重排**：阻止编译器和CPU将屏障前后的内存操作乱序执行\n- **保证可见性**：确保屏障前的所有写操作对屏障后的读操作可见\n- **同步内存**：在多核系统中，确保各个CPU核心看到一致的内存状态\n\n## 2. 内存屏障的类型\n\n常见的屏障类型（按强度递减）：\n- **全屏障**（Full Barrier）：双向屏障，LoadLoad + LoadStore + StoreLoad + StoreStore\n- **获取屏障**（Acquire Barrier）：LoadLoad + LoadStore，保证后续操作能看到之前操作的结果\n- **释放屏障**（Release Barrier）：StoreStore + LoadStore，保证之前的操作在后续操作之前完成\n- **读写屏障**：控制特定方向的顺序\n\n## 3. x86 与 ARM 架构的差异\n\n### x86 的特点（TSO 内存模型）：\n- **强内存模型**：Total Store Order（全存储序）\n- **大部分情况保证**：\n  - **写写顺序**（Store-Store）：保证有序\n  - **写读顺序**（Store-Load）：会重排（需要 MFENCE）\n  - **读读顺序**（Load-Load）：保证有序\n  - **读写顺序**（Load-Store）：保证有序\n- **自动提供许多屏障**：x86 处理器本身就保证了大部分内存操作的顺序\n\n**为什么 x86 经常不需要显式屏障：**\n```cpp\n// x86 上，这个代码通常不需要显式屏障\nint x = 0;\nstd::atomic<int> flag = 0;\n\n// 线程1\nx = 42;            // 普通写\nflag.store(1, std::memory_order_release);  // x86 的 store-release 通常不需要额外屏障\n\n// 线程2\nwhile (flag.load(std::memory_order_acquire) == 0) {} // acquire 语义自动满足\nint value = x;  // 能看到 x = 42\n```\n\n### ARM 的特点（弱内存模型）：\n- **宽松内存模型**：更弱的保证，允许更多重排\n- **需要显式屏障**：几乎所有的顺序保证都得程序员自己显式指定\n- **更节能**：弱内存模型允许硬件做更多优化，节省功耗（对移动设备重要）\n\n**ARM 上必须加屏障：**\n```cpp\n// ARM 上，需要显式或隐式屏障\nint x = 0;\nstd::atomic<int> flag = 0;\n\n// 线程1\nx = 42;\n// ARM 需要 DMB（内存屏障）指令来保证 x 的写入在 flag 之前全局可见\nflag.store(1, std::memory_order_release);  // 会生成 DMB 指令\n\n// 线程2\nwhile (flag.load(std::memory_order_acquire) == 0) {} // 会生成 DMB 指令\nint value = x;  // 现在能看到 x = 42\n```\n\n## 4. C++ memory_order 与内存屏障的对应关系\n\nC++11 引入了6种内存序，对应不同的屏障强度：\n\n| C++ memory_order | 屏障类型 | x86 指令 | ARM 指令 | 保证 |\n|-----------------|----------|----------|----------|------|\n| `memory_order_seq_cst` | 全屏障 | `mfence` 或 `lock` 前缀 | `dmb ish`（全屏障） | 最强保证，完全顺序一致性 |\n| `memory_order_acquire` | 获取屏障 | 编译时屏障（无硬件指令） | `dmb ishld` | 保证后续操作看到之前操作的结果 |\n| `memory_order_release` | 释放屏障 | 编译时屏障（无硬件指令） | `dmb ishst` | 保证之前操作在后续操作前完成 |\n| `memory_order_acq_rel` | 获取+释放屏障 | 编译时屏障 | `dmb ish` | 获取 + 释放 |\n| `memory_order_consume` | 数据依赖屏障 | 无 | 数据依赖时需屏障 | 弱于acquire，只保证依赖关系 |\n| `memory_order_relaxed` | 无屏障 | 无 | 无 | 只保证原子性，不保证顺序 |\n\n## 5. 实际代码示例\n\n```cpp\n#include <atomic>\n#include <thread>\n\nstd::atomic<int> data_ready(0);\nint shared_data = 0;\n\n// 生产者线程\nvoid producer() {\n    shared_data = 42;\n    // release: 保证 shared_data = 42 在 data_ready = 1 之前对其他线程可见\n    data_ready.store(1, std::memory_order_release);\n}\n\n// 消费者线程\nvoid consumer() {\n    // acquire: 保证看到 data_ready = 1 时，也能看到之前的写操作\n    while (data_ready.load(std::memory_order_acquire) == 0) {\n        // 忙等待\n    }\n    // 这里一定能看到 shared_data = 42\n    int value = shared_data;\n}\n```\n\n## 6. 架构差异总结\n\n| 特性 | x86/x64 | ARM |\n|------|---------|-----|\n| **内存模型** | TSO（强模型） | Weak（弱模型） |\n| **默认屏障** | 大部分自动提供 | 很少自动提供 |\n| **指令重排** | 限制较多 | 允许更多重排 |\n| **功耗考虑** | 相对较高 | 优化节能 |\n| **显式屏障需求** | 较少（主要在Store-Load重排） | 频繁需要 |\n| **典型屏障指令** | MFENCE, LFENCE, SFENCE | DMB, DSB, ISB |\n\n## 7. 性能影响\n\n- **x86**：由于硬件已经提供了很多保证，使用较弱的内存序（如 `acquire/release`）通常不会生成实际的硬件屏障指令，性能更好\n- **ARM**：即使是 `acquire/release` 语义也可能需要生成 `DMB` 指令，有额外开销\n\n**建议**：\n1. 写跨平台代码时，使用合适的 `memory_order`\n2. 不要过度使用 `memory_order_seq_cst`\n3. 理解底层架构差异有助于编写高效代码\n\n理解这些差异，对写出高性能、可移植的多线程程序很关键。"}]}, {"sid": "discussion-004", "title": "Rust 重写存储引擎", "scenario": "discussion", "prompt": "我们是做存储引擎的，现有代码是 C++。用 Rust 重写值不值得？", "cands": [{"code": "7eec3e", "text": "不一定值得“全量重写”，但**值得认真评估在新模块/高风险模块中引入 Rust**。对于存储引擎这种系统软件，Rust 的收益是真实的，但重写成本和风险也非常大。\n\n## Rust 可能带来的收益\n\n### 1. 内存安全和并发安全\n\n存储引擎常见问题包括：\n\n- use-after-free\n- double free\n- iterator / snapshot 生命周期错误\n- buffer / page cache 引用悬挂\n- WAL / compaction 后对象失效\n- 多线程下的数据竞争\n- 锁顺序、引用计数、异步回调生命周期问题\n\nRust 在这些方面有明显优势。尤其是：\n\n- buffer pool / block cache\n- iterator / snapshot\n- async IO 回调\n- compaction pipeline\n- WAL writer / recovery\n- background task scheduler\n\n这些模块如果用 C++ 写得很复杂，Rust 可以显著减少某类 bug。\n\n### 2. 长期维护成本可能降低\n\n如果团队长期维护一个复杂存储引擎，Rust 的类型系统和 borrow checker 可以把很多约束编码进代码里。\n\n例如：\n\n- page pin 之后才能访问 page\n- transaction 生命周期必须短于 snapshot\n- iterator 不能越过 owning context\n- mutable access 必须经过 latch / guard\n- WAL record buffer 不能在提交前释放\n\n这些约束在 C++ 里通常依赖 code review、注释和测试；Rust 可以让编译器帮你检查一部分。\n\n### 3. 对新团队成员更友好\n\nC++ 存储引擎代码里很多隐含约定很难掌握。Rust 如果设计得好，API 会更“自解释”。\n\n例如：\n\n```rust\nlet guard = page_cache.pin(page_id)?;\nlet page = guard.read();\n```\n\n`guard` 的生命周期自然控制 page 的有效性，比裸指针或 shared_ptr 约定更明确。\n\n---\n\n## Rust 的代价和风险\n\n### 1. 全量重写风险极高\n\n存储引擎不是普通业务系统。它的复杂性在于：\n\n- 数据格式兼容\n- 崩溃恢复语义\n- WAL 顺序\n- fsync / fdatasync / direct IO 细节\n- compaction 策略\n- 并发控制\n- 性能尾延迟\n- cache 行为\n- 历史 bug workaround\n- 线上数据兼容\n\n全量重写很容易出现：\n\n- 性能回退\n- corner case 数据损坏\n- recovery 行为不一致\n- 文件格式兼容问题\n- 长时间双维护\n- 团队生产力下降\n\n除非现有 C++ 代码已经严重不可维护，否则不建议直接“推倒重写”。\n\n### 2. Rust 学习曲线真实存在\n\n做存储引擎会碰到 Rust 的困难部分：\n\n- 自引用结构\n- intrusive list / LRU\n- lock-free 数据结构\n- buffer pin/unpin\n- mmap / direct IO\n- unsafe 封装\n- async 与生命周期\n- FFI\n- 与 C++ 共存\n\nRust 不是不用思考内存管理，而是把很多设计问题提前暴露出来。团队需要时间适应。\n\n### 3. 某些底层结构仍然需要 `unsafe`\n\n例如：\n\n- 自定义 allocator\n- page cache\n- mmap\n- aligned buffer\n- io_uring\n- SIMD\n- lock-free queue\n- zero-copy 解析\n- 指针稳定的数据结构\n\nRust 可以减少 unsafe 的范围，但不能完全消除 unsafe。关键是能否把 unsafe 封装在小模块内，并做严格测试。\n\n### 4. 性能不一定自动更好\n\nRust 通常可以做到 C++ 级别性能，但不会因为语言切换就自动变快。\n\n性能还取决于：\n\n- 数据布局\n- cache locality\n- 分配策略\n- 锁粒度\n- IO 模型\n- compaction 策略\n- batch 策略\n- 编译参数\n- profiling 水平\n\n如果 C++ 现有实现已经高度优化，Rust 重写可能初期更慢。\n\n---\n\n## 什么时候值得用 Rust？\n\n我会按下面几个问题判断。\n\n### 值得考虑 Rust 的情况\n\n如果你们符合以下条件，Rust 很值得：\n\n1. **现有 C++ 内存/并发 bug 成本很高**\n   - 数据损坏\n   - crash\n   - 线上难复现\n   - ASAN/TSAN 经常抓到问题\n\n2. **代码会长期演进**\n   - 不只是维护，而是未来几年还要持续增加功能。\n\n3. **团队愿意投入 Rust 能力建设**\n   - 至少有几个人能深入 Rust、unsafe、性能优化、FFI。\n\n4. **可以模块化迁移**\n   - 不需要一次性重写整个引擎。\n\n5. **有完善测试基础**\n   - crash test\n   - fault injection\n   - Jepsen/一致性测试\n   - fuzzing\n   - recovery test\n   - 历史数据兼容测试\n   - 性能回归测试\n\n### 不太值得的情况\n\n如果是下面情况，就不建议重写：\n\n1. C++ 代码已经稳定，bug 主要不是内存安全问题。\n2. 团队 Rust 经验很弱，且没有时间培养。\n3. 产品压力大，无法接受长期双栈维护。\n4. 现有系统文件格式、边界行为复杂但测试不足。\n5. 目标只是“Rust 更现代”，没有明确收益指标。\n\n---\n\n## 更现实的策略：不要全量重写，先渐进式引入\n\n我更建议采用这种路线：\n\n### 阶段 1：新组件用 Rust\n\n从边界清晰、收益明显的模块开始：\n\n- manifest / metadata 管理\n- WAL parser / writer\n- SSTable builder / reader\n- checksum / compression 封装\n- bloom filter\n- compaction picker\n- config / statistics\n- background job framework\n\n这些模块相对容易定义接口，适合 Rust 化。\n\n### 阶段 2：高风险模块 Rust 化\n\n如果阶段 1 成功，可以考虑：\n\n- block cache\n- iterator stack\n- snapshot / transaction handle\n- recovery pipeline\n- memtable 管理\n- async IO 层\n\n这些模块更核心，迁移前需要强测试。\n\n### 阶段 3：决定是否扩大范围\n\n当你们已经有：\n\n- Rust 工程体系\n- FFI 规范\n- 性能基准\n- crash/recovery 测试\n- 团队熟练度\n\n再判断是否继续替换更多 C++。\n\n---\n\n## C++ 与 Rust 混合架构要注意\n\n如果选择渐进式迁移，需要提前设计边界。\n\n### FFI 边界应尽量粗\n\n不要让 C++ 和 Rust 每条记录、每个 key-value 操作都跨一次 FFI。\n\n更好的边界是：\n\n- 批量接口\n- 文件级接口\n- iterator-level 接口\n- job-level 接口\n\n例如：\n\n```text\nC++ engine\n  -> Rust SST reader\n  -> Rust returns iterator handle\n  -> C++ pulls batches\n```\n\n而不是：\n\n```text\nC++ 每读一个 key 调一次 Rust\n```\n\n### 明确所有权\n\n跨语言边界必须明确：\n\n- 谁分配\n- 谁释放\n- buffer 是否可变\n- 生命周期多长\n- 是否允许异步持有\n- 是否线程安全\n\n否则 Rust 的安全性会在 FFI 边界被削弱。\n\n### 统一错误模型\n\n需要定义：\n\n- 错误码\n- panic 处理\n- IO error 映射\n- corruption error\n- retryable/non-retryable error\n- 是否允许 Rust panic 穿过 C++ 边界：通常不允许\n\n---\n\n## 一个判断框架\n\n可以给每个模块打分：\n\n| 维度 | 问题 |\n|---|---|\n| 安全收益 | 这个模块是否经常出现生命周期、并发、内存问题？ |\n| 边界清晰度 | 能否独立封装？ |\n| 性能敏感度 | 重写后性能风险多大？ |\n| 测试覆盖 | 是否有充分测试证明行为一致？ |\n| 团队熟悉度 | 团队是否能维护 Rust 版本？ |\n| 迁移成本 | 是否涉及大量历史兼容逻辑？ |\n\n优先迁移：\n\n> 安全收益高、边界清晰、测试充分、性能风险可控的模块。\n\n---\n\n## 我的建议\n\n如果你们的存储引擎是核心产品，我不建议直接问“要不要用 Rust 重写”，而是问：\n\n> 哪些模块用 Rust 重写可以在 3～6 个月内明确降低 bug 风险或维护成本？\n\n比较稳妥的结论是：\n\n1. **不要全量重写现有 C++ 存储引擎。**\n2. **新模块可以优先用 Rust。**\n3. **边界清晰的组件可以试点 Rust。**\n4. **先建立 FFI、测试、benchmark、fault injection。**\n5. **只有在试点成功后，再扩大 Rust 使用范围。**\n\n如果你们现在 C++ 代码 bug 很多、维护困难、未来还要长期演进，那么 Rust 非常值得投入；但如果现有引擎稳定、团队主要问题是性能和算法，而不是内存/并发安全，那么 Rust 重写未必是最高优先级。"}, {"code": "cefe15", "text": "不一定值得“全量重写”，但**值得认真评估在新模块、高风险模块中引入 Rust**。对存储引擎这类系统软件，Rust 的收益是真实的，但重写成本和风险也非常大。\n\n## Rust 可能带来的收益\n\n### 1. 内存安全和并发安全\n\n存储引擎的常见问题包括：\n\n- use-after-free\n- double free\n- iterator / snapshot 生命周期错误\n- buffer / page cache 引用悬挂\n- WAL / compaction 后对象失效\n- 多线程下的数据竞争\n- 锁顺序、引用计数、异步回调生命周期问题\n\nRust 在这些方面优势明显，尤其是下面这些模块：\n\n- buffer pool / block cache\n- iterator / snapshot\n- async IO 回调\n- compaction pipeline\n- WAL writer / recovery\n- background task scheduler\n\n这些模块用 C++ 写起来往往很复杂，Rust 能显著减少这类 bug。\n\n### 2. 长期维护成本可能降低\n\n如果团队要长期维护一个复杂的存储引擎，Rust 的类型系统和 borrow checker 可以把很多约束写进代码里。\n\n例如：\n\n- page pin 之后才能访问 page\n- transaction 生命周期必须短于 snapshot\n- iterator 不能越过 owning context\n- mutable access 必须经过 latch / guard\n- WAL record buffer 不能在提交前释放\n\n这些约束在 C++ 里通常靠 code review、注释和测试来保证；Rust 可以让编译器帮你检查一部分。\n\n### 3. 对新团队成员更友好\n\nC++ 存储引擎代码里有很多隐含约定，很难掌握。Rust 如果设计得好，API 会更“自解释”。\n\n例如：\n\n```rust\nlet guard = page_cache.pin(page_id)?;\nlet page = guard.read();\n```\n\n`guard` 的生命周期自然控制 page 的有效性，比裸指针或 shared_ptr 的约定更明确。\n\n---\n\n## Rust 的代价和风险\n\n### 1. 全量重写风险极高\n\n存储引擎不是普通业务系统。它的复杂性在于：\n\n- 数据格式兼容\n- 崩溃恢复语义\n- WAL 顺序\n- fsync / fdatasync / direct IO 细节\n- compaction 策略\n- 并发控制\n- 性能尾延迟\n- cache 行为\n- 历史 bug workaround\n- 线上数据兼容\n\n全量重写很容易出现：\n\n- 性能回退\n- corner case 数据损坏\n- recovery 行为不一致\n- 文件格式兼容问题\n- 长时间双维护\n- 团队生产力下降\n\n除非现有 C++ 代码已经严重不可维护，否则不建议直接推倒重写。\n\n### 2. Rust 学习曲线真实存在\n\n做存储引擎会碰到 Rust 的困难部分：\n\n- 自引用结构\n- intrusive list / LRU\n- lock-free 数据结构\n- buffer pin/unpin\n- mmap / direct IO\n- unsafe 封装\n- async 与生命周期\n- FFI\n- 与 C++ 共存\n\nRust 不是不用思考内存管理，而是把很多设计问题提前暴露出来。团队需要时间适应。\n\n### 3. 某些底层结构仍然需要 `unsafe`\n\n例如：\n\n- 自定义 allocator\n- page cache\n- mmap\n- aligned buffer\n- io_uring\n- SIMD\n- lock-free queue\n- zero-copy 解析\n- 指针稳定的数据结构\n\nRust 可以减少 unsafe 的范围，但不能完全消除 unsafe。关键是能否把 unsafe 封装在小模块内，并做严格测试。\n\n### 4. 性能不一定自动更好\n\nRust 通常可以做到 C++ 级别的性能，但不会因为换了语言就自动变快。\n\n性能还取决于：\n\n- 数据布局\n- cache locality\n- 分配策略\n- 锁粒度\n- IO 模型\n- compaction 策略\n- batch 策略\n- 编译参数\n- profiling 水平\n\n如果 C++ 现有实现已经高度优化，Rust 重写可能初期更慢。\n\n---\n\n## 什么时候值得用 Rust？\n\n我会按下面几个问题判断。\n\n### 值得考虑 Rust 的情况\n\n如果你们符合以下条件，Rust 很值得：\n\n1. **现有 C++ 内存/并发 bug 成本很高**\n   - 数据损坏\n   - crash\n   - 线上难复现\n   - ASAN/TSAN 经常抓到问题\n\n2. **代码会长期演进**\n   - 不只是维护，未来几年还要持续增加功能。\n\n3. **团队愿意投入 Rust 能力建设**\n   - 至少有几个人能深入 Rust、unsafe、性能优化和 FFI。\n\n4. **可以模块化迁移**\n   - 不需要一次性重写整个引擎。\n\n5. **有完善的测试基础**\n   - crash test\n   - fault injection\n   - Jepsen/一致性测试\n   - fuzzing\n   - recovery test\n   - 历史数据兼容测试\n   - 性能回归测试\n\n### 不太值得的情况\n\n如果是下面这些情况，不建议重写：\n\n1. C++ 代码已经稳定，bug 主要不是内存安全问题。\n2. 团队 Rust 经验很弱，又没有时间培养。\n3. 产品压力大，无法接受长期双栈维护。\n4. 现有系统文件格式、边界行为复杂，但测试不足。\n5. 目标只是“Rust 更现代”，没有明确的收益指标。\n\n---\n\n## 更现实的策略：不要全量重写，先渐进式引入\n\n我更建议走渐进式路线：\n\n### 阶段 1：新组件用 Rust\n\n从边界清晰、收益明显的模块开始：\n\n- manifest / metadata 管理\n- WAL parser / writer\n- SSTable builder / reader\n- checksum / compression 封装\n- bloom filter\n- compaction picker\n- config / statistics\n- background job framework\n\n这些模块相对容易定义接口，适合 Rust 化。\n\n### 阶段 2：高风险模块 Rust 化\n\n如果阶段 1 成功，可以考虑：\n\n- block cache\n- iterator stack\n- snapshot / transaction handle\n- recovery pipeline\n- memtable 管理\n- async IO 层\n\n这些模块更核心，迁移前需要充分的测试。\n\n### 阶段 3：决定是否扩大范围\n\n当你们已经有了：\n\n- Rust 工程体系\n- FFI 规范\n- 性能基准\n- crash/recovery 测试\n- 团队熟练度\n\n再判断是否继续替换更多 C++。\n\n---\n\n## C++ 与 Rust 混合架构要注意\n\n如果选择渐进式迁移，需要提前设计边界。\n\n### FFI 边界应尽量粗\n\n不要让 C++ 和 Rust 每条记录、每个 key-value 操作都跨一次 FFI。\n\n更好的边界是：\n\n- 批量接口\n- 文件级接口\n- iterator-level 接口\n- job-level 接口\n\n例如：\n\n```text\nC++ engine\n  -> Rust SST reader\n  -> Rust returns iterator handle\n  -> C++ pulls batches\n```\n\n而不是：\n\n```text\nC++ 每读一个 key 调一次 Rust\n```\n\n### 明确所有权\n\n跨语言边界必须明确：\n\n- 谁分配\n- 谁释放\n- buffer 是否可变\n- 生命周期多长\n- 是否允许异步持有\n- 是否线程安全\n\n否则 Rust 的安全性会在 FFI 边界被削弱。\n\n### 统一错误模型\n\n需要定义：\n\n- 错误码\n- panic 处理\n- IO error 映射\n- corruption error\n- retryable/non-retryable error\n- 是否允许 Rust panic 穿过 C++ 边界：通常不允许\n\n---\n\n## 一个判断框架\n\n可以给每个模块打分：\n\n| 维度 | 问题 |\n|---|---|\n| 安全收益 | 这个模块是否经常出现生命周期、并发、内存问题？ |\n| 边界清晰度 | 能否独立封装？ |\n| 性能敏感度 | 重写后性能风险多大？ |\n| 测试覆盖 | 是否有充分测试证明行为一致？ |\n| 团队熟悉度 | 团队是否能维护 Rust 版本？ |\n| 迁移成本 | 是否涉及大量历史兼容逻辑？ |\n\n优先迁移：\n\n> 安全收益高、边界清晰、测试充分、性能风险可控的模块。\n\n---\n\n## 我的建议\n\n如果你们的存储引擎是核心产品，我不建议直接问“要不要用 Rust 重写”，而是问：\n\n> 哪些模块用 Rust 重写可以在 3～6 个月内明确降低 bug 风险或维护成本？\n\n比较稳妥的结论是：\n\n1. 不要全量重写现有 C++ 存储引擎。\n2. 新模块可以优先用 Rust。\n3. 边界清晰的组件可以试点 Rust。\n4. 先建立 FFI、测试、benchmark、fault injection。\n5. 只有在试点成功后，再扩大 Rust 的使用范围。\n\n如果你们现在的 C++ 代码 bug 很多、维护困难、未来还要长期演进，那么 Rust 非常值得投入；但如果现有引擎稳定、团队的主要问题是性能和算法，而不是内存/并发安全，那么 Rust 重写未必是最高优先级。"}, {"code": "cb06d8", "text": "不一定值得“全量重写”，但**值得认真评估在新模块/高风险模块中引入 Rust**。对于存储引擎这种系统软件，Rust 的收益是真实的，但重写成本和风险也非常大。\n\n## Rust 可能带来的收益\n\n### 1. 内存安全和并发安全\n\n存储引擎常见问题包括：\n\n- use-after-free\n- double free\n- iterator / snapshot 生命周期错误\n- buffer / page cache 的悬空引用\n- WAL / compaction 后对象失效\n- 多线程下的数据竞争\n- 锁顺序、引用计数、异步回调生命周期问题\n\nRust 在这些方面有明显优势。尤其是：\n\n- buffer pool / block cache\n- iterator / snapshot\n- async IO 回调\n- compaction pipeline\n- WAL writer / recovery\n- background task scheduler\n\n这些模块如果用 C++ 写得很复杂，Rust 可以显著减少某类 bug。\n\n### 2. 长期维护成本可能降低\n\n如果团队长期维护一个复杂存储引擎，Rust 的类型系统和 borrow checker 可以把很多约束编码进代码里。\n\n例如：\n\n- page pin 之后才能访问 page\n- transaction 生命周期必须短于 snapshot\n- iterator 不能越过 owning context\n- mutable access 必须经过 latch / guard\n- WAL record buffer 不能在提交前释放\n\n这些约束在 C++ 里通常依赖 code review、注释和测试；Rust 可以让编译器帮你检查一部分。\n\n### 3. 对新团队成员更友好\n\nC++ 存储引擎代码里很多隐含约定很难掌握。Rust 如果设计得好，API 会更“自解释”。\n\n例如：\n\n```rust\nlet guard = page_cache.pin(page_id)?;\nlet page = guard.read();\n```\n\n`guard` 的生命周期本身就能决定 page 什么时候有效，比裸指针或 shared_ptr 靠约定来保证更明确。\n\n---\n\n## Rust 的代价和风险\n\n### 1. 全量重写风险极高\n\n存储引擎不是普通业务系统。它的复杂性在于：\n\n- 数据格式兼容\n- 崩溃恢复语义\n- WAL 顺序\n- fsync / fdatasync / direct IO 细节\n- compaction 策略\n- 并发控制\n- 性能尾延迟\n- cache 行为\n- 历史 bug workaround\n- 线上数据兼容\n\n全量重写很容易出现：\n\n- 性能回退\n- 边界情况下的数据损坏\n- recovery 行为不一致\n- 文件格式兼容问题\n- 长时间双维护\n- 团队生产力下降\n\n除非现有 C++ 代码已经严重不可维护，否则不建议直接“推倒重写”。\n\n### 2. Rust 学习曲线真实存在\n\n做存储引擎会碰到 Rust 的困难部分：\n\n- 自引用结构\n- intrusive list / LRU\n- lock-free 数据结构\n- buffer pin/unpin\n- mmap / direct IO\n- unsafe 封装\n- async 与生命周期\n- FFI\n- 与 C++ 共存\n\nRust 不是不用思考内存管理，而是把很多设计问题提前暴露出来。团队需要时间适应。\n\n### 3. 某些底层结构仍然需要 `unsafe`\n\n例如：\n\n- 自定义 allocator\n- page cache\n- mmap\n- aligned buffer\n- io_uring\n- SIMD\n- lock-free queue\n- zero-copy 解析\n- 指针稳定的数据结构\n\nRust 可以减少 unsafe 的范围，但不能完全消除 unsafe。关键是能否把 unsafe 封装在小模块内，并做严格测试。\n\n### 4. 性能不一定自动更好\n\nRust 通常可以做到 C++ 级别性能，但不会因为语言切换就自动变快。\n\n性能还取决于：\n\n- 数据布局\n- cache locality\n- 分配策略\n- 锁粒度\n- IO 模型\n- compaction 策略\n- batch 策略\n- 编译参数\n- profiling 水平\n\n如果 C++ 现有实现已经高度优化，Rust 重写可能初期更慢。\n\n---\n\n## 什么时候值得用 Rust？\n\n我会按下面几个问题判断。\n\n### 值得考虑 Rust 的情况\n\n如果你们符合以下条件，Rust 很值得：\n\n1. **现有 C++ 内存/并发 bug 成本很高**\n   - 数据损坏\n   - crash\n   - 线上难复现\n   - ASAN/TSAN 经常抓到问题\n\n2. **代码会长期演进**\n   - 不只是维护，而是未来几年还要持续增加功能。\n\n3. **团队愿意投入 Rust 能力建设**\n   - 至少有几个人能深入 Rust、unsafe、性能优化、FFI。\n\n4. **可以模块化迁移**\n   - 不需要一次性重写整个引擎。\n\n5. **有完善测试基础**\n   - crash test\n   - fault injection\n   - Jepsen/一致性测试\n   - fuzzing\n   - recovery test\n   - 历史数据兼容测试\n   - 性能回归测试\n\n### 不太值得的情况\n\n如果是下面情况，就不建议重写：\n\n1. C++ 代码已经稳定，bug 主要不是内存安全问题。\n2. 团队 Rust 经验很弱，且没有时间培养。\n3. 产品压力大，无法接受长期双栈维护。\n4. 现有系统文件格式、边界行为复杂但测试不足。\n5. 目标只是“Rust 更现代”，没有明确收益指标。\n\n---\n\n## 更现实的策略：不要全量重写，先渐进式引入\n\n我更建议采用这种路线：\n\n### 阶段 1：新组件用 Rust\n\n从边界清晰、收益明显的模块开始：\n\n- manifest / metadata 管理\n- WAL parser / writer\n- SSTable builder / reader\n- checksum / compression 封装\n- bloom filter\n- compaction picker\n- config / statistics\n- background job framework\n\n这些模块相对容易定义接口，适合 Rust 化。\n\n### 阶段 2：高风险模块 Rust 化\n\n如果阶段 1 成功，可以考虑：\n\n- block cache\n- iterator stack\n- snapshot / transaction handle\n- recovery pipeline\n- memtable 管理\n- async IO 层\n\n这些模块更核心，迁移前需要强测试。\n\n### 阶段 3：决定是否扩大范围\n\n当你们已经有：\n\n- Rust 工程体系\n- FFI 规范\n- 性能基准\n- crash/recovery 测试\n- 团队熟练度\n\n再判断是否继续替换更多 C++。\n\n---\n\n## C++ 与 Rust 混合架构要注意\n\n如果选择渐进式迁移，需要提前设计边界。\n\n### FFI 边界应尽量粗粒度\n\n不要让 C++ 和 Rust 每条记录、每个 key-value 操作都跨一次 FFI。\n\n更好的边界是：\n\n- 批量接口\n- 文件级接口\n- iterator-level 接口\n- job-level 接口\n\n例如：\n\n```text\nC++ engine\n  -> Rust SST reader\n  -> Rust returns iterator handle\n  -> C++ pulls batches\n```\n\n而不是：\n\n```text\nC++ 每读一个 key 调一次 Rust\n```\n\n### 明确所有权\n\n跨语言边界必须明确：\n\n- 谁分配\n- 谁释放\n- buffer 是否可变\n- 生命周期多长\n- 是否允许异步持有\n- 是否线程安全\n\n否则 Rust 的安全性会在 FFI 边界被削弱。\n\n### 统一错误模型\n\n需要定义：\n\n- 错误码\n- panic 处理\n- IO error 映射\n- corruption error\n- retryable/non-retryable error\n- 是否允许 Rust panic 穿过 C++ 边界：通常不允许\n\n---\n\n## 一个判断框架\n\n可以给每个模块打分：\n\n| 维度 | 问题 |\n|---|---|\n| 安全收益 | 这个模块是否经常出现生命周期、并发、内存问题？ |\n| 边界清晰度 | 能否独立封装？ |\n| 性能敏感度 | 重写后性能风险多大？ |\n| 测试覆盖 | 是否有充分测试证明行为一致？ |\n| 团队熟悉度 | 团队是否能维护 Rust 版本？ |\n| 迁移成本 | 是否涉及大量历史兼容逻辑？ |\n\n优先迁移：\n\n> 安全收益高、边界清晰、测试充分、性能风险可控的模块。\n\n---\n\n## 我的建议\n\n如果你们的存储引擎是核心产品，我不建议直接问“要不要用 Rust 重写”，而是问：\n\n> 哪些模块用 Rust 重写可以在 3～6 个月内明确降低 bug 风险或维护成本？\n\n比较稳妥的结论是：\n\n1. **不要全量重写现有 C++ 存储引擎。**\n2. **新模块可以优先用 Rust。**\n3. **边界清晰的组件可以试点 Rust。**\n4. **先建立 FFI、测试、benchmark、fault injection。**\n5. **只有在试点成功后，再扩大 Rust 使用范围。**\n\n如果你们现在 C++ 代码 bug 很多、维护困难、未来还要长期演进，那么 Rust 非常值得投入；但如果现有引擎稳定、团队主要问题是性能和算法，而不是内存/并发安全，那么 Rust 重写未必是最高优先级。"}]}]};
const LETTERS = ["A","B","C","D","E","F"];
const STORE = "nafBlind:" + (DATA && DATA.run);
const state = { i: 0, tab: 0, split: false, right: 1, votes: {}, seen: {}, started: {} };

// ---- 持久化（浏览器存储可能不可用，失败时只保留在内存里，靠导出兜底） ----
function save() { try { localStorage.setItem(STORE, JSON.stringify({ votes: state.votes, seen: state.seen, i: state.i })); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE) || "null"); if (s) { state.votes = s.votes || {}; state.seen = s.seen || {}; state.i = Math.min(s.i || 0, DATA.items.length - 1); } } catch (e) {}
}

// ---- 极简 Markdown 渲染（先转义，离线可用） ----
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s)
    .replace(/\*\*(\S(?:.*?\S)?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*(?!\s)([^*]*?[^*\s])\*(?![*\w])/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, t, u) => /^(https?:|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);
  return s.replace(/\u0000(\d+)\u0000/g, (_, k) => "<code>" + esc(codes[+k]) + "</code>");
}
function md(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n"); const out = []; let i = 0;
  const isTable = (a, b) => /^\s*\|.*\|\s*$/.test(a) && /^\s*\|?\s*:?-{2,}/.test(b || "");
  while (i < lines.length) {
    let l = lines[i];
    if (/^\s*(```|~~~)/.test(l)) { const f = l.trim().slice(0, 3); const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(f)) buf.push(lines[i++]); i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue; }
    if (/^\s*$/.test(l)) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(m[1].length + 1, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (isTable(l, lines[i + 1])) {
      const row = r => r.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => inline(c.trim()));
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push("<table><thead><tr>" + head.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table>"); continue; }
    if (/^\s*>/.test(l)) { const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + md(buf.join("\n")) + "</blockquote>"); continue; }
    if (/^\s*([-*+]|\d{1,3}[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l); const items = [];
      const start = ordered ? parseInt(l.match(/^\s*(\d{1,3})/)[1], 10) : 1;
      const sameKind = s => ordered ? /^\s*\d{1,3}[.)]\s+/.test(s) : /^\s*[-*+]\s+/.test(s);
      while (i < lines.length) {
        if (/^\s*$/.test(lines[i])) {  // 松散列表：项与项之间隔空行时仍是同一个列表，编号不重置
          let j = i; while (j < lines.length && /^\s*$/.test(lines[j])) j++;
          if (j < lines.length && items.length && sameKind(lines[j])) { i = j; } else break;
        }
        if (!sameKind(lines[i])) break;
        let t = lines[i++].replace(/^\s*([-*+]|\d{1,3}[.)])\s+/, "").replace(/^\[([ xX])\]\s+/, (_, c) => c.trim() ? "☑ " : "☐ ");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d{1,3}[.)])\s+/.test(lines[i])) t += " " + lines[i++].trim();
        items.push("<li>" + inline(t) + "</li>"); }
      out.push((ordered ? (start !== 1 ? `<ol start="${start}">` : "<ol>") : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>")); continue; }
    const buf = [l]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|\s*```|\s*>|\s*([-*+]|\d{1,3}[.)])\s+|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
  }
  return out.join("\n");
}

// ---- 渲染 ----
const $ = id => document.getElementById(id);
const item = () => DATA.items[state.i];
const vote = () => (state.votes[item().sid] ||= { best: null, worst: null, tie: false, note: "", seconds: 0 });

function ratio(el) { const max = el.scrollHeight - el.clientHeight; return max > 0 ? el.scrollTop / max : 0; }
function setRatio(el, r) { el.scrollTop = r * (el.scrollHeight - el.clientHeight); }

function renderProgress() {
  $("progress").innerHTML = DATA.items.map((it, k) => {
    const v = state.votes[it.sid]; const done = v && v.best;
    return `<button class="dot ${done ? "done" : ""} ${k === state.i ? "cur" : ""}" data-k="${k}" aria-label="第 ${k + 1} 篇${done ? "，已投" : ""}">${k + 1}</button>`;
  }).join("");
}
function renderTabs() {
  const it = item(); const v = vote(); const seen = state.seen[it.sid] || [];
  $("tabs").querySelectorAll(".tab").forEach(t => t.remove());
  const frag = document.createDocumentFragment();
  it.cands.forEach((c, k) => {
    const b = document.createElement("button");
    b.className = "tab" + (v.best === c.code ? " best" : ""); b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(k === state.tab && !state.split || state.split && k === state.tab));
    b.innerHTML = `${LETTERS[k]}<span class="seen ${seen.includes(k) ? "on" : ""}" title="${seen.includes(k) ? "已读过" : "未读"}"></span>`;
    b.onclick = () => showTab(k); frag.appendChild(b);
  });
  $("tabs").insertBefore(frag, $("tabs").querySelector(".modes"));
}
function markSeen(k) { const s = (state.seen[item().sid] ||= []); if (!s.includes(k)) { s.push(k); save(); } }
function showTab(k, keepRatio = true) {
  const r = keepRatio ? ratio($("paneL")) : 0;
  state.tab = k; $("docL").innerHTML = md(item().cands[k].text); $("selL").value = k;
  requestAnimationFrame(() => setRatio($("paneL"), r));
  markSeen(k); renderTabs(); renderVote();
}
function showRight(k, keepRatio = true) { const r = keepRatio ? ratio($("paneR")) : 0; state.right = k; $("docR").innerHTML = md(item().cands[k].text); $("selR").value = k; requestAnimationFrame(() => setRatio($("paneR"), r)); markSeen(k); renderTabs(); }
function renderVote() {
  const it = item(); const v = vote(); const seen = state.seen[it.sid] || [];
  const mk = (kind) => it.cands.map((c, k) => `<button class="pick ${kind}" data-kind="${kind}" data-code="${c.code}" aria-pressed="${v[kind] === c.code}" aria-label="${kind === "best" ? "最好读" : "最难读"}：${LETTERS[k]}">${LETTERS[k]}</button>`).join("");
  $("bestPicks").innerHTML = mk("best"); $("worstPicks").innerHTML = mk("worst");
  $("tie").checked = !!v.tie; $("note").value = v.note || "";
  const unread = it.cands.length - seen.length;
  const st = $("status");
  if (unread > 0) { st.textContent = `还有 ${unread} 个版本没打开过。建议每版至少读完一遍再选。`; st.className = "status warn"; }
  else if (!v.best) { st.textContent = "4 个版本都读过了，选出最好读的一版就可以去下一篇。"; st.className = "status"; }
  else { st.textContent = "已记录。可以去下一篇，也可以随时回来改。"; st.className = "status"; }
  $("prevBtn").disabled = state.i === 0;
  $("nextBtn").textContent = state.i === DATA.items.length - 1 ? "完成" : "下一篇";
}
function renderItem() {
  const it = item();
  $("brief").innerHTML = `第 ${state.i + 1} / ${DATA.items.length} 篇：<b>${esc(it.title)}</b>。下面是同一篇内容的 ${it.cands.length} 个版本，来源已隐去，顺序是随机的。` +
    (it.prompt ? `<br>当时的提问：${esc(it.prompt)}` : "");
  const opts = it.cands.map((_, k) => `<option value="${k}">${LETTERS[k]}</option>`).join("");
  $("selL").innerHTML = opts; $("selR").innerHTML = opts;
  state.tab = 0; state.right = Math.min(1, it.cands.length - 1);
  $("paneL").scrollTop = 0; $("paneR").scrollTop = 0;
  showTab(0, false); if (state.split) showRight(state.right, false);
  state.started[it.sid] = Date.now();
  renderProgress();
}
function go(k) {
  tick(); if (k < 0) return;
  if (k >= DATA.items.length) { $("main").classList.add("hidden"); $("finish").classList.remove("hidden"); return; }
  state.i = k; save(); $("main").classList.remove("hidden"); $("finish").classList.add("hidden"); renderItem();
}
function tick() { const it = item(); const t0 = state.started[it.sid]; if (t0) { vote().seconds = (vote().seconds || 0) + Math.round((Date.now() - t0) / 1000); state.started[it.sid] = Date.now(); save(); } }
function setSplit(on) {
  state.split = on; $("panes").classList.toggle("split", on); $("paneR").classList.toggle("hidden", !on);
  $("modeSingle").setAttribute("aria-pressed", String(!on)); $("modeSplit").setAttribute("aria-pressed", String(on));
  if (on) { const k = state.tab === state.right ? (state.tab + 1) % item().cands.length : state.right; showRight(k); }
}

// ---- 事件 ----
document.addEventListener("click", e => {
  const p = e.target.closest(".pick"); if (p) { const v = vote(); const kind = p.dataset.kind, code = p.dataset.code;
    v[kind] = v[kind] === code ? null : code;
    if (v.best && v.best === v.worst) v[kind === "best" ? "worst" : "best"] = null;
    save(); renderVote(); renderTabs(); renderProgress(); return; }
  const d = e.target.closest(".dot"); if (d) go(+d.dataset.k);
});
$("tie").onchange = e => { vote().tie = e.target.checked; save(); };
$("note").oninput = e => { vote().note = e.target.value; save(); };
$("prevBtn").onclick = () => go(state.i - 1);
$("nextBtn").onclick = () => go(state.i + 1);
$("backBtn").onclick = () => go(DATA.items.length - 1);
$("modeSingle").onclick = () => setSplit(false);
$("modeSplit").onclick = () => setSplit(true);
$("selL").onchange = e => showTab(+e.target.value);
$("selR").onchange = e => showRight(+e.target.value);
let syncing = false;
["paneL", "paneR"].forEach((id, k) => $(id).addEventListener("scroll", () => {
  if (!state.split || syncing) return; syncing = true;
  setRatio($(k ? "paneL" : "paneR"), ratio($(id))); requestAnimationFrame(() => syncing = false);
}));
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea,input,select")) return;
  if (/^[1-6]$/.test(e.key) && +e.key <= item().cands.length) showTab(+e.key - 1);
  else if (e.key === "ArrowRight") go(state.i + 1);
  else if (e.key === "ArrowLeft") go(state.i - 1);
});
$("exportBtn").onclick = () => {
  tick();
  const done = DATA.items.filter(it => state.votes[it.sid] && state.votes[it.sid].best).length;
  const blob = new Blob([JSON.stringify({ run: DATA.run, exported_at: new Date().toISOString(), completed: done, total: DATA.items.length, votes: state.votes }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "blind_votes.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  $("status").textContent = `已导出 ${done} / ${DATA.items.length} 篇的投票。`; $("status").className = "status";
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (j.run !== DATA.run) throw new Error("这份进度属于另一轮盲测（" + j.run + "）");
    state.votes = j.votes || {}; save(); renderItem(); $("status").textContent = "进度已载入。"; }
  catch (err) { $("status").textContent = "载入失败：" + err.message; $("status").className = "status warn"; }
  e.target.value = "";
};
window.addEventListener("beforeunload", tick);

load(); renderItem();
</script>
</body>
</html>
